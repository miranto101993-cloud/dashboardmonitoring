// ============================================================
// YTD TREND — grafik trend Sales TY vs LY vs Budget (+ Achievement %) by Bulan, Quartal, Semester
// Mengikuti bulan yang dipilih di filter YTD. Quartal/Semester dihitung dengan menjumlahkan total bulanan
// (Sales & Budget bersifat aditif); Achievement & Growth dihitung ulang dari total agregat.
// ============================================================
function ytdTrendMonthly(selMonths, curYear, lyYear){
  const avail = availableMonths(curYear);
  return [...selMonths].sort((a,b)=>a-b).map(m=>{
    const t = buildPeriodData([{y:curYear,m}], [{y:lyYear,m}], [m], null, null).total;
    return { m, hasData: avail.includes(m), sales:t.sales, salesLY:t.salesLY, budget:t.budgetToko };
  });
}
function ytdTrendGroup(monthly, size, prefix){
  const g = new Map();
  monthly.forEach(r=>{
    const k = Math.ceil(r.m/size);
    if(!g.has(k)) g.set(k, {k, months:[], sales:0, salesLY:0, budget:0, hasData:false});
    const x = g.get(k); x.months.push(r.m); x.sales+=r.sales; x.salesLY+=r.salesLY; x.budget+=r.budget; x.hasData = x.hasData || r.hasData;
  });
  return [...g.values()].map(x=>{
    const full = x.months.length === size;
    const label = prefix + x.k + (full ? '' : ' (' + MONTH_NAMES[x.months[0]-1] + (x.months.length>1 ? '–'+MONTH_NAMES[x.months[x.months.length-1]-1] : '') + ')');
    return { label, sales:x.sales, salesLY:x.salesLY, budget:x.budget, hasData:x.hasData };
  });
}
function ytdTrendChart(id, rows){
  const ach = rows.map(r=> r.hasData && r.budget>0 ? +(r.sales/r.budget*100).toFixed(1) : null);
  mkChart(id, {
    data:{
      labels: rows.map(r=>r.label),
      datasets:[
        {type:'bar', label:'Sales TY', data: rows.map(r=>r.sales), backgroundColor:'#2B4C5C', borderRadius:4, yAxisID:'y', order:2},
        {type:'bar', label:'Sales LY', data: rows.map(r=>r.salesLY), backgroundColor:'#C9C3B0', borderRadius:4, yAxisID:'y', order:3},
        {type:'line', label:'Budget', data: rows.map(r=>r.budget), borderColor:'#D9720B', backgroundColor:'#D9720B', borderDash:[6,4], borderWidth:2, pointRadius:3, tension:0.25, yAxisID:'y', order:1},
        {type:'line', label:'Achievement %', data: ach, borderColor:'#2F7A4F', backgroundColor:'#2F7A4F', borderWidth:2, pointRadius:3, tension:0.25, spanGaps:false, yAxisID:'y1', order:0},
      ]
    },
    options:{
      responsive:true, interaction:{mode:'index', intersect:false},
      plugins:{
        legend:{position:'bottom', labels:{boxWidth:10, font:{size:11}}},
        tooltip:{ callbacks:{
          label:(c)=> c.dataset.yAxisID==='y1' ? (c.dataset.label+': '+(c.parsed.y===null?'-':c.parsed.y.toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1})+'%')) : (c.dataset.label+': '+fmtRp(c.parsed.y)),
          afterBody:(items)=>{ const r = rows[items[0].dataIndex]; return r.salesLY>0 ? 'Growth vs LY: '+fmtPct((r.sales-r.salesLY)/r.salesLY) : ''; }
        }}
      },
      scales:{
        y:{ grid:{color:'#EEEAE0'}, beginAtZero:true, ticks:{callback:v=>fmtRp(v)} },
        y1:{ position:'right', grid:{display:false}, beginAtZero:true, ticks:{callback:v=>v+'%'} },
        x:{ grid:{display:false} }
      }
    }
  });
}
function renderYtdTrend(body, selMonths, curYear, lyYear){
  const old = body.querySelector('#ytd-trend-wrap'); if(old) old.remove();
  const wrap = document.createElement('div');
  wrap.id = 'ytd-trend-wrap';
  wrap.innerHTML = `

      </div>
    </div>
    <div class="footnote-box" style="margin-bottom:14px;" id="ytd-nodata-note" style="display:none;"></div>
    <div id="ytd-body"></div>
  `;
  const body = container.querySelector('#ytd-body');
  function update(){
    if(selected.length===0) selected=[availMonths[0]||1];
    const curYms = selected.map(m=>({y:curYear,m}));
    const lyYms = selected.map(m=>({y:lyYear,m}));
    const data = buildPeriodData(curYms, lyYms, selected, null, null);
    renderPeriodBody(body, data, {chartPrefix:'ytd', showInv:true});
    renderYtdTrend(body, selected, curYear, lyYear);
    trkRender(trkMountHost(body,'trk-ytd-host',false), trkZonaCfg('trk-ytd','Trend Performance by Zona', curYear, selected, ['month','quarter','semester']));
    const noDataMonths = selected.filter(m=>!availMonths.includes(m)).sort((a,b)=>a-b);
    const noteEl = document.getElementById('ytd-nodata-note');
    if(noDataMonths.length){
      noteEl.style.display = 'block';
      noteEl.innerHTML = `<b>Info:</b> Bulan ${noDataMonths.map(m=>MONTH_NAMES[m-1]).join(', ')} belum ada data sales — Budget tetap tampil (kalau sudah diupload), Sales akan 0 sampai data diupload.`;
    } else { noteEl.style.display = 'none'; }
    setPeriodLabel(`Bulan terpilih: ${selected.sort((a,b)=>a-b).map(m=>MONTH_NAMES[m-1]).join(', ')} ${curYear} (vs periode sama ${lyYear})`);
  }
  attachMonthChipEvents(container, 'ytdchip', months, (sel)=>{ selected = sel; update(); });
  container.querySelectorAll('.preset-btns button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const p = btn.dataset.p;
      if(p==='q1') selected = [1,2,3];
      else if(p==='q2') selected = [4,5,6];
      else if(p==='q3') selected = [7,8,9];
      else if(p==='q4') selected = [10,11,12];
      else if(p==='s1') selected = [1,2,3,4,5,6];
      else if(p==='s2') selected = [7,8,9,10,11,12];
      else if(p==='all') selected = [...ALL_MONTHS];
      else if(p==='ytd') selected = [...availMonths];
      container.querySelectorAll('#ytd-chips .chip').forEach(c=>c.classList.toggle('active', selected.includes(+c.dataset.m)));
      update();
    });
  });
  update();
};

// DAILY (single date / week / custom range)
// ============================================================
RENDERERS.daily = function(container){
  const latest = latestYM();
  const curYear = latest.y || 2026;
  const lyYear = curYear - 1;
  const dates = STATE.salesFact.filter(r=>r.y===curYear).map(r=>({m:r.m,d:r.d}));
  const uniqDates = [...new Map(dates.map(x=>[x.m+'-'+x.d, x])).values()].sort((a,b)=>a.m-b.m||a.d-b.d);
  const lastDate = uniqDates[uniqDates.length-1] || {m:1,d:1};

  container.innerHTML = `
    <div class="filter-bar">
      <div class="filter-group">
        <label>Mode</label>
        <div class="mode-toggle" id="daily-mode">
          <button data-mode="single" class="active">Per Tanggal</button>
          <button data-mode="week">Per Minggu</button>
          <button data-mode="range">Rentang Tanggal</button>
        </div>
      </div>
      <div class="filter-group" id="daily-single-ctrl">
        <label>Tanggal (${curYear})</label>
        <select id="daily-date">${uniqDates.map(x=>`<option value="${x.m}-${x.d}" ${x.m===lastDate.m&&x.d===lastDate.d?'selected':''}>${String(x.d).padStart(2,'0')} ${MONTH_NAMES[x.m-1]}</option>`).join('')}</select>
      </div>
      <div class="filter-group" id="daily-week-ctrl" style="display:none;">
        <label>Bulan (${curYear})</label>
        <select id="daily-week-month">${ALL_MONTHS.map(m=>`<option value="${m}" ${m===lastDate.m?'selected':''}>${MONTH_NAMES[m-1]}</option>`).join('')}</select>
      </div>
      <div class="filter-group" id="daily-week-btns-ctrl" style="display:none;">
        <label>Minggu Kalender</label>
        <div class="preset-btns" id="daily-week-btns">
          <button data-w="1">Week 1</button><button data-w="2">Week 2</button><button data-w="3">Week 3</button>
          <button data-w="4">Week 4</button><button data-w="5">Week 5</button>
        </div>
      </div>
      <div class="filter-group" id="daily-range-ctrl" style="display:none;">
        <label>Dari</label>
        <select id="daily-range-from">${uniqDates.map(x=>`<option value="${x.m}-${x.d}">${String(x.d).padStart(2,'0')} ${MONTH_NAMES[x.m-1]}</option>`).join('')}</select>
      </div>
      <div class="filter-group" id="daily-range-to-ctrl" style="display:none;">
        <label>Sampai</label>
        <select id="daily-range-to">${uniqDates.map(x=>`<option value="${x.m}-${x.d}" ${x.m===lastDate.m&&x.d===lastDate.d?'selected':''}>${String(x.d).padStart(2,'0')} ${MONTH_NAMES[x.m-1]}</option>`).join('')}</select>
      </div>
    </div>
    <div id="daily-body"></div>
  `;

  // Calendar-week helper: Week 1 = days 1-7, Week 2 = 8-14, Week 3 = 15-21, Week 4 = 22-28, Week 5 = 29-end
  function calendarWeekRange(y, m, weekNum){
    const from = (weekNum-1)*7 + 1;
    const dim = daysInMonth(y, m);
    const to = Math.min(weekNum*7, dim);
    return { fromM:m, fromD:from, toM:m, toD: Math.min(to, dim) };
  }
  let weekMonth = lastDate.m || 1;
  let weekNum = Math.min(5, Math.ceil((lastDate.d||1)/7));

  let mode = 'single';
  const body = container.querySelector('#daily-body');

  function getRange(){
    if(mode==='single'){
      const [m,d] = container.querySelector('#daily-date').value.split('-').map(Number);
      return {fromM:m, fromD:d, toM:m, toD:d};
    } else if(mode==='week'){
      return calendarWeekRange(curYear, weekMonth, weekNum);
    } else {
      const [fm,fd] = container.querySelector('#daily-range-from').value.split('-').map(Number);
      const [tm,td] = container.querySelector('#daily-range-to').value.split('-').map(Number);
      return {fromM:fm, fromD:fd, toM:tm, toD:td};
    }
  }
  function ymdToOrdinal(y,m,d){ return new Date(y,m-1,d).getTime(); }

  function update(){
    const r = getRange();
    // build day-level cur & LY query manually since range may span months
    const curRows = STATE.salesFact.filter(x=> x.y===curYear && ymdToOrdinal(curYear,x.m,x.d) >= ymdToOrdinal(curYear,r.fromM,r.fromD) && ymdToOrdinal(curYear,x.m,x.d) <= ymdToOrdinal(curYear,r.toM,r.toD));
    const lyFromOrd = ymdToOrdinal(lyYear,r.fromM,r.fromD), lyToOrd = ymdToOrdinal(lyYear,r.toM,r.toD);
    const lyRows = STATE.salesFact.filter(x=> x.y===lyYear && ymdToOrdinal(lyYear,x.m,x.d) >= lyFromOrd && ymdToOrdinal(lyYear,x.m,x.d) <= lyToOrd);

    function agg(rows){
      const map = new Map();
      rows.forEach(x=>{ if(!map.has(x.cat)) map.set(x.cat,{cat:x.cat,amt:0,qty:0,pbAmt:0,pbQty:0}); const s=map.get(x.cat); s.amt+=x.amt; s.qty+=x.qty; s.pbAmt+=x.pbAmt; s.pbQty+=x.pbQty; });
      return [...map.values()];
    }
    const cur = agg(curRows), ly = agg(lyRows);
    const lyMap = new Map(ly.map(x=>[x.cat,x]));
    const monthsSpanned = [...new Set(curRows.map(x=>x.m))];
    const spannedList = monthsSpanned.length?monthsSpanned:[r.fromM];
    const hasDailyBudget = STATE.budgetDailyFact && STATE.budgetDailyFact.length>0;
    let budStore, budPB;
    let rangeRatio; // fraction of the spanned months' budget that this exact date range represents
    if(hasDailyBudget){
      // exact: sum actual daily budget rows within [from,to]
      const inRange = (m,d) => ymdToOrdinal(curYear,m,d) >= ymdToOrdinal(curYear,r.fromM,r.fromD) && ymdToOrdinal(curYear,m,d) <= ymdToOrdinal(curYear,r.toM,r.toD);
      budStore = new Map();
      let rangeTotal = 0, fullTotal = 0;
      STATE.budgetDailyFact.forEach(x=>{
        if(!spannedList.includes(x.m)) return;
        fullTotal += x.value;
        if(inRange(x.m,x.d)){ budStore.set(x.cat, (budStore.get(x.cat)||0)+x.value); rangeTotal += x.value; }
      });
      rangeRatio = fullTotal>0 ? rangeTotal/fullTotal : 0;
    } else {
      budStore = new Map();
      spannedList.forEach(m=>{
        STATE.budgetStoreFact.filter(x=>x.m===m).forEach(x=>budStore.set(x.cat, (budStore.get(x.cat)||0)+x.value));
      });
      const numDays = Math.round((ymdToOrdinal(curYear,r.toM,r.toD)-ymdToOrdinal(curYear,r.fromM,r.fromD))/86400000)+1;
      const totalDaysInSpannedMonths = spannedList.reduce((a,m)=>a+daysInMonth(curYear,m),0);
      rangeRatio = totalDaysInSpannedMonths ? numDays/totalDaysInSpannedMonths : 0;
      budStore.forEach((v,k)=>budStore.set(k, v*rangeRatio));
    }
    // Budget PB has no daily file of its own — apply the SAME range ratio (derived from Store's
    // real daily pattern when available) to PB's raw monthly budget, exactly once.
    budPB = new Map();
    spannedList.forEach(m=>{
      STATE.budgetPBFact.filter(x=>x.m===m).forEach(x=>budPB.set(x.cat, (budPB.get(x.cat)||0)+x.value));
    });
    budPB.forEach((v,k)=>budPB.set(k, v*rangeRatio));

    const invByCat = new Map();
    STATE.sqvItems.forEach(it=>{ if(!invByCat.has(it.cat)) invByCat.set(it.cat,{value:0}); invByCat.get(it.cat).value += it.value; });
    const allCats = new Set([...cur.map(x=>x.cat), ...ly.map(x=>x.cat), ...budStore.keys()]);
    const detail = [...allCats].map(cat=>{
      const c = cur.find(x=>x.cat===cat) || {amt:0,pbAmt:0};
      const l = lyMap.get(cat) || {amt:0,pbAmt:0};
      const bt = budStore.get(cat)||0;
      const bpb = budPB.get(cat)||0;
      return {
        cat, zona: catToZona(cat, r.toM), sales:c.amt, salesLY:l.amt, growth: safeDiv(c.amt-l.amt,l.amt), diffGrowth: c.amt-l.amt,
        budgetToko: bt, achievement: safeDiv(c.amt,bt), diffBudget: c.amt-bt, budgetPB: bpb,
        pbSales: c.pbAmt, pbSalesLY: l.pbAmt, pbGrowth: safeDiv(c.pbAmt-l.pbAmt,l.pbAmt), pbAchievement: safeDiv(c.pbAmt,bpb),
        invValue: (invByCat.get(cat)||{value:0}).value,
      };
    }).sort((a,b)=>a.zona.localeCompare(b.zona)||b.sales-a.sales);

    const zonaMap = new Map();
    detail.forEach(d=>{
      if(!zonaMap.has(d.zona)) zonaMap.set(d.zona,{zona:d.zona,sales:0,salesLY:0,budgetToko:0,pbSales:0,pbSalesLY:0,budgetPB:0,invValue:0});
      const z = zonaMap.get(d.zona); z.sales+=d.sales; z.salesLY+=d.salesLY; z.budgetToko+=d.budgetToko; z.pbSales+=d.pbSales; z.pbSalesLY+=d.pbSalesLY; z.budgetPB+=d.budgetPB; z.invValue+=d.invValue;
    });
    const zonaSummary = [...zonaMap.values()].map(z=>({...z, growth:safeDiv(z.sales-z.salesLY,z.salesLY), diffGrowth:z.sales-z.salesLY, achievement:safeDiv(z.sales,z.budgetToko), diffBudget:z.sales-z.budgetToko, pbGrowth:safeDiv(z.pbSales-z.pbSalesLY,z.pbSalesLY), pbAchievement:safeDiv(z.pbSales,z.budgetPB)}));
    const totalSales=detail.reduce((a,d)=>a+d.sales,0), totalSalesLY=detail.reduce((a,d)=>a+d.salesLY,0), totalBudget=detail.reduce((a,d)=>a+d.budgetToko,0);
    const totalPB=detail.reduce((a,d)=>a+d.pbSales,0), totalPBLY=detail.reduce((a,d)=>a+d.pbSalesLY,0), totalBudgetPB=detail.reduce((a,d)=>a+d.budgetPB,0);
    const totalInv=detail.reduce((a,d)=>a+d.invValue,0);
    const protection = protectionTotalsForDayRange(curYear, r.fromM, r.fromD, r.toM, r.toD);
    const total = { sales:totalSales, salesLY:totalSalesLY, growth:safeDiv(totalSales-totalSalesLY,totalSalesLY), budgetToko:totalBudget, achievement:safeDiv(totalSales,totalBudget),
      pbSales:totalPB, pbSalesLY:totalPBLY, budgetPB:totalBudgetPB, pbAchievement:safeDiv(totalPB,totalBudgetPB), pbGrowth:safeDiv(totalPB-totalPBLY,totalPBLY), invValue:totalInv,
      protectionAmt: protection.protectionAmt, protectionQty: protection.protectionQty,
      ...ipTotals(
        invStatsFor(x=> x.y===curYear && ymdToOrdinal(curYear,x.m,x.d) >= ymdToOrdinal(curYear,r.fromM,r.fromD) && ymdToOrdinal(curYear,x.m,x.d) <= ymdToOrdinal(curYear,r.toM,r.toD), monthsRangeYms(curYear,r.fromM,r.toM)),
        invStatsFor(x=> x.y===lyYear && ymdToOrdinal(lyYear,x.m,x.d) >= lyFromOrd && ymdToOrdinal(lyYear,x.m,x.d) <= lyToOrd, monthsRangeYms(lyYear,r.fromM,r.toM))) };

    Object.assign(total, storeInvMetrics(
      x=> x.y===curYear && ymdToOrdinal(curYear,x.m,x.d) >= ymdToOrdinal(curYear,r.fromM,r.fromD) && ymdToOrdinal(curYear,x.m,x.d) <= ymdToOrdinal(curYear,r.toM,r.toD),
      x=> x.y===lyYear && ymdToOrdinal(lyYear,x.m,x.d) >= lyFromOrd && ymdToOrdinal(lyYear,x.m,x.d) <= lyToOrd,
      (function(){ // LM = rentang tanggal yang sama digeser 1 bulan ke belakang
        const sh = (m,d)=>{ let yy = curYear, mm = m-1; if(mm<1){ mm = 12; yy -= 1; } return {y:yy, m:mm, d:Math.min(d, daysInMonth(yy,mm))}; };
        const a0 = sh(r.fromM, r.fromD), b0 = sh(r.toM, r.toD), oa = ymdToOrdinal(a0.y,a0.m,a0.d), ob = ymdToOrdinal(b0.y,b0.m,b0.d);
        return x=> { const o = ymdToOrdinal(x.y,x.m,x.d); return o>=oa && o<=ob; };
      })(), total.sales, total.salesLY, monthsRangeYms(curYear,r.fromM,r.toM), monthsRangeYms(lyYear,r.fromM,r.toM), lmRangeYms(curYear,r.fromM,r.toM)));
    renderPeriodBody(body, {detail, zonaSummary, total}, {chartPrefix:'daily', showInv:true});
    (function(){
      const inRng = (x, y)=>{ const o = ymdToOrdinal(y,x.m,x.d); return o>=ymdToOrdinal(y,r.fromM,r.fromD) && o<=ymdToOrdinal(y,r.toM,r.toD); };
      const hint = 'Data jam belum tersedia. Upload ulang file sales CSV (kolom Receipt Date memuat jam, mis. 05/10/26 14:35) lewat menu Upload Data untuk periode ini.';
      trkRender(trkMountHost(body,'trk-daily-host',false), {id:'trk-daily', title:'Trend Performance by Zona — per Jam', modes:['hour'], curYear, lyYear, months:[r.fromM], series:TRK_ZONA_ORDER,
        note:'Penjualan per jam (jam transaksi dari Receipt Date) pada rentang tanggal yang dipilih; LY = rentang tanggal yang sama tahun lalu. Achievement tidak tersedia (budget tidak dibagi per jam).',
        rows:(year)=>STATE.hourFact.filter(x=>x.y===year).map(x=>({m:x.m,d:x.d,h:x.h,s:x.zona,amt:x.amt})),
        accept:(x,isLY)=> inRng(x, isLY?lyYear:curYear), emptyHint:hint, noDayHint:hint});
    })();
    const fmtD = (m,d)=> String(d).padStart(2,'0')+' '+MONTH_NAMES[m-1];
    setPeriodLabel(`${fmtD(r.fromM,r.fromD)}${(r.fromM!==r.toM||r.fromD!==r.toD)?' – '+fmtD(r.toM,r.toD):''} ${curYear} (vs periode sama ${lyYear})`);
  }

  container.querySelectorAll('#daily-mode button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      container.querySelectorAll('#daily-mode button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); mode = btn.dataset.mode;
      container.querySelector('#daily-single-ctrl').style.display = mode==='single'?'flex':'none';
      container.querySelector('#daily-week-ctrl').style.display = mode==='week'?'flex':'none';
      container.querySelector('#daily-week-btns-ctrl').style.display = mode==='week'?'flex':'none';
      container.querySelector('#daily-range-ctrl').style.display = mode==='range'?'flex':'none';
      container.querySelector('#daily-range-to-ctrl').style.display = mode==='range'?'flex':'none';
      update();
    });
  });
  container.querySelector('#daily-date').addEventListener('change', update);
  container.querySelector('#daily-week-month').addEventListener('change', (e)=>{ weekMonth=+e.target.value; update(); });
  container.querySelectorAll('#daily-week-btns button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      container.querySelectorAll('#daily-week-btns button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); weekNum = +btn.dataset.w;
      update();
    });
  });
  container.querySelector(`#daily-week-btns button[data-w="${weekNum}"]`).classList.add('active');
  container.querySelector('#daily-range-from').addEventListener('change', update);
  container.querySelector('#daily-range-to').addEventListener('change', update);
  update();
};
// ============================================================
// BRAND (Master Brand) — YTD/MTD toggle + Category/SubCategory/Function filters

RENDERERS.brand = function(container){
  const latest = latestYM();
  const curYear = latest.y || 2026;
  const lyYear = curYear - 1;
  const months = availableMonths(curYear);
  const opts = brandFilterOptions();
  let period = 'ytd'; let selMonth = gMonth(latest.m);
  let fCat = '', fSubcat = '', fFunc = '';
  const brandSort = {key:null, dir:-1};

  container.innerHTML = `
    <div class="filter-bar">
      <div class="filter-group"><label>Periode</label>
        <div class="mode-toggle" id="brand-period">
          <button data-p="ytd" class="active">YTD</button><button data-p="mtd">MTD</button>
        </div>
      </div>
      <div class="filter-group" id="brand-month-ctrl" style="display:none;">
        <label>Bulan</label>
        <select id="brand-month">${months.map(m=>`<option value="${m}" ${m===selMonth?'selected':''}>${MONTH_NAMES[m-1]}</option>`).join('')}</select>
      </div>
      <div class="filter-group"><label>Kategori</label>
        <select id="brand-cat"><option value="">Semua</option>${opts.cats.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
      </div>
      <div class="filter-group"><label>Sub Category</label><select id="brand-subcat"><option value="">Semua</option></select></div>
      <div class="filter-group"><label>Function</label><select id="brand-func"><option value="">Semua</option></select></div>
    </div>
    <div id="brand-body"></div>
  `;
  const body = container.querySelector('#brand-body');
  const subcatSel = container.querySelector('#brand-subcat');
  const funcSel = container.querySelector('#brand-func');

  function refreshSubcatOptions(){
    subcatSel.innerHTML = '<option value="">Semua</option>';
    if(fCat && opts.subcatByCat.has(fCat)){
      [...opts.subcatByCat.get(fCat)].sort().forEach(s=>subcatSel.insertAdjacentHTML('beforeend', `<option value="${s}">${s}</option>`));
    }
  }
  function refreshFuncOptions(){
    funcSel.innerHTML = '<option value="">Semua</option>';

    ];
    const g = (m, y) => (y===lyYear?A:B).byM.get(m);

      <div class="chart-wrap" style="margin-top:14px;"><canvas id="chart-cu-cmp" height="90"></canvas></div>
      <div class="tbl-scroll tbl-fit" style="margin-top:12px;"><table><thead><tr><th>Bulan</th><th class="num">Value ${lyYear}</th><th class="num">Value ${curYear}</th><th class="num">Growth</th><th class="num">Invoice ${lyYear}</th><th class="num">Invoice ${curYear}</th><th class="num">Growth</th><th class="num">Customer ${lyYear}</th><th class="num">Customer ${curYear}</th><th class="num">Growth</th></tr></thead>
        <tbody>${ms.map(m=>{ const a = g(m,lyYear), b = g(m,curYear), av = a?a.val:0, bv = b?b.val:0, ai = a?a.notas.size:0, bi = b?b.notas.size:0, ac = a?a.mem.size:0, bc = b?b.mem.size:0;
          return `<tr><td>${MONTH_NAMES[m-1]}</td><td class="num">${a?fmtRp(av):'-'}</td><td class="num">${b?fmtRp(bv):'-'}</td><td class="num">${growthCell(bv,av)}</td><td class="num">${a?fmtNum(ai):'-'}</td><td class="num">${b?fmtNum(bi):'-'}</td><td class="num">${growthCell(bi,ai)}</td><td class="num">${a?fmtNum(ac):'-'}</td><td class="num">${b?fmtNum(bc):'-'}</td><td class="num">${growthCell(bc,ac)}</td></tr>`; }).join('')}
          <tr style="border-top:2px solid var(--line);"><td><b>Total</b></td><td class="num"><b>${fmtRp(A.tot.val)}</b></td><td class="num"><b>${fmtRp(B.tot.val)}</b></td><td class="num">${growthCell(B.tot.val,A.tot.val)}</td><td class="num"><b>${fmtNum(A.tot.notas.size)}</b></td><td class="num"><b>${fmtNum(B.tot.notas.size)}</b></td><td class="num">${growthCell(B.tot.notas.size,A.tot.notas.size)}</td><td class="num"><b>${fmtNum(A.tot.mem.size)}</b></td><td class="num"><b>${fmtNum(B.tot.mem.size)}</b></td><td class="num">${growthCell(B.tot.mem.size,A.tot.mem.size)}</td></tr>

  function cmpChart(){
    const A = cmpScan(lyYear), B = cmpScan(curYear), ms = [...new Set([...A.byM.keys(), ...B.byM.keys()])].sort((a,b)=>a-b);
    if(!ms.length) return;
    const av = ms.map(m=>A.byM.has(m)?A.byM.get(m).val:null), bv = ms.map(m=>B.byM.has(m)?B.byM.get(m).val:null);
    mkChart('chart-cu-cmp', {type:'bar', data:{labels:ms.map(m=>MONTH_NAMES[m-1]), datasets:[

        tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmtRp(c.parsed.y), afterBody:its=>{ const i = its[0].dataIndex; return (av[i]>0 && bv[i]!=null) ? 'Growth: '+fmtPct((bv[i]-av[i])/av[i]) : ''; }}}},

  // ---- perbandingan Bispro vs Regular (tidak terpengaruh filter Kriteria) + kontribusi terhadap total member
  const KRI_COLOR = {'Bispro':'#D9720B', 'Regular':'#2B4C5C', 'Tanpa Kriteria':'#9A937C', 'Belum Terdaftar':'#C9C3B0'};
  function kriScan(y){
    const cm = new Set(periodMonthNums()), T = custTx(), by = new Map(), tot = {val:0, notas:new Set(), mem:new Set()};
    for(let i=0;i<T.length;i++){ const a = T[i], ymd = a[0]; if(((ymd/10000)|0)!==y) continue; const m = ((ymd/100)|0)%100; if(!cm.has(m) || (y===curYear && !aOk(m, ymd%100))) continue;
      const kr = kOf(a[1]); let g = by.get(kr); if(!g){ g = {val:0, notas:new Set(), mem:new Set()}; by.set(kr, g); }
      g.val += a[6]; g.notas.add(a[2]); g.mem.add(a[1]); tot.val += a[6]; tot.notas.add(a[2]); tot.mem.add(a[1]); }
    return {by, tot, has: by.size>0};
  }
  function kriHtml(){
    const A = kriScan(lyYear), B = kriScan(curYear); if(!A.has && !B.has) return '';
    const order = ['Bispro','Regular','Tanpa Kriteria','Belum Terdaftar'].filter(k=>A.by.has(k)||B.by.has(k));
    const z = () => ({val:0, notas:new Set(), mem:new Set()});
    const st = (S,k) => { const g = k==null ? S.tot : (S.by.get(k)||z()), inv = g.notas.size, c = g.mem.size;
      return {c, v:g.val, i:inv, avg:inv?g.val/inv:0, vpc:c?g.val/c:0, cs:S.tot.mem.size?c/S.tot.mem.size:0, vs:S.tot.val?g.val/S.tot.val:0, is:S.tot.notas.size?inv/S.tot.notas.size:0}; };
    const pp = d => (d>=0?'+':'')+(d*100).toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1})+' pp';
    const gr = (b,a) => a>0 ? `<span class="heat-cell" style="background:${growthColor((b-a)/a)}">${fmtPct((b-a)/a)}</span>` : '-';
    const rowY = (label, y, x, first, rs) => `<tr${first?' style="border-top:2px solid var(--line);"':''}>${first?`<td rowspan="${rs}" style="vertical-align:top;"><span class="cu-tag ${label==='Bispro'?'bispro':(label==='Belum Terdaftar'?'nodb':'')}">${cEsc(label)}</span></td>`:''}<td>${y}</td>
      <td class="num">${fmtNum(x.c)}</td><td class="num">${fmtPct(x.cs)}</td><td class="num">${fmtRp(x.v)}</td><td class="num"><b>${fmtPct(x.vs)}</b></td><td class="num">${fmtNum(x.i)}</td><td class="num">${fmtPct(x.is)}</td><td class="num">${fmtRp(x.avg)}</td><td class="num">${fmtRp(x.vpc)}</td></tr>`;
    const rowG = (a, b) => `<tr style="background:#FAF8F2;"><td style="font-size:11.5px;color:var(--ink-soft);">Growth / selisih</td>
      <td class="num">${gr(b.c,a.c)}</td><td class="num">${pp(b.cs-a.cs)}</td><td class="num">${gr(b.v,a.v)}</td><td class="num"><b>${pp(b.vs-a.vs)}</b></td><td class="num">${gr(b.i,a.i)}</td><td class="num">${pp(b.is-a.is)}</td><td class="num">${gr(b.avg,a.avg)}</td><td class="num">${gr(b.vpc,a.vpc)}</td></tr>`;
    const blocks = order.map(k=>{ const a = st(A,k), b = st(B,k); return rowY(k, lyYear, a, true, 3) + rowY(k, curYear, b, false) + rowG(a, b); }).join('');
    const ta = st(A,null), tb = st(B,null);
    const totRows = `<tr style="border-top:2px solid var(--line);"><td rowspan="3" style="vertical-align:top;"><b>Semua</b></td><td>${lyYear}</td><td class="num"><b>${fmtNum(ta.c)}</b></td><td class="num">100%</td><td class="num"><b>${fmtRp(ta.v)}</b></td><td class="num">100%</td><td class="num"><b>${fmtNum(ta.i)}</b></td><td class="num">100%</td><td class="num"><b>${fmtRp(ta.avg)}</b></td><td class="num"><b>${fmtRp(ta.vpc)}</b></td></tr>
      <tr><td>${curYear}</td><td class="num"><b>${fmtNum(tb.c)}</b></td><td class="num">100%</td><td class="num"><b>${fmtRp(tb.v)}</b></td><td class="num">100%</td><td class="num"><b>${fmtNum(tb.i)}</b></td><td class="num">100%</td><td class="num"><b>${fmtRp(tb.avg)}</b></td><td class="num"><b>${fmtRp(tb.vpc)}</b></td></tr>${rowG(ta, tb)}`;
    const unkNote = ['Belum Terdaftar','Tanpa Kriteria'].filter(k=>order.includes(k)).map(k=>{ const a = st(A,k), b = st(B,k);
      return `<b>${k}</b>: ${fmtNum(a.c)} customer / ${fmtPct(a.vs)} value di ${lyYear} dan ${fmtNum(b.c)} customer / ${fmtPct(b.vs)} value di ${curYear}`; }).join('; ');
    return `<div class="panel"><div class="panel-head"><div class="panel-title">Perbandingan Bispro vs Regular — ${lyYear} vs ${curYear}</div>
      <div class="panel-note">Periode ${pLabel()} · ${lyYear} ditampilkan penuh sampai Desember, ${curYear} s/d ${L.d} ${MONTH_NAMES[L.m-1]}. Kontribusi = porsi kriteria terhadap total transaksi member (semua kriteria) pada tahun yang sama; selisih kontribusi dalam poin persentase (pp).</div></div>
      ${unkNote?`<div class="footnote-box" style="margin-bottom:12px;">Nomor member yang tidak ada di Database Customer tidak bisa digolongkan Bispro/Regular — ${unkNote}. Lengkapi database member agar perbandingan lebih akurat.</div>`:''}
      <div class="chart-wrap" style="height:${Math.max(170, 90+order.length*10)}px;"><canvas id="chart-cu-kri"></canvas></div>
      <div class="tbl-scroll tbl-fit" style="margin-top:12px;"><table><thead><tr><th>Kriteria</th><th>Tahun</th><th class="num">Customer</th><th class="num">Kontribusi Customer</th><th class="num">Value</th><th class="num">Kontribusi Value</th><th class="num">Invoice</th><th class="num">Kontribusi Invoice</th><th class="num">Rata² / Invoice</th><th class="num">Value / Customer</th></tr></thead>
      <tbody>${blocks}${totRows}</tbody></table></div></div>`;
  }
  function kriChart(){
    const A = kriScan(lyYear), B = kriScan(curYear); if(!A.has && !B.has) return;
    const order = ['Bispro','Regular','Tanpa Kriteria','Belum Terdaftar'].filter(k=>A.by.has(k)||B.by.has(k));
    const share = (S, k, f) => { const g = S.by.get(k), t = f==='v' ? S.tot.val : S.tot.notas.size; return (g && t) ? +((f==='v' ? g.val : g.notas.size)/t*100).toFixed(1) : 0; };
    const labels = ['Value '+lyYear, 'Value '+curYear, 'Invoice '+lyYear, 'Invoice '+curYear];
    mkChart('chart-cu-kri', {type:'bar', data:{labels, datasets: order.map(k=>({label:k, backgroundColor:KRI_COLOR[k]||'#999', data:[share(A,k,'v'), share(B,k,'v'), share(A,k,'i'), share(B,k,'i')]}))},
      options:{indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:11}}}, tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.parsed.x.toLocaleString('id-ID',{maximumFractionDigits:1})+'%'}}},
        scales:{x:{stacked:true, max:100, grid:{color:'#EEEAE0'}, ticks:{callback:v=>v+'%'}, title:{display:true, text:'Kontribusi terhadap total transaksi member'}}, y:{stacked:true, grid:{display:false}}}}});
  }

  // ---- tabel generik: sort via header, pencarian, "tampilkan lebih banyak"
  function mountTable(host, rows, opt){
    const st = {key:opt.key||'val', dir:-1, limit:opt.limit||100, q:'', step:opt.limit||100};
    const COLS = [['Nama','name'],['Nomor Member','no'],['Kriteria','kriteria'],['No. Phone','phone'],['Value '+year,'val',1]]
      .concat(opt.hasLy ? [['Value '+(year-1),'lyVal',1]] : [])
      .concat([['Invoice '+year,'inv',1]])
      .concat(opt.hasLy ? [['Invoice '+(year-1),'lyInv',1],['Growth vs '+(year-1)+' (s/d tgl sama)','growth',1]] : [])
      .concat([['Rata² / Invoice','avg',1],['Terakhir Transaksi','last',1]]);
    const isStr = k => (k==='name'||k==='no'||k==='kriteria'||k==='phone');
    function list(){
      let r = rows;
      if(st.q){ const q = st.q.toLowerCase().trim(), dg = q.replace(/\D/g,''), alt = dg.startsWith('0') ? '62'+dg.slice(1) : dg;
        r = r.filter(x=> x.name.toLowerCase().includes(q) || (dg && (x.no.includes(dg) || x.k.includes(dg))) || x.no.toLowerCase().includes(q) || (dg && (x.phone.includes(dg) || x.phone.includes(alt)))); }
      const k = st.key, d = st.dir, nv = v => v==null ? -1e18 : v;
      return r.slice().sort((a,b)=> isStr(k) ? d*String(a[k]).localeCompare(String(b[k]),'id',{numeric:true}) : (d*(nv(a[k])-nv(b[k])) || b.val-a.val));
    }
    function draw(){
      const all = list(), shown = all.slice(0, st.limit);
      host.innerHTML = `<div class="tbl-scroll ${opt.fit?'tbl-fit':''}"><table><thead><tr><th>#</th>${COLS.map(([l,k,n])=>`<th class="${n?'num':''}" data-sort="${k}" title="Klik untuk mengurutkan">${l}${st.key===k?(st.dir<0?' ▼':' ▲'):''}</th>`).join('')}</tr></thead>
        <tbody>${shown.length ? shown.map((r,i)=>`<tr><td>${i+1}</td><td>${cEsc(r.name)}</td><td>${cEsc(r.no)}</td>
          <td><span class="cu-tag ${r.kriteria==='Bispro'?'bispro':(r.inDb?'':'nodb')}">${cEsc(r.kriteria)}</span></td><td>${cEsc(r.phone)||'-'}</td>
          <td class="num">${fmtRp(r.val)}</td>${opt.hasLy ? `<td class="num">${r.lyVal!=null?fmtRp(r.lyVal):'-'}</td>` : ''}
          <td class="num">${fmtNum(r.inv)}</td>${opt.hasLy ? `<td class="num">${r.lyInv!=null?fmtNum(r.lyInv):'-'}</td><td class="num">${r.growth!=null?`<span class="heat-cell" style="background:${growthColor(r.growth)}">${fmtPct(r.growth)}</span>`:'-'}</td>` : ''}
          <td class="num">${fmtRp(r.avg)}</td>
          <td class="num"><button type="button" class="cu-link" data-cust="${cEsc(r.k)}"${opt.lost?' data-yr="'+(year-1)+'"':''} title="Lihat tanggal & detail transaksi">${custDateHtml(r.last)} ▸</button></td></tr>`).join('')
          : `<tr><td colspan="${COLS.length+1}" style="text-align:center;color:var(--ink-soft);padding:18px;">Tidak ada customer yang cocok.</td></tr>`}</tbody></table></div>
        ${all.length>shown.length ? `<div style="text-align:center;margin-top:10px;"><button type="button" class="btn secondary small cu-more">Tampilkan ${Math.min(st.step, all.length-shown.length)} lagi · ${fmtNum(shown.length)} dari ${fmtNum(all.length)}</button></div>` : (opt.counter ? `<div style="font-size:12px;color:var(--ink-soft);margin-top:8px;">${fmtNum(all.length)} customer</div>` : '')}`;
    }
    host.onclick = e=>{
      const th = e.target.closest('th[data-sort]'); if(th){ const k = th.dataset.sort; if(st.key===k) st.dir = -st.dir; else { st.key = k; st.dir = isStr(k) ? 1 : -1; } draw(); return; }
      const c = e.target.closest('[data-cust]'); if(c){ openTx(c.dataset.cust, c.dataset.yr ? +c.dataset.yr : year); return; }
      if(e.target.closest('.cu-more')){ st.limit += st.step; draw(); }
    };
    host.setQuery = q=>{ st.q = q; st.limit = st.step; draw(); };
    draw();
  }

  // ---- popup: tanggal transaksi → detail receipt
  function openTx(k, yr){
    yr = yr || year; const ms = new Set(yr===year ? periodMonths() : periodMonthNums()), d = db.get(k);
    const sp = new Map(); (STATE.spFact||[]).forEach(r=>{ if(r.spId && r.spName) sp.set(r.spId, r.spName); }); (STATE.salperFact||[]).forEach(r=>{ if(r.spId && r.spName) sp.set(r.spId, r.spName); });
    const byDay = new Map();
    custTx().forEach(a=>{ if(a[1]!==k || ((a[0]/10000)|0)!==yr || !ms.has(((a[0]/100)|0)%100)) return;
      let g = byDay.get(a[0]); if(!g){ g = {ymd:a[0], lines:[], notas:new Set(), val:0}; byDay.set(a[0], g); } g.lines.push(a); g.notas.add(a[2]); g.val += a[6]; });
    const days = [...byDay.values()].sort((a,b)=>b.ymd-a.ymd);
    const el = custModal(`<div class="cu-box">
      <div class="cu-box-head"><div><div style="font-size:16px;font-weight:700;">${cEsc(d?d.n:'(tidak ada di database member)')}</div>
        <div style="font-size:12.5px;color:var(--ink-soft);margin-top:3px;">Member ${cEsc(d?d.no:k)} · ${cEsc(d&&d.p?d.p:'-')} · ${cEsc(d?(d.c||'-'):'Belum Terdaftar')} · ${pLabel()} ${yr} · ${fmtNum(days.length)} hari transaksi</div></div>
        <button type="button" class="cu-close" title="Tutup (Esc)">×</button></div>
      <div class="cu-grid"><div class="cu-dates">${days.map(g=>`<button type="button" class="cu-date" data-ymd="${g.ymd}">${custDateHtml(g.ymd)}<small>${fmtNum(g.notas.size)} invoice · ${fmtRp(g.val)}</small></button>`).join('') || '<div style="color:var(--ink-soft);font-size:12.5px;">Tidak ada transaksi pada periode ini.</div>'}</div>
        <div class="cu-detail" id="cu-detail"><div style="color:var(--ink-soft);font-size:13px;">Pilih tanggal di sebelah kiri untuk melihat detail transaksi.</div></div></div></div>`);
    function show(ymd){
      const g = byDay.get(ymd); if(!g) return;
      el.querySelectorAll('.cu-date').forEach(b=>b.classList.toggle('active', +b.dataset.ymd===ymd));
      const lines = g.lines.slice().sort((a,b)=>String(a[2]).localeCompare(String(b[2]),'id',{numeric:true}));
      const qf = v=> Number(v).toLocaleString('id-ID',{maximumFractionDigits:2});
      el.querySelector('#cu-detail').innerHTML = `<div style="font-weight:700;margin-bottom:8px;">${custDateHtml(ymd)} · ${fmtNum(g.notas.size)} invoice · ${fmtRp(g.val)}</div>
        <div class="tbl-scroll tbl-fit"><table><thead><tr><th>Nomor Receipt</th><th>Sales Person</th><th>Item Code</th><th>Deskripsi</th><th class="num">Qty</th><th class="num">Value</th></tr></thead>
        <tbody>${lines.map((a,i)=>`<tr${i&&lines[i-1][2]!==a[2]?' style="border-top:2px solid var(--line);"':''}><td>${cEsc(a[2])}</td><td>${cEsc(cleanName(sp.get(a[3])||a[3]||'')||'-')}</td><td>${cEsc(a[4])}</td><td>${cEsc((STATE.itemMeta[a[4]]||{}).name||'-')}</td><td class="num">${qf(a[5])}</td><td class="num">${fmtRp(a[6])}</td></tr>`).join('')}</tbody></table></div>`;
    }
    el.querySelector('.cu-dates').onclick = e=>{ const b = e.target.closest('.cu-date'); if(b) show(+b.dataset.ymd); };
    if(days.length) show(days[0].ymd);
  }

  function update(){
    setPeriodLabel('Data Customer · '+pLabel()+' '+year);
    const nDb = (STATE.memberDb||[]).length, nTx = custTx().length;
    if(!nTx){
      body.innerHTML = `<div class="panel"><div class="panel-head"><div class="panel-title">Data transaksi member belum tersedia</div></div>
        <div class="footnote-box">Data Customer Transaksi dibangun dari <b>Sales Transaksi (CSV)</b> 2025 &amp; 2026 yang memuat kolom <b>Membercard No</b>, lalu dicocokkan ke <b>Database Customer</b> untuk nama, phone &amp; kriteria.<br>
        • Database Customer: ${nDb?fmtNum(nDb)+' member ✓':'belum di-upload'}<br>• Transaksi ber-member: belum ada — upload <b>CSV sales</b> yang memuat kolom Membercard No di menu <b>Upload / Refresh Data</b>.</div></div>`;
      return;
    }
    const cmp = cmpHtml() + kriHtml();
    if(!txMonths(year).length){
      body.innerHTML = `<div class="footnote-box" style="margin-bottom:14px;">Belum ada transaksi member untuk tahun <b>${year}</b> — upload CSV sales ${year} (yang memuat kolom Membercard No) di menu Upload / Refresh Data.</div>${cmp}`;
      cmpChart(); kriChart(); return;
    }
    const {rows, all, hasLy, lost, lyTot} = aggregate();
    const lostN = lost.length, lostV = lost.reduce((a,r)=>a+r.lyVal,0), lostI = lost.reduce((a,r)=>a+r.lyInv,0), pc = (x,t) => t>0 ? fmtPct(x/t) : '-';
    const totVal = rows.reduce((a,r)=>a+r.val,0), totInv = rows.reduce((a,r)=>a+r.inv,0);
    const unk = all.filter(r=>!r.inDb).length;
    const card = (l,v,sub)=>`<div class="kpi-card"><div class="kpi-label">${l}</div><div class="kpi-value">${v}</div>${sub?`<div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">${sub}</div>`:''}</div>`;

// ---- Grafik trend Tier Salper: komposisi tier (jumlah orang / % orang / kontribusi sales) per tanggal, bulan, quartal, semester
const _ttCache = {};
function mountTierTrend(host, ctx){
  const st = ctx.st, y = ctx.curYear, months = ctx.months, f = ctx.filters;
  if(!months.length){ host.innerHTML = ''; return; }
  if(!st.month || !months.includes(st.month)) st.month = months[months.length-1];
  const q = (ms, dayTo) => querySalesperson(ms.map(m=>({y, m})), [], f, dayTo ? {from:1, to:dayTo} : null).byZona;
  function classify(rows, bf){ bf = bf || 1;
    const n = SP_TIERS.map(()=>0), a = SP_TIERS.map(()=>0); let nb = 0, nbA = 0, tot = 0, bud = 0;
    rows.forEach(r=>{ const amt = r.amt||0; tot += amt;
      if(!(r.budget>0)){ nb++; nbA += amt; return; }
      const ach = amt/(r.budget*bf); let i = SP_TIERS.findIndex(t=>ach>=t.lo && ach<t.hi); if(i<0) i = SP_TIERS.length-1; n[i]++; a[i] += amt; bud++; });
    return {n, a, nb, nbA, tot, bud, all: rows.length};
  }
  function build(){
    const key = [st.view, st.view==='date'?st.month:'', JSON.stringify(f), STATE.spFact.length, months.length].join('|');
    if(_ttCache[key]) return _ttCache[key];
    let out = [];
    if(st.view==='month') out = months.map(m=>({label:MONTH_NAMES[m-1], sub:'', c:classify(q([m]))}));
    else if(st.view==='quarter' || st.view==='semester'){
      const size = st.view==='quarter' ? 3 : 6, pre = st.view==='quarter' ? 'Q' : 'S', g = new Map();
      months.forEach(m=>{ const k = Math.ceil(m/size); if(!g.has(k)) g.set(k, []); g.get(k).push(m); });
      g.forEach((ms,k)=>{ out.push({label:pre+k, sub: MONTH_NAMES[ms[0]-1].slice(0,3)+(ms.length>1?'–'+MONTH_NAMES[ms[ms.length-1]-1].slice(0,3):'')+(ms.length<size?' (berjalan)':''), c:classify(q(ms))}); });
    } else {
      const last = Math.min(daysInMonth(y, st.month), effectiveCutoffDay(y, st.month));
      for(let d=1; d<=last; d++) out.push({label:dateLabel(y, st.month, d), d, c:classify(q([st.month], d), d/daysInMonth(y, st.month))});
    }
    return _ttCache[key] = out;
  }
  const metricName = {n:'Jumlah Orang', p:'% Orang', s:'Kontribusi Sales'};
  function val(c, i){ if(st.metric==='n') return c.n[i]; if(st.metric==='p') return c.bud ? c.n[i]/c.bud*100 : 0; return c.tot>0 ? c.a[i]/c.tot*100 : 0; }
  function draw(){
    const data = build(), series = SP_TIERS.map((t,i)=>({label:t.label, color:t.color, i}));
    if(st.metric==='s') series.push({label:'Tanpa budget', color:'#B9B3A3', i:-1});
    const vOf = (c, s_) => s_.i<0 ? (c.tot>0 ? c.nbA/c.tot*100 : 0) : val(c, s_.i);
    const isPct = st.metric!=='n', fmtV = v => isPct ? v.toLocaleString('id-ID',{maximumFractionDigits:1})+'%' : fmtNum(v);
    const viewBtn = (v,l) => `<button data-v="${v}" class="${st.view===v?'active':''}">${l}</button>`, metBtn = (v,l) => `<button data-mt="${v}" class="${st.metric===v?'active':''}">${l}</button>`;
    const note = {
      date:`Per tanggal = pencapaian <b>kumulatif</b> tanggal 1 s/d tanggal tersebut ÷ budget bulan ${MONTH_NAMES[st.month-1]} yang dihitung proporsional hari berjalan (budget × tanggal ÷ jumlah hari bulan); pada tanggal terakhir hasilnya sama dengan tier bulan. Tanggal merah = weekend / libur nasional.`,
      month:'Per bulan = Actual bulan tersebut ÷ Budget bulan tersebut per salesperson.', quarter:'Per quartal = Actual ÷ Budget kumulatif bulan-bulan dalam quartal (quartal berjalan hanya sampai bulan data terakhir).', semester:'Per semester = Actual ÷ Budget kumulatif bulan-bulan dalam semester (semester berjalan hanya sampai bulan data terakhir).'}[st.view];
    host.innerHTML = `<div class="panel"><div class="panel-head"><div class="panel-title">Trend Tier Salper — ${y}</div>
      <div class="panel-note">${note} Tier = Achievement (Actual ÷ Budget) per salesperson ber-budget; mengikuti filter Zona / Kriteria / TL, tidak terpengaruh tombol Periode.${st.metric==='s'?' Kontribusi Sales = Actual tier ÷ total Actual semua salesperson.':''}</div></div>
      <div class="filter-bar" style="margin-bottom:10px;">
        <div class="filter-group"><label>Tampilan</label><div class="mode-toggle" id="tt-view">${viewBtn('date','Per Tanggal')}${viewBtn('month','Per Bulan')}${viewBtn('quarter','Per Quartal')}${viewBtn('semester','Per Semester')}</div></div>
        ${st.view==='date' ? `<div class="filter-group"><label>Bulan</label><select id="tt-month">${months.map(m=>`<option value="${m}" ${m===st.month?'selected':''}>${MONTH_NAMES[m-1]} ${y}</option>`).join('')}</select></div>` : ''}
        <div class="filter-group"><label>Ukuran</label><div class="mode-toggle" id="tt-metric">${metBtn('n','Jumlah Orang')}${metBtn('p','% Orang')}${metBtn('s','Kontribusi Sales')}</div></div>
      </div>
      <div class="chart-wrap" style="height:340px;"><canvas id="chart-sp-tier-trend"></canvas></div>
      <div class="tbl-scroll tbl-fit" style="margin-top:12px;"><table><thead><tr><th>${st.view==='date'?'Tanggal':'Periode'}</th>${series.map(s_=>`<th class="num"><span class="zona-dot" style="background:${s_.color}"></span> ${s_.label}</th>`).join('')}<th class="num">Total ber-budget</th></tr></thead>
        <tbody>${data.map(d=>`<tr><td>${Array.isArray(d.label) ? `<span style="${dayInfo(y,st.month,d.d).red?'color:'+DAY_RED_COLOR+';font-weight:700;':''}">${d.label[1]}, ${d.label[0]} ${MONTH_NAMES[st.month-1].slice(0,3)}</span>` : `<b>${d.label}</b>${d.sub?` <span style="color:var(--ink-soft);font-size:11px;">${d.sub}</span>`:''}`}</td>${series.map(s_=>`<td class="num">${fmtV(vOf(d.c,s_))}</td>`).join('')}<td class="num">${fmtNum(d.c.bud)}</td></tr>`).join('')}</tbody></table></div></div>`;
    const keyAt = i => data[i] && data[i].d;
    mkChart('chart-sp-tier-trend', {type:'bar', data:{labels:data.map(d=>d.label), datasets:series.map(s_=>({label:s_.label, backgroundColor:s_.color, data:data.map(d=>+vOf(d.c,s_).toFixed(isPct?1:0)), borderWidth:0}))},
      options:{responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
        plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:11}}},
          tooltip:{callbacks:{title: st.view==='date' ? dateTitleFn(y, st.month, keyAt) : (its=>{ const d = data[its[0].dataIndex]; return d.label+(d.sub?' · '+d.sub:''); }),
            label:c=>c.dataset.label+': '+fmtV(c.parsed.y), footer:its=>{ const d = data[its[0].dataIndex].c; return 'Total ber-budget: '+fmtNum(d.bud)+' orang'+(d.nb?' · tanpa budget: '+fmtNum(d.nb):''); }}}},
        scales:{x:{stacked:true, grid:{display:false}, ticks: st.view==='date' ? dateTicks(y, st.month, keyAt) : {font:{size:11}}}, y:{stacked:true, beginAtZero:true, max: isPct ? 100 : undefined, grid:{color:'#EEEAE0'}, ticks:{callback:v=>isPct ? v+'%' : fmtNum(v)}, title:{display:true, text:metricName[st.metric]}}}}});
    host.querySelector('#tt-view').onclick = e=>{ const b = e.target.closest('button[data-v]'); if(b){ st.view = b.dataset.v; draw(); } };
    host.querySelector('#tt-metric').onclick = e=>{ const b = e.target.closest('button[data-mt]'); if(b){ st.metric = b.dataset.mt; draw(); } };
    const ms_ = host.querySelector('#tt-month'); if(ms_) ms_.onchange = e=>{ st.month = +e.target.value; draw(); };
  }
  draw();
}

        <label>Sampai Tanggal</label><select id="sp-date-to"></select>

    <div class="footnote-box" style="margin-bottom:16px;">

    const top15 = data.personTotal.slice(0,15);

    // Top 3 by month (Jan..latest bulan tersedia) + Top 3 YTD — respects Zona/Kriteria filter, independent of Periode toggle
    const top3ByMonth = months.map(m=>({ m, top: topSalperForMonths([{y:curYear,m}], filters, 3) }));

    document.getElementById('sp-data-warning').innerHTML = noNewDataYear
      ? ` <b style="color:#B23A2E;">Catatan:</b> kolom Protection/Sales Project/Sales WhatsApp untuk tahun ${curYear} masih 0 — data ini baru terbaca dari file sales CSV yang diupload ulang lewat menu Upload Data (data lama sebelum perbaikan belum memuat rincian tsb).`
      : '';

    // IPD / IPI gabungan untuk salesperson yang sedang tampil (pooled): IPD = Σinvoice ÷ Σhari-aktif per salesperson, IPI = Σitem ÷ Σinvoice
    const ipRows = data.byZona.filter(r=>r.inv>0);
    const ipLegacyN = data.byZona.filter(r=>r.ipLegacy).length;
    const pool = (rows, kInv, kDays, kItems) => { const inv=rows.reduce((a,r)=>a+r[kInv],0), days=rows.reduce((a,r)=>a+r[kDays],0), items=rows.reduce((a,r)=>a+r[kItems],0); return {inv,days,items, ipd: days?inv/days:null, ipi: inv?items/inv:null}; };
    const ipTY = pool(ipRows,'inv','days','items'), ipLY = pool(data.byZona.filter(r=>r.invLY>0),'invLY','daysLY','itemsLY');
    const ipG = (a,b)=> (a!==null && b) ? (a-b)/b : null;
    const ipCardSP = (label, v, vLY, dec, basis) => { const g = ipG(v,vLY); return `

// ============================================================
// TIEBS TREND — grafik trend by Bulan / Quartal / Semester (periode YTD) dan by Tanggal (periode MTD)
// Metrik: Invoice, Traffic, Efektivitas Traffic, Basket Size, Nilai Sales — TY vs LY vs Budget.
// Semua komponen dihitung dari data harian (nota + traffic) lalu dijumlahkan, sehingga Quartal/Semester
// akurat (rasio dihitung ulang dari total, bukan rata-rata rasio) dan konsisten dengan tabel Traffic/Invoice/Basket di tab ini.
// ============================================================
const TK_TREND_METRICS = {
  invoice:{label:'Invoice (Jumlah Nota)', type:'count'},
  traffic:{label:'Traffic', type:'count'},
  eff:{label:'Efektivitas Traffic', type:'pct'},
  basket:{label:'Basket Size', type:'rp'},
  value:{label:'Nilai Sales', type:'rp'},
};
function tkEmpty(){ return {inv:0,val:0,trf:0,bTrf:0,bInv:0,bInvN:0,bBsk:0,bBskN:0}; }
function tkAdd(a,b){ for(const k in b) a[k]+=b[k]; return a; }
function ticketTrendDaily(curYear, lyYear, filters){
  const D = new Map();
  const yrs = new Set([curYear, lyYear]);
  function g(y,m,d){ const k=y+'-'+m+'-'+d; let o=D.get(k); if(!o){ o=tkEmpty(); D.set(k,o); } return o; }
  if(filters.zona || filters.cat){
    const perNota = new Map();
    (STATE.notaCatFact||[]).forEach(r=>{
      if(!yrs.has(r.y)) return;
      if(filters.cat && r.cat!==filters.cat) return;
      if(filters.zona && catToZona(r.cat, r.m)!==filters.zona) return;
      const k = r.y+'-'+r.m+'-'+r.d+'-'+r.nota;
      perNota.set(k, (perNota.get(k)||0)+r.amt);
    });
    perNota.forEach((amt,k)=>{ const p=k.split('-'); const o=g(+p[0],+p[1],+p[2]); o.inv++; o.val+=amt; });
  } else {
    STATE.notaFact.forEach(r=>{
      if(!yrs.has(r.y) || r.d===undefined) return;
      const o=g(r.y,r.m,r.d); o.inv++; o.val+=r.amt;
    });
  }
  STATE.trafficFact.forEach(r=>{
    if(!yrs.has(r.y) || r.d===undefined) return;
    const o=g(r.y,r.m,r.d);
    if(r.actual!==null && r.actual!==undefined) o.trf += r.actual;
    if(r.y===curYear){
      if(r.budget!==null && r.budget!==undefined) o.bTrf += r.budget;
      if(r.budgetInvoice!==null && r.budgetInvoice!==undefined){ o.bInv += r.budgetInvoice; o.bInvN++; }
      if(r.budgetBasketSize!==null && r.budgetBasketSize!==undefined){ o.bBsk += r.budgetBasketSize; o.bBskN++; }
    }
  });
  return D;
}
function tkMonthly(D, curYear, lyYear, months){
  const out = new Map();
  months.forEach(m=>{
    const cut = effectiveCutoffDay(curYear, m); // apple-to-apple: bulan berjalan dipotong di tanggal yang sama untuk TY & LY
    const ty = tkEmpty(), ly = tkEmpty();
    for(let d=1; d<=cut; d++){
      const a = D.get(curYear+'-'+m+'-'+d); if(a) tkAdd(ty,a);
      const b = D.get(lyYear+'-'+m+'-'+d); if(b) tkAdd(ly,b);
    }
    out.set(m,{ty,ly});
  });
  return out;
}
function tkMetricVal(metric, ty, ly){
  const r = (n,dn)=> dn ? n/dn : null;
  const has = ty.inv>0 || ty.trf>0;
  let v;
  switch(metric){
    case 'invoice': v = {ty:ty.inv, ly:ly.inv, bud: ty.bInvN>0 ? ty.bInv : null}; break;
    case 'traffic': v = {ty:ty.trf, ly:ly.trf, bud: ty.bTrf>0 ? ty.bTrf : null}; break;
    case 'eff':     v = {ty:r(ty.inv,ty.trf), ly:r(ly.inv,ly.trf), bud:(ty.bInvN>0 && ty.bTrf>0) ? ty.bInv/ty.bTrf : null}; break;
    case 'basket':  v = {ty:r(ty.val,ty.inv), ly:r(ly.val,ly.inv), bud: ty.bBskN>0 ? ty.bBsk/ty.bBskN : null}; break;
    default:        v = {ty:ty.val, ly:ly.val, bud:null};
  }
  if(!has) v.ty = null;
  if(ly.inv===0 && ly.trf===0) v.ly = null;
  return v;
}
function tkTrendGroup(monthlyMap, months, size, prefix){
  const g = new Map();
  months.forEach(m=>{
    const k = Math.ceil(m/size);
    if(!g.has(k)) g.set(k, {k, months:[], ty:tkEmpty(), ly:tkEmpty()});
    const x = g.get(k); x.months.push(m);
    const mm = monthlyMap.get(m); tkAdd(x.ty, mm.ty); tkAdd(x.ly, mm.ly);
  });
  return [...g.values()].map(x=>{
    const full = x.months.length === size;
    const label = prefix + x.k + (full ? '' : ' (' + MONTH_NAMES[x.months[0]-1] + (x.months.length>1 ? '–'+MONTH_NAMES[x.months[x.months.length-1]-1] : '') + ')');
    return {label, ty:x.ty, ly:x.ly};
  });
}
function tkTrendChart(id, labels, items, metric, asLine, dt){ // dt (opsional) = {y,m,days:[tgl...]} → sumbu tanggal + nama hari
  const M = TK_TREND_METRICS[metric];
  const f = v=> (v===null||v===undefined||!isFinite(v)) ? '-' : (M.type==='pct' ? fmtPct(v) : M.type==='rp' ? fmtRp(v) : fmtNum(v));
  const vals = items.map(it=>tkMetricVal(metric, it.ty, it.ly));
  const hasBud = vals.some(v=>v.bud!==null && v.bud!==undefined);
  const ds = [
    {type:'bar', label:'TY', data: vals.map(v=>v.ty), backgroundColor:'#2B4C5C', borderRadius:3, order:2},
    asLine
      ? {type:'line', label:'LY', data: vals.map(v=>v.ly), borderColor:'#9A937C', backgroundColor:'#9A937C', borderWidth:2, pointRadius:2, tension:0.2, order:1}
      : {type:'bar', label:'LY', data: vals.map(v=>v.ly), backgroundColor:'#D8D3C6', borderRadius:3, order:3},
  ];
  if(hasBud) ds.push({type:'line', label:'Budget', data: vals.map(v=>v.bud), borderColor:'#D9720B', backgroundColor:'#D9720B', borderDash:[6,4], borderWidth:2, pointRadius:asLine?0:3, tension:0.2, spanGaps:true, order:0});
  mkChart(id, {
    data:{ labels, datasets: ds },
    options:{
      responsive:true, interaction:{mode:'index', intersect:false},
      plugins:{
        legend:{position:'bottom', labels:{boxWidth:10, font:{size:11}}},
        tooltip:{ callbacks:{
          ...(dt ? {title:dateTitleFn(dt.y, dt.m, i=>dt.days[i])} : {}),
          label:(c)=> c.dataset.label+': '+f(c.parsed.y),
          afterBody:(its)=>{
            const v = vals[its[0].dataIndex]; const lines=[];
            if(v.ty!==null && v.ly!==null && v.ly!==0){
              lines.push(M.type==='pct'
                ? 'Diff vs LY: '+((v.ty-v.ly)>=0?'+':'')+((v.ty-v.ly)*100).toLocaleString('id-ID',{maximumFractionDigits:2})+' pp'
                : 'Growth vs LY: '+fmtPct((v.ty-v.ly)/Math.abs(v.ly)));
            }
            if(v.ty!==null && v.bud) lines.push('Achievement: '+fmtPct(v.ty/v.bud));
            return lines;
          }
        }}
      },
      scales:{
        y:{ grid:{color:'#EEEAE0'}, beginAtZero:true, ticks:{callback:v=> M.type==='pct' ? fmtPct(v,0) : M.type==='rp' ? fmtRp(v) : fmtNum(v)} },
        x:{ grid:{display:false}, ticks: dt ? dateTicks(dt.y, dt.m, i=>dt.days[i]) : {font:{size:10}, maxRotation:0, autoSkip:true} }
      }
    }
  });
}

        <div class="chart-wrap"><canvas id="tk-trend-d" height="110"></canvas></div></div>
      <div class="panel"><div class="panel-head"><div class="panel-title">Trend by Week — ${MONTH_NAMES[st.selMonth-1]} ${st.curYear}</div>
        <div class="panel-note">W1 = tgl 1–7, W2 = 8–14, dst. Dijumlahkan dari data harian (rasio dihitung ulang dari total minggu)</div></div>
        <div class="chart-wrap"><canvas id="tk-trend-w" height="90"></canvas></div></div>`;
  }
  wrap.innerHTML = toggle + charts;
  const anchor = body.querySelector('.grid-2');
  if(anchor) body.insertBefore(wrap, anchor); else body.appendChild(wrap);
  wrap.querySelectorAll('#tk-trend-metric button').forEach(b=> b.addEventListener('click', ()=> st.onMetric(b.dataset.k)));

  const D = ticketTrendDaily(st.curYear, st.lyYear, st.filters);
  if(st.period==='ytd'){
    const mm = tkMonthly(D, st.curYear, st.lyYear, st.months);
    tkTrendChart('tk-trend-m', st.months.map(m=>MONTH_NAMES[m-1]), st.months.map(m=>mm.get(m)), st.metric, false);
    const q = tkTrendGroup(mm, st.months, 3, 'Q'), sm = tkTrendGroup(mm, st.months, 6, 'S');
    tkTrendChart('tk-trend-q', q.map(x=>x.label), q, st.metric, false);
    tkTrendChart('tk-trend-s', sm.map(x=>x.label), sm, st.metric, false);
  } else {
    const dim = daysInMonth(st.curYear, st.selMonth);
    const cut = effectiveCutoffDay(st.curYear, st.selMonth);
    const labels = [], items = [], dayKeys = [];
    const fromD = st.dayFilter ? st.dayFilter.from : 1, toD = st.dayFilter ? Math.min(st.dayFilter.to, dim) : dim;
    for(let d=fromD; d<=toD; d++){
      labels.push(dateLabel(st.curYear, st.selMonth, d)); dayKeys.push(d);
      const ty = d<=cut ? (D.get(st.curYear+'-'+st.selMonth+'-'+d) || tkEmpty()) : tkEmpty();
      const ly = D.get(st.lyYear+'-'+st.selMonth+'-'+d) || tkEmpty();
      items.push({ty, ly});
    }
    tkTrendChart('tk-trend-d', labels, items, st.metric, true, {y:st.curYear, m:st.selMonth, days:dayKeys});
    const wk = [];
    for(let w=1; w<=Math.ceil(dim/7); w++){
      const d1 = Math.max((w-1)*7+1, fromD), d2 = Math.min(w*7, dim, toD); if(d1>d2) continue;
      const ty = tkEmpty(), ly = tkEmpty();
      for(let d=d1; d<=d2 && d<=cut; d++){
        const a = D.get(st.curYear+'-'+st.selMonth+'-'+d); if(a) tkAdd(ty,a);
        const b = D.get(st.lyYear+'-'+st.selMonth+'-'+d); if(b) tkAdd(ly,b);
      }
      wk.push({label:'W'+w+' ('+d1+'–'+d2+')', ty, ly});
    }
    tkTrendChart('tk-trend-w', wk.map(x=>x.label), wk, st.metric, false);
  }
}

RENDERERS.ticket = function(container){
  const latest = latestYM();
  const curYear = latest.y || 2026;
  const lyYear = curYear - 1;
  const months = availableMonths(curYear);
  const zonas = ['Zona 1','Zona 2','Zona 3','Zona 4','Zona Lainnya'];
  const cats = brandFilterOptions().cats;
  let period = 'ytd'; let selMonth = gMonth(latest.m); let fZona = gZona(); let fCat = ''; let tkMetric = 'invoice'; let tkFrom = 1, tkTo = 31;

  container.innerHTML = `
    <div class="filter-bar">
      <div class="filter-group"><label>Periode</label>
        <div class="mode-toggle" id="tk-period"><button data-p="ytd" class="active">YTD</button><button data-p="mtd">MTD</button></div>
      </div>
      <div class="filter-group" id="tk-month-ctrl" style="display:none;">
        <label>Bulan</label><select id="tk-month">${months.map(m=>`<option value="${m}" ${m===selMonth?'selected':''}>${MONTH_NAMES[m-1]}</option>`).join('')}</select>
      </div>
      <div class="filter-group" id="tk-date-from-ctrl" style="display:none;">
        <label>Dari Tanggal</label><select id="tk-date-from"></select>
      </div>
      <div class="filter-group" id="tk-date-to-ctrl" style="display:none;">
        <label>Sampai Tanggal</label><select id="tk-date-to"></select>
      </div>
      <div class="filter-group"><label>Zona</label>
        <select id="tk-zona"><option value="">Semua Zona</option>${zonas.map(z=>`<option value="${z}">${z}</option>`).join('')}</select>
      </div>
      <div class="filter-group"><label>Category</label>
        <select id="tk-cat"><option value="">Semua Category</option>${cats.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
      </div>
    </div>
    <div class="footnote-box" style="margin-bottom:16px;">Visualisasi tier saat ini pakai bar chart standar — akan disesuaikan begitu contoh visual dari Anda diterima.
      <span id="tk-filter-note"></span>
    </div>
    <div id="tk-body"></div>
  `;
  const body = container.querySelector('#tk-body');
  function populateTkDates(){
    const dim = daysInMonth(curYear, selMonth); if(tkFrom>dim) tkFrom = 1; if(tkTo>dim) tkTo = dim;
    const opts = (sel) => Array.from({length:dim},(_,i)=>i+1).map(d=>`<option value="${d}" ${d===sel?'selected':''}>${String(d).padStart(2,'0')}</option>`).join('');
    const f = container.querySelector('#tk-date-from'), t = container.querySelector('#tk-date-to');
    if(f) f.innerHTML = opts(tkFrom); if(t) t.innerHTML = opts(tkTo);
  }

  function update(){
    const yms = period==='ytd' ? months.map(m=>({y:curYear,m})) : [{y:curYear,m:selMonth}];
    const lyYms = period==='ytd' ? months.map(m=>({y:lyYear,m})) : [{y:lyYear,m:selMonth}];
    const dimTk = daysInMonth(curYear, selMonth); if(tkTo>dimTk) tkTo = dimTk; if(tkFrom>dimTk) tkFrom = 1;
    const dayF = (period==='mtd' && (tkFrom>1 || tkTo<dimTk)) ? {from:Math.min(tkFrom,tkTo), to:Math.max(tkFrom,tkTo)} : null;
    const filters = { zona: fZona||null, cat: fCat||null, dayFrom: dayF?dayF.from:0, dayTo: dayF?dayF.to:0 };
    const rows = queryTicketSize(yms, lyYms, filters);
    document.getElementById('tk-filter-note').textContent = (fZona||fCat)
      ? ` Tier di bawah dihitung dari nilai nota yang HANYA berasal dari ${[fZona,fCat].filter(Boolean).join(' · ')} (bukan total nota keseluruhan).`
      : '';
    const totalTx = rows.reduce((a,r)=>a+r.count,0);
    const totalVal = rows.filter(r=>r.tier!=='Return').reduce((a,r)=>a+r.totalValue,0);
    const totalTxLY = rows.reduce((a,r)=>a+r.countLY,0);
    const totalValLY = rows.filter(r=>r.tier!=='Return').reduce((a,r)=>a+r.totalValueLY,0);
    // Basket Size must use Nilai Sales on the SAME basis as Invoice (all Receipt No, termasuk return),
    // i.e. net sales including the (negative) return value — not the non-return-only totalVal above,
    // which understates the denominator's matching numerator and inflates Basket Size.
    const totalValAllTier = rows.reduce((a,r)=>a+r.totalValue,0);
    const totalValLYAllTier = rows.reduce((a,r)=>a+r.totalValueLY,0);
    const returnRow = rows.find(r=>r.tier==='Return');
    const nonReturnCount = totalTx - (returnRow?returnRow.count:0);
    const nonReturnCountLY = totalTxLY - (returnRow?returnRow.countLY:0);
    const txGrowth = safeDiv(totalTx-totalTxLY, totalTxLY);
    const valGrowth = safeDiv(totalVal-totalValLY, totalValLY);

    // Traffic / Invoice / Efektivitas Traffic / Basket Size — same apple-to-apple yms/lyYms as tabel di atas.
    // Invoice = jumlah SEMUA Receipt No (nota transaksi) di seluruh toko, TERMASUK return (totalTx/totalTxLY,
    // dihitung dari seluruh baris rows di atas, bukan nonReturnCount). Efektivitas Traffic = Invoice / Traffic.
    // Basket Size = Nilai Sales / Invoice.
    const trf = queryTraffic(yms, lyYms, dayF);
    function ratio(num, den){
      if(num===null||num===undefined||den===null||den===undefined||den===0) return null;
      return num/den;
    }
    function diffOf(a,b){
      if(a===null||a===undefined||b===null||b===undefined) return null;
      return a-b;
    }
    function fmtByType(v, type){
      if(v===null||v===undefined||!isFinite(v)) return '-';
      if(type==='pct') return fmtPct(v);
      if(type==='rp') return fmtRp(v);
      return fmtNum(v);
    }
    function fmtDiffByType(v, type){
      if(v===null||v===undefined||!isFinite(v)) return '-';
      const sign = v>0?'+':'';
      if(type==='pct') return sign + (v*100).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' pp';
      if(type==='rp') return sign + fmtRp(v);
      return sign + fmtNum(v);
    }
    const trafficMetrics = [
      {label:'Traffic', unit:'orang', type:'count', budget: trf.budget, actual: trf.actual, ly: trf.ly||null},
      {label:'Invoice', unit:'nota (seluruh Receipt No, termasuk return)', type:'count', budget: trf.budgetInvoice, actual: totalTx, ly: totalTxLY},
      {label:'Efektivitas Traffic', unit:'(Invoice ÷ Traffic)', type:'pct', budget: trf.budgetEffTraffic, actual: ratio(totalTx, trf.actual), ly: ratio(totalTxLY, trf.ly)},
      {label:'Basket Size', unit:'(Nilai Sales ÷ Invoice)', type:'rp', budget: trf.budgetBasketSize, actual: ratio(totalValAllTier, totalTx), ly: ratio(totalValLYAllTier, totalTxLY)},
    ].map(m=>{
      const achieve = ratio(m.actual, m.budget);
      const diffBudget = (m.budget!==null && m.budget!==undefined) ? diffOf(m.actual, m.budget) : null;
      const growth = ratio(diffOf(m.actual, m.ly), m.ly);
      const diffLY = diffOf(m.actual, m.ly);
      return {...m, achieve, diffBudget, growth, diffLY};
    });

    body.innerHTML = `
      <div class="kpi-row">
        <div class="kpi-card"><div class="kpi-label">Total Transaksi (Nota)</div><div class="kpi-value">${fmtNum(totalTx)}</div>
          <div class="kpi-sub"><span class="pill ${pillClassGrowth(txGrowth)}">${arrow(txGrowth)} ${fmtPct(txGrowth)}</span><span style="color:var(--ink-soft)">vs LY: ${fmtNum(totalTxLY)}</span></div></div>
        <div class="kpi-card"><div class="kpi-label">Total Nilai (non-return)</div><div class="kpi-value">${fmtRp(totalVal)}</div>
          <div class="kpi-sub"><span class="pill ${pillClassGrowth(valGrowth)}">${arrow(valGrowth)} ${fmtPct(valGrowth)}</span><span style="color:var(--ink-soft)">vs LY: ${fmtRp(totalValLY)}</span></div></div>
        <div class="kpi-card"><div class="kpi-label">Rata-rata Ticket Size</div><div class="kpi-value">${fmtRp(safeDiv(totalVal,nonReturnCount))}</div>
          <div class="kpi-sub"><span style="color:var(--ink-soft)">LY: ${fmtRp(safeDiv(totalValLY,nonReturnCountLY))}</span></div></div>
        <div class="kpi-card"><div class="kpi-label">Return</div><div class="kpi-value" style="color:var(--bad)">${fmtNum(returnRow?returnRow.count:0)} nota</div>
          <div class="kpi-sub" style="color:var(--bad)">${fmtRp(returnRow?returnRow.totalValue:0)} <span style="color:var(--ink-soft)">(LY: ${fmtNum(returnRow?returnRow.countLY:0)} nota)</span></div></div>
      </div>
      <div class="grid-2">
        <div class="panel"><div class="panel-head"><div class="panel-title">Distribusi Jumlah Transaksi per Tier (vs LY)</div></div>
          <div class="chart-wrap"><canvas id="chart-ticket-count" height="260"></canvas></div></div>
        <div class="panel"><div class="panel-head"><div class="panel-title">Distribusi Nilai per Tier (vs LY)</div></div>
          <div class="chart-wrap"><canvas id="chart-ticket-value" height="260"></canvas></div></div>
      </div>
      <div class="panel"><div class="panel-head"><div class="panel-title">Traffic, Invoice, Efektivitas Traffic &amp; Basket Size</div></div>
        <div class="tbl-scroll"><table>
          <thead><tr><th>Metrik</th><th class="num">Budget</th><th class="num">Actual TY</th><th class="num">Achieve</th>
            <th class="num">Diff Budget</th><th class="num">LY / Tahun Lalu</th><th class="num">Growth</th><th class="num">Diff Growth</th></tr></thead>
          <tbody>${trafficMetrics.map(m=>`
            <tr>
              <td><b>${m.label}</b><br><span style="color:var(--ink-soft); font-size:11px;">${m.unit}</span></td>
              <td class="num">${fmtByType(m.budget, m.type)}</td>
              <td class="num">${fmtByType(m.actual, m.type)}</td>
              <td class="num">${m.achieve!==null ? `<span class="heat-cell" style="background:${heatColor(m.achieve)}">${fmtPct(m.achieve)}</span>` : '-'}</td>
              <td class="num">${fmtDiffByType(m.diffBudget, m.type)}</td>
              <td class="num">${fmtByType(m.ly, m.type)}</td>
              <td class="num">${(m.growth!==null && isFinite(m.growth)) ? `<span class="heat-cell" style="background:${growthColor(m.growth)}">${fmtPct(m.growth)}</span>` : '-'}</td>
              <td class="num">${fmtDiffByType(m.diffLY, m.type)}</td>
            </tr>`).join('')}</tbody>
        </table></div>
        <div class="footnote-box" style="margin-top:10px;">Semua angka mengikuti tanggal berjalan yang sama antara TY dan LY (apple-to-apple), konsisten dengan tabel Tier di atas. <b>Invoice</b> = jumlah SELURUH Receipt No (nota transaksi) pada seluruh toko (TY &amp; LY), termasuk nota return — bukan dipecah/dihitung per salesperson, dan bukan hanya baris non-return. <b>Efektivitas Traffic</b> = Invoice ÷ Traffic, <b>Basket Size</b> = Nilai Sales ÷ Invoice. Kolom <b>Budget</b> untuk <b>Invoice</b> dan <b>Efektivitas Traffic</b> diturunkan dari kolom "Budget Effectivitas Traffic" pada file Traffic (Budget Invoice = Budget Traffic × Budget Effektivitas Traffic); <b>Budget Basket Size</b> diambil langsung dari kolom "Budget Basket Size" pada file yang sama (rata-rata per hari pada periode terpilih).</div>
      <div class="panel"><div class="panel-head"><div class="panel-title">Detail Tabel Tier Ticket Size</div></div>
        <div class="tbl-scroll"><table>
          <thead><tr><th>Tier</th><th class="num">Nota</th><th class="num">Nota LY</th><th class="num">% dari Total</th>
            <th class="num">Total Nilai</th><th class="num">Nilai LY</th><th class="num">Growth Nilai</th><th class="num">Rata-rata / Nota</th></tr></thead>
          <tbody>${rows.map(r=>`
            <tr style="${r.tier==='Return'?'background:var(--bad-bg)':''}">
              <td><b>${r.tier}</b></td><td class="num">${fmtNum(r.count)}</td><td class="num">${fmtNum(r.countLY)}</td>
              <td class="num">${fmtPct(safeDiv(r.count,totalTx))}</td>
              <td class="num" style="color:${r.totalValue<0?'var(--bad)':'inherit'}">${fmtRp(r.totalValue)}</td>
              <td class="num" style="color:${r.totalValueLY<0?'var(--bad)':'inherit'}">${fmtRp(r.totalValueLY)}</td>
              <td class="num"><span class="heat-cell" style="background:${growthColor(r.valueGrowth)}">${fmtPct(r.valueGrowth)}</span></td>
              <td class="num">${fmtRp(r.avgValue)}</td>
            </tr>`).join('')}</tbody>
        </table></div>
      </div>
      </div>
    `;
    const colors = rows.map(r=> r.tier==='Return' ? '#B23A2E' : '#2B4C5C');
    const colors2 = rows.map(r=> r.tier==='Return' ? '#B23A2E' : '#D9720B');
    mkChart('chart-ticket-count', { type:'bar', data:{ labels: rows.map(r=>r.tier), datasets:[
      {label:curYear, data: rows.map(r=>r.count), backgroundColor: colors, borderRadius:4},
      {label:lyYear, data: rows.map(r=>r.countLY), backgroundColor: '#D8D3C6', borderRadius:4},
    ]}, options:{ responsive:true, plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}}}, scales:{ y:{grid:{color:'#EEEAE0'}}, x:{grid:{display:false}, ticks:{font:{size:10}, maxRotation:40, minRotation:40}} } } });
    mkChart('chart-ticket-value', { type:'bar', data:{ labels: rows.map(r=>r.tier), datasets:[
      {label:curYear, data: rows.map(r=>r.totalValue), backgroundColor: colors2, borderRadius:4},
      {label:lyYear, data: rows.map(r=>r.totalValueLY), backgroundColor: '#D8D3C6', borderRadius:4},
    ]},
      options:{ responsive:true, plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}}, tooltip:{callbacks:{label:(ctx)=>ctx.dataset.label+': '+fmtRp(ctx.parsed.y)}}},
        scales:{ y:{grid:{color:'#EEEAE0'}, ticks:{callback:v=>fmtRp(v,{noPrefix:true})}}, x:{grid:{display:false}, ticks:{font:{size:10}, maxRotation:40, minRotation:40}} } } });
    setPeriodLabel(`${period==='ytd'?'YTD':MONTH_NAMES[selMonth-1]} ${curYear} (vs ${period==='ytd'?'YTD':MONTH_NAMES[selMonth-1]} ${lyYear})${fZona?' · '+fZona:''}${fCat?' · '+fCat:''}${dayF?' · Tgl '+dayF.from+'–'+dayF.to:''}`);
    renderTicketTrend(body, {period, months, selMonth, curYear, lyYear, filters, dayFilter:dayF, metric:tkMetric, onMetric:(k)=>{ tkMetric=k; update(); }});
  }
  container.querySelectorAll('#tk-period button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      container.querySelectorAll('#tk-period button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); period = btn.dataset.p;
      container.querySelector('#tk-month-ctrl').style.display = period==='mtd'?'flex':'none';
      container.querySelector('#tk-date-from-ctrl').style.display = period==='mtd'?'flex':'none';
      container.querySelector('#tk-date-to-ctrl').style.display = period==='mtd'?'flex':'none';
      if(period==='mtd'){ tkFrom = 1; tkTo = daysInMonth(curYear, selMonth); populateTkDates(); }
      update();
    });
  });
  container.querySelector('#tk-month').addEventListener('change', e=>{ selMonth=+e.target.value; tkFrom=1; tkTo=daysInMonth(curYear, selMonth); populateTkDates(); update(); });
  container.querySelector('#tk-date-from').addEventListener('change', e=>{ tkFrom=+e.target.value; update(); });
  container.querySelector('#tk-date-to').addEventListener('change', e=>{ tkTo=+e.target.value; update(); });
  container.querySelector('#tk-zona').addEventListener('change', e=>{ fZona=e.target.value; update(); });
  container.querySelector('#tk-cat').addEventListener('change', e=>{ fCat=e.target.value; update(); });
  populateTkDates();
  update();
};

      srcZonaTrend(trkMountHost(body,'trk-srcz-host',true), {id:'trk-srcz', title:'Trend Sales by Zona — Source Type', modes:isM?['date','week']:['month','quarter','semester'], curYear, lyYear, months:isM?[selMonth]:months, hint,
        note:'Batang = total Sales TY dan LY seluruh Source Type; garis = Sales TY per Zona (kategori → Zona sesuai bulannya). LY tidak dipecah per Zona karena data Source Type × Zona tahun lalu belum tersimpan.'});
    })();
    (function(){
      const isM = period==='mtd', hint = 'Data harian Source Type belum tersedia. Upload ulang file sales CSV bulan terkait (menu Upload Data) agar Trend by Tanggal/Week muncul.';
      trkRender(trkMountHost(body,'trk-src-host',true), {id:'trk-src', title:'Trend Performance by Source Type', modes:isM?['date','week']:['month','quarter','semester'], curYear, lyYear, months:isM?[selMonth]:months, series:[],
        note:'Data Source Type tidak menyimpan Zona/kategori, jadi series = Source Type (bukan Zona). TY vs LY apple-to-apple s/d tanggal berjalan.',
        rows:(year, mode)=> (mode==='date'||mode==='week')
          ? STATE.sourceDailyFact.filter(x=>x.y===year).map(x=>({m:x.m,d:x.d,s:x.source||'(kosong)',amt:x.amt}))
          : STATE.sourceFact.filter(x=>x.y===year).map(x=>({m:x.m,s:x.source||'(kosong)',amt:x.amt})),
        noDayHint:hint, emptyHint:hint});
    })();
    setPeriodLabel(`${period==='ytd'?'YTD':MONTH_NAMES[selMonth-1]} ${curYear}`);
  }
  container.querySelectorAll('#src-period button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      container.querySelectorAll('#src-period button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); period = btn.dataset.p;
      container.querySelector('#src-month-ctrl').style.display = period==='mtd'?'flex':'none';
      update();
    });
  });
  container.querySelector('#src-month').addEventListener('change', e=>{ selMonth=+e.target.value; update(); });
  update();
};

    data:{ labels: byClass.map(c=>c.label+' ('+fmtPct(c.pctValue)+')'), datasets:[{ data: byClass.map(c=>c.value), backgroundColor: byClass.map(c=>CLASS_COLOR[c.cls]||'#999'), borderRadius:6 }] },

      if(mode==='pct'){
        const p = c.value ? b.value/c.value : 0;
        return `<td class="num" style="min-width:92px;" title="${fmtRp(b.value)} · ${fmtNum(b.qty)} qty · ${fmtNum(b.skuCount)} SKU"><div style="font-weight:600;">${fmtPct(p)}</div><div style="background:#EFEDE6;border-radius:100px;height:4px;margin-top:4px;overflow:hidden;"><div style="width:${Math.max(0,Math.min(100,p*100)).toFixed(1)}%;height:100%;background:${CLASS_COLOR[cls]};"></div></div></td>`;
      }
      if(mode==='vp'){
        const p = c.value ? b.value/c.value : 0;
        return `<td class="num" style="min-width:104px;" title="${fmtNum(b.qty)} qty · ${fmtNum(b.skuCount)} SKU"><div>${fmtRp(b.value)}</div><div style="font-size:11.5px;font-weight:700;color:${CLASS_COLOR[cls]};">${fmtPct(p)}</div></td>`;

      const rows = byCatClass.map(c=>`<tr><td>${c.cat}</td>${skuQty(c.skuCount, c.qty)}${INV_CLASS_DISPLAY.map(cls=>cell(cls, c.byClass[cls], c)).join('')}<td class="num"><b>${mode==='qty'?fmtNum(c.qty):fmtRp(c.value)}</b></td></tr>`).join('');
      const tot = {value:totalValue, qty:totalQty};
      const totRow = `<tr style="border-top:2px solid var(--line);"><td><b>Total</b></td>${skuQty(new Set(STATE.sqvItems.map(it=>it.item)).size, totalQty, true)}${INV_CLASS_DISPLAY.map(cls=>{

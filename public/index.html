// ---- Stock DC ----
async function parseStockDCFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const reportDate = findReportDate(XLSX.utils.sheet_to_json(ws, {header:1, range:0}).slice(0,8), 'Data Report') || todayISO();
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, range:6});
  const header = rows[0];
  const idx = (name)=>header.indexOf(name);
  const iRecv = header.findIndex(h=>String(h).trim()==='Received Date');
  const refMs = Date.parse(reportDate+'T00:00:00Z'); const agingMap = new Map();
  const iSite = idx('Site Name'), iCat = idx('Category'), iItem = header.findIndex(h=>String(h).trim()==='Item No'),
        iOnHand = idx('On Hand Qty'), iAvail = idx('Available Qty'), iStatus = idx('Inventory Status');
  const dcByItem = {}; const bySite = new Map(); const bySiteStatus = new Map(); const sites = new Set();
  for(let i=1;i<rows.length;i++){
    const row = rows[i]; if(!row || !row[iSite]) continue;
    const site = row[iSite], item = String(row[iItem]||'').trim(), onHand = toNum(row[iOnHand]), avail = toNum(row[iAvail]), status = row[iStatus];
    sites.add(site);
    if(!dcByItem[item]) dcByItem[item] = {};
    dcByItem[item][site] = (dcByItem[item][site]||0) + onHand;
    if(!bySite.has(site)) bySite.set(site, {site, onHand:0, available:0});
    const s = bySite.get(site); s.onHand += onHand; s.available += avail;
    if(iRecv!==-1 && onHand>0){ // umur stok = tanggal laporan − Received Date → bucket 0:0–30, 1:31–90, 2:91–180, 3:181–365, 4:>365 hari
      const rd = anyDateToISO(row[iRecv]); if(rd){ const age = Math.round((refMs - Date.parse(rd+'T00:00:00Z'))/86400000);
        const bk = age<=30?0:age<=90?1:age<=180?2:age<=365?3:4, cat = String(row[iCat]||'').trim().toUpperCase(), ak = site+'|'+cat+'|'+bk;
        if(!agingMap.has(ak)) agingMap.set(ak,{site,cat,bucket:bk,onHand:0}); agingMap.get(ak).onHand += onHand; } }
    const k = site+'|'+status;
    if(!bySiteStatus.has(k)) bySiteStatus.set(k, {site, status, onHand:0});
    bySiteStatus.get(k).onHand += onHand;
  }
  return { dcByItem, dcBySite: [...bySite.values()], dcBySiteStatus: [...bySiteStatus.values()], dcSites: [...sites].sort(), dcAging: [...agingMap.values()], reportDate };
}

// ---- Traffic (Budget / Actual TY / LY per day) ----
// Expected columns (any order, header row auto-detected): Hari, Bulan (nama bulan Indonesia),
// Tgl, Budget Traffic, Actual Traffic, Traffic LY / Tahun Lalu.
// TY year = current dashboard year (from latestYMD), LY year = TY-1.
const TRAFFIC_MONTH_MAP = {
  'JANUARI':1,'FEBRUARI':2,'MARET':3,'APRIL':4,'MEI':5,'JUNI':6,'JULI':7,'AGUSTUS':8,
  'SEPTEMBER':9,'OKTOBER':10,'NOVEMBER':11,'DESEMBER':12,
  'JAN':1,'FEB':2,'MAR':3,'APR':4,'JUN':6,'JUL':7,'AGU':8,'AUG':8,'SEP':9,'OKT':10,'OCT':10,'NOV':11,'DES':12,'DEC':12,
};
async function parseTrafficFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1});
  // find header row (contains something like "Bulan" and "Tgl")
  let headerIdx = -1, header = null;
  for(let i=0;i<Math.min(rows.length,10);i++){
    const r = rows[i]||[];
    const norm = r.map(c=>String(c||'').trim().toUpperCase());
    if(norm.some(c=>c==='BULAN') && norm.some(c=>c==='TGL')){ headerIdx = i; header = norm; break; }
  }
  if(headerIdx===-1) throw new Error('Format tidak dikenali: header "Bulan" dan "Tgl" tidak ditemukan.');
  const iBulan = header.indexOf('BULAN');
  const iTgl = header.indexOf('TGL');
  const iBudget = header.findIndex(h=>h.includes('BUDGET') && h.includes('TRAFFIC') && !h.includes('EFFECT') && !h.includes('EFEKT'));
  const iActual = header.findIndex(h=>h.includes('ACTUAL'));
  const iLY = header.findIndex(h=>h.includes('LY') || h.includes('TAHUN LALU'));
  // Optional columns (added later): Budget Effectivitas Traffic (ratio) & Budget Basket Size (Rp).
  // Budget Invoice is DERIVED from these two, not read directly: Budget Invoice = Budget Traffic x Budget Effektivitas Traffic.
  const iEffTraffic = header.findIndex(h=>h.includes('EFFECT') || h.includes('EFEKT'));
  const iBasketSize = header.findIndex(h=>h.includes('BASKET'));
  if(iBudget===-1 || iActual===-1 || iLY===-1) throw new Error('Kolom Budget Traffic / Actual Traffic / Traffic LY tidak ditemukan.');
  const TY = (latestYMD().y) || (new Date().getFullYear());
  const LY = TY - 1;
  const out = [];
  const touchedYM = new Set();
  for(let i=headerIdx+1;i<rows.length;i++){
    const row = rows[i]; if(!row || row[iTgl]===undefined || row[iTgl]===null || row[iTgl]==='') continue;
    const bulanRaw = String(row[iBulan]||'').trim().toUpperCase();
    const m = TRAFFIC_MONTH_MAP[bulanRaw];
    if(!m) continue;
    const d = Math.round(toNum(row[iTgl]));
    if(!d) continue;
    const budgetVal = row[iBudget]===undefined||row[iBudget]===null||row[iBudget]==='' ? null : toNum(row[iBudget]);
    const actualVal = row[iActual]===undefined||row[iActual]===null||row[iActual]==='' ? null : toNum(row[iActual]);
    const lyVal = row[iLY]===undefined||row[iLY]===null||row[iLY]==='' ? null : toNum(row[iLY]);
    const budgetEffTraffic = (iEffTraffic===-1 || row[iEffTraffic]===undefined||row[iEffTraffic]===null||row[iEffTraffic]==='') ? null : toNum(row[iEffTraffic]);
    const budgetBasketSize = (iBasketSize===-1 || row[iBasketSize]===undefined||row[iBasketSize]===null||row[iBasketSize]==='') ? null : toNum(row[iBasketSize]);
    const budgetInvoice = (budgetVal!==null && budgetEffTraffic!==null) ? budgetVal*budgetEffTraffic : null;
    out.push({y:TY, m, d, budget: budgetVal, actual: actualVal, budgetEffTraffic, budgetBasketSize, budgetInvoice});
    out.push({y:LY, m, d, actual: lyVal});
    touchedYM.add(TY+'-'+m); touchedYM.add(LY+'-'+m);
  }
  if(!out.length) throw new Error('Tidak ada baris data traffic yang valid ditemukan di file ini.');
  return { trafficFact: out, touchedYM };
}
function mergeTrafficFacts(computed){
  const touched = computed.touchedYM;
  function ymKey(r){ return r.y+'-'+r.m; }
  STATE.trafficFact = STATE.trafficFact.filter(r=>!touched.has(ymKey(r))).concat(computed.trafficFact);
}

// QUERY / AGGREGATION FUNCTIONS (operate on STATE, given filters)

// Sum salesFact rows matching a set of {y,m} for a given metric breakdown by category
// ---- IPD (Invoice per Day) & IPI (Item per Invoice) — dihitung dari invoice yang dibuat tiap salesperson ----
// IPD = Σ invoice tiap salesperson ÷ Σ hari aktif salesperson (hari saat salesperson tsb membuat ≥ 1 invoice) = rata-rata invoice per salesperson per hari kerja.
// IPI = Σ item (SKU berbeda) di dalam invoice tiap salesperson ÷ Σ invoice.
// Invoice yang dikerjakan >1 salesperson dihitung untuk masing-masing (item = item yang ia input); invoice tanpa salesperson (ID null) tidak ikut.
// Bulan berjalan dipotong di tanggal yang sama untuk TY & LY (apple-to-apple). Data tanpa rincian invoice per salesperson (mis. 2025 lama) → LY kosong.
// Indeks per (tahun, bulan) di-cache per tabel: perhitungan periode cukup membaca bulan terkait, bukan seluruh tabel (puluhan ribu baris).
const _ymIdx = new WeakMap();
function ymRows(arr, y, m){
  let e = _ymIdx.get(arr);
  if(!e || e.len!==arr.length){ const map = new Map(); for(let i=0;i<arr.length;i++){ const r = arr[i], k = r.y*100+r.m; let b = map.get(k); if(!b){ b = []; map.set(k,b); } b.push(r); } e = {len:arr.length, map}; _ymIdx.set(arr, e); }
  return e.map.get(y*100+m) || [];
}
function eachRow(arr, yms, fn){
  if(!yms){ arr.forEach(fn); return; }
  const seen = new Set(); yms.forEach(x=>{ const k = x.y*100+x.m; if(seen.has(k)) return; seen.add(k); ymRows(arr, x.y, x.m).forEach(fn); });
}
function monthsRangeYms(y, m1, m2){ const out = []; for(let m=Math.min(m1,m2); m<=Math.max(m1,m2); m++) out.push({y,m}); return out; }
function lmRangeYms(y, m1, m2){ return monthsRangeYms(y,m1,m2).map(x=>{ let yy = x.y, mm = x.m-1; if(mm<1){ mm = 12; yy -= 1; } return {y:yy, m:mm}; }); }
function lmYmsFor(curYms){
  if(!curYms || !curYms.length) return null;
  const srt = curYms.slice().sort((p,q)=>p.y-q.y || p.m-q.m);
  if(srt.length>1) return srt.slice(0,-1);
  const c = srt[0]; let y = c.y, m = c.m-1; if(m<1){ m = 12; y -= 1; } return [{y,m}];
}
function invPred(yms, dayFilter){
  const ymSet = new Set(yms.map(x=>x.y+'-'+x.m));
  return r=>{
    if(!ymSet.has(r.y+'-'+r.m)) return false;
    if(r.d===undefined) return true;
    if(r.d > effectiveCutoffDay(r.y, r.m)) return false;
    if(dayFilter && !(r.d>=dayFilter.from && r.d<=dayFilter.to)) return false;
    return true;
  };
}
function invStatsFor(pred, yms){
  let inv=0, items=0, days=0; const sps=new Set();
  eachRow(STATE.spFact, yms, r=>{
    if(!pred(r)) return;
    if(!r.spId || String(r.spId).toLowerCase()==='null') return;
    if(r.inv===undefined || r.items===undefined) return; // data lama tanpa rincian invoice per salesperson
    inv += r.inv; items += r.items; if(r.inv>0) days++; sps.add(r.spId);
  });
  let storeInv=0; const sd=new Set();
  eachRow(STATE.notaFact, yms, r=>{ if(pred(r)){ storeInv++; sd.add(r.y+'-'+r.m+'-'+r.d); } });
  return {inv, items, days, sales:sps.size, storeInv, storeDays:sd.size};
}
function ipTotals(cur, ly){
  const ipd = cur.days ? cur.inv/cur.days : null, ipdLY = ly.days ? ly.inv/ly.days : null;
  const ipi = cur.inv ? cur.items/cur.inv : null,  ipiLY = ly.inv ? ly.items/ly.inv : null;
  return { invoice:cur.inv, invoiceLY:ly.inv, invDays:cur.days, invDaysLY:ly.days, itemCount:cur.items, salesActive:cur.sales,
    storeIpd: cur.storeDays ? cur.storeInv/cur.storeDays : null, ipd, ipdLY, ipi, ipiLY,
    ipdGrowth:(ipd!==null && ipdLY) ? (ipd-ipdLY)/ipdLY : null, ipiGrowth:(ipi!==null && ipiLY) ? (ipi-ipiLY)/ipiLY : null };
}
// ---- Invoice, Efektivitas Traffic, Basket Size (level toko; definisi sama dengan tab TIEBS) ----
// Invoice = jumlah nota unik (termasuk nota retur). Efektivitas Traffic = Invoice ÷ Traffic. Basket Size (Average Transaksi) = Sales ÷ Invoice.
// TY & LY apple-to-apple (bulan berjalan dipotong di tanggal yang sama).
function lmPredFor(curYms, dayFilter){
  // LM (Last Month): YTD/multi-bulan → posisi s/d bulan sebelumnya (tanpa bulan terakhir); 1 bulan → bulan sebelumnya pada rentang hari yang sama.
  if(!curYms || !curYms.length) return null;
  const srt = curYms.slice().sort((p,q)=>p.y-q.y || p.m-q.m);
  if(srt.length>1) return invPred(srt.slice(0,-1), dayFilter);
  const c = srt[0]; let y = c.y, m = c.m-1; if(m<1){ m = 12; y -= 1; }
  const cap = effectiveCutoffDay(c.y, c.m);
  return r=> r.y===y && r.m===m && r.d!==undefined && r.d<=cap && (!dayFilter || (r.d>=dayFilter.from && r.d<=dayFilter.to));
}
function storeInvMetrics(predCur, predLY, predLM, sales, salesLY, ymCur, ymLY, ymLM){
  const cnt = (pred, yms) => { let n = 0; eachRow(STATE.notaFact, yms, r=>{ if(pred(r)) n++; }); return n; };
  const trf = (pred, yms) => { let t = 0; eachRow(STATE.trafficFact, yms, r=>{ if(pred(r) && r.actual>0) t += r.actual; }); return t; };
  const sal = (pred, yms) => { let t = 0; eachRow(STATE.salesFact, yms, r=>{ if(pred(r)) t += r.amt; }); return t; };
  const g = (a,b)=> (a!==null && a!==undefined && b) ? (a-b)/b : null;
  const inv = cnt(predCur, ymCur), invLY = cnt(predLY, ymLY), tr = trf(predCur, ymCur), trLY = trf(predLY, ymLY);
  const eff = (inv && tr) ? inv/tr : null, effLY = (invLY && trLY) ? invLY/trLY : null;
  const bsk = inv ? sales/inv : null, bskLY = invLY ? salesLY/invLY : null;
  let invLM = 0, trLM = 0, effLM = null, bskLM = null;
  if(predLM){ invLM = cnt(predLM, ymLM); trLM = trf(predLM, ymLM); const sLM = sal(predLM, ymLM); effLM = (invLM && trLM) ? invLM/trLM : null; bskLM = invLM ? sLM/invLM : null; }
  // Budget (sama dengan tab TIEBS): invoice = Σ budget invoice; efektivitas = Σ budget invoice ÷ Σ budget traffic; basket = rata-rata budget basket harian
  let bInv=0, bInvN=0, bTr=0, bTrN=0, bBsk=0, bBskN=0;
  eachRow(STATE.trafficFact, ymCur, r=>{ if(!predCur(r)) return; if(r.budget!=null){ bTr += r.budget; bTrN++; } if(r.budgetInvoice!=null){ bInv += r.budgetInvoice; bInvN++; } if(r.budgetBasketSize!=null){ bBsk += r.budgetBasketSize; bBskN++; } });
  const budInv = bInvN ? bInv : null, budEff = (bInvN && bTr) ? bInv/bTr : null, budBsk = bBskN ? bBsk/bBskN : null;
  return { storeInvoice:inv, storeInvoiceLY:invLY, storeInvoiceLM:invLM, traffic:tr, trafficLY:trLY, eff, effLY, effLM, basket:bsk, basketLY:bskLY, basketLM:bskLM,
    trafficLM:trLM, budTraffic:(bTrN ? bTr : null), trafficAch:(bTrN && bTr) ? tr/bTr : null, trafficGrowthLY:g(tr,trLY), trafficGrowthLM:g(tr,trLM),
    budInvoice:budInv, budEff, budBasket:budBsk,
    invAch: (budInv ? inv/budInv : null), effAch: (eff!==null && budEff) ? eff/budEff : null, basketAch: (bsk!==null && budBsk) ? bsk/budBsk : null,
    invGrowthLY: g(inv, invLY), effGrowthLY: g(eff, effLY), basketGrowthLY: g(bsk, bskLY),
    invGrowthLM: g(inv, invLM), effGrowthLM: g(eff, effLM), basketGrowthLM: g(bsk, bskLM) };
}
function fmtDec(v, d){ return (v===null||v===undefined||!isFinite(v)) ? '-' : Number(v).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d}); }

function queryCatZona(yms, dayFilter){
  // yms: array of {y,m}; dayFilter: optional explicit {from,to} (used by custom ranges)
  const map = new Map(); // cat -> {amt,qty,pbAmt,pbQty}
  const ymSet = new Set(yms.map(x=>x.y+'-'+x.m));
  STATE.salesFact.forEach(r=>{
    if(!ymSet.has(r.y+'-'+r.m)) return;
    const cutoff = effectiveCutoffDay(r.y, r.m); // apple-to-apple: truncate in-progress month for both years
    if(r.d > cutoff) return;
    if(dayFilter && !(r.d>=dayFilter.from && r.d<=dayFilter.to)) return;
    if(!map.has(r.cat)) map.set(r.cat, {cat:r.cat, amt:0, qty:0, pbAmt:0, pbQty:0});
    const s = map.get(r.cat); s.amt+=r.amt; s.qty+=r.qty; s.pbAmt+=r.pbAmt; s.pbQty+=r.pbQty;
  });
  return [...map.values()].map(s=>({...s, zona: catToZona(s.cat, invSnapshotMonth())}));
}

// Aggregate day-progress ratio for the in-progress month, derived from the REAL daily budget
// pattern (weekday/weekend/holiday-aware) when available; falls back to a simple day-count
// fraction otherwise. Used to prorate Budget PB / Source Type budget consistently with the
// precision now used for Budget Store, since we don't have a separate daily PB budget file.
function dayProrationFactorForMonth(y, m){
  const latest = latestYMD();
  if(m !== latest.m) return 1;
  if(STATE.budgetDailyFact && STATE.budgetDailyFact.length){
    const monthRows = STATE.budgetDailyFact.filter(r=>r.m===m);
    if(monthRows.length){
      const fullMonthTotal = monthRows.reduce((a,r)=>a+r.value,0);
      const elapsedTotal = monthRows.filter(r=>r.d<=latest.d).reduce((a,r)=>a+r.value,0);
      if(fullMonthTotal>0) return elapsedTotal/fullMonthTotal;
    }
  }
  return latest.d / daysInMonth(y, m);
}

function dailyBreakdownForMonth(y, m, lyY){
  const dim = daysInMonth(y, m);
  const hasDailyBudget = STATE.budgetDailyFact && STATE.budgetDailyFact.some(r=>r.m===m);
  const monthBudgetTotal = STATE.budgetStoreFact.filter(r=>r.m===m).reduce((a,r)=>a+r.value,0);
  const rows = [];
  for(let d=1; d<=dim; d++){
    const salesTY = STATE.salesFact.filter(r=>r.y===y && r.m===m && r.d===d).reduce((a,r)=>a+r.amt,0);
    const salesLY = STATE.salesFact.filter(r=>r.y===lyY && r.m===m && r.d===d).reduce((a,r)=>a+r.amt,0);
    let budget;
    if(hasDailyBudget){
      budget = STATE.budgetDailyFact.filter(r=>r.m===m && r.d===d).reduce((a,r)=>a+r.value,0);
    } else {
      budget = monthBudgetTotal / dim;
    }
    rows.push({
      d, budget, salesTY, salesLY,
      achievement: safeDiv(salesTY, budget), growth: safeDiv(salesTY-salesLY, salesLY),
      diffBudget: salesTY-budget, diffLY: salesTY-salesLY,
    });
  }
  return rows;
}

function budgetByCatForMonths(months, table, budgetYear){
  // months: array of month numbers; table: 'budgetStoreFact'|'budgetPBFact'
  // For the latest in-progress month: Budget Store uses the actual daily budget target (sum of
  // days 1..latestDay, which correctly reflects weekday/weekend/holiday seasonality) when daily
  // data is available. Budget PB (no daily file of its own) is prorated using the SAME aggregate
  // day-progress ratio derived from the Store daily pattern, so both stay methodologically consistent.
  const map = new Map();
  const latest = latestYMD();
  const y = budgetYear || latest.y;
  const hasDailyBudget = table === 'budgetStoreFact' && STATE.budgetDailyFact && STATE.budgetDailyFact.length > 0;

  months.forEach(m => {
    if(m === latest.m && hasDailyBudget){
      const dayRows = STATE.budgetDailyFact.filter(r => r.m === m && r.d <= latest.d);
      const hasRowsForMonth = STATE.budgetDailyFact.some(r=>r.m===m);
      if(hasRowsForMonth){
        dayRows.forEach(r => map.set(r.cat, (map.get(r.cat)||0) + r.value));
        return;
      }
    }
    // full month (completed), or fallback for tables without their own daily file (e.g. PB)
    const factor = dayProrationFactorForMonth(y, m);
    STATE[table].filter(r=>r.m===m).forEach(r=>{
      map.set(r.cat, (map.get(r.cat)||0) + r.value*factor);
    });
  });
  return map;
}

// ---- Sales Protection (Qty & Value Exclude Tax) ----
// Value = jumlah Amount Exclude Sales dari baris ber-SubCategory "PROTECTION". Qty = jumlah unit terjual.
// Granularitas bulan (dipakai Overview/YTD/MTD) diambil dari brandFact; granularitas hari (dipakai Sales Daily)
// dijumlahkan dari spFact.protectionAmt/protectionQty per hari — kolom ini terisi pada data yang di-upload/
// refresh setelah fitur ini ditambahkan; histori lama akan tampil 0 sampai file sales-nya di-upload ulang.
function protectionTotalsForMonths(yms){
  const set = new Set(yms.map(x=>x.y+'-'+x.m));
  let amt=0, qty=0;
  STATE.brandFact.forEach(r=>{
    if(!set.has(r.y+'-'+r.m)) return;
    if(String(r.subcat||'').trim().toUpperCase()==='PROTECTION'){ amt+=r.amt; qty+=r.qty; }
  });
  return {protectionAmt:amt, protectionQty:qty};
}
function protectionTotalsForDayRange(y, fromM, fromD, toM, toD){
  let amt=0, qty=0;
  const fromOrd = new Date(y, fromM-1, fromD).getTime(), toOrd = new Date(y, toM-1, toD).getTime();
  (STATE.spFact||[]).forEach(r=>{
    if(r.y!==y) return;
    const ord = new Date(y, r.m-1, r.d).getTime();
    if(ord>=fromOrd && ord<=toOrd){ amt += (r.protectionAmt||0); qty += (r.protectionQty||0); }
  });
  return {protectionAmt:amt, protectionQty:qty};
}

function buildDetailRows(curYms, lyYms, budgetMonths, dayFilter, lyDayFilter, budgetYear, zonaMonth){
  const cur = queryCatZona(curYms, dayFilter);
  const ly = queryCatZona(lyYms, lyDayFilter);
  const budStore = budgetByCatForMonths(budgetMonths, 'budgetStoreFact', budgetYear);
  const budPB = budgetByCatForMonths(budgetMonths, 'budgetPBFact', budgetYear);
  const lyMap = new Map(ly.map(r=>[r.cat, r]));

  const allCats = new Set([...cur.map(r=>r.cat), ...ly.map(r=>r.cat), ...budStore.keys()]);
  const detail = [...allCats].map(cat=>{
    const c = cur.find(r=>r.cat===cat) || {amt:0,qty:0,pbAmt:0,pbQty:0};
    const l = lyMap.get(cat) || {amt:0,pbAmt:0};
    const bt = budStore.get(cat)||0, bpb = budPB.get(cat)||0;
    return {
      cat, zona: catToZona(cat, zonaMonth),
      sales: c.amt, salesLY: l.amt, growth: safeDiv(c.amt-l.amt, l.amt), diffGrowth: c.amt-l.amt,
      budgetToko: bt, achievement: safeDiv(c.amt, bt), diffBudget: c.amt-bt,
      budgetPB: bpb, pbSales: c.pbAmt, pbSalesLY: l.pbAmt,
      pbGrowth: safeDiv(c.pbAmt-l.pbAmt, l.pbAmt), pbAchievement: safeDiv(c.pbAmt, bpb),
      invValue: 0, invQty: 0,
    };
  });
  return detail;
}
function buildPeriodData(curYms, lyYms, budgetMonths, dayFilter, lyDayFilter, budgetYear){
  // Zona bisa berubah per bulan (ZONA_CHANGES): hitung per kelompok bulan dengan pemetaan yang sama, lalu gabungkan per (kategori, zona).
  const eps = new Map(), slot = e => { if(!eps.has(e)) eps.set(e,{cur:[],ly:[],bm:[]}); return eps.get(e); };
  curYms.forEach(x=>slot(zonaEpoch(x.m)).cur.push(x)); lyYms.forEach(x=>slot(zonaEpoch(x.m)).ly.push(x)); budgetMonths.forEach(m=>slot(zonaEpoch(m)).bm.push(m));
  if(!eps.size) slot(0);
  let detail = [];
  [...eps.entries()].sort((a,b)=>a[0]-b[0]).forEach(([e,g])=>{
    const zm = (g.cur[0] && g.cur[0].m) || g.bm[0] || (g.ly[0] && g.ly[0].m) || zonaRefMonth();
    detail = detail.concat(buildDetailRows(g.cur, g.ly, g.bm, dayFilter, lyDayFilter, budgetYear, zm));
  });
  if(eps.size>1){
    const mg = new Map();
    detail.forEach(d=>{ const k = d.cat+'|'+d.zona; if(!mg.has(k)) mg.set(k,{...d}); else { const t = mg.get(k); ['sales','salesLY','budgetToko','budgetPB','pbSales','pbSalesLY'].forEach(f=>{ t[f]+=d[f]; }); } });
    detail = [...mg.values()].map(d=>({...d, growth:safeDiv(d.sales-d.salesLY,d.salesLY), diffGrowth:d.sales-d.salesLY, achievement:safeDiv(d.sales,d.budgetToko), diffBudget:d.sales-d.budgetToko,
      pbGrowth:safeDiv(d.pbSales-d.pbSalesLY,d.pbSalesLY), pbAchievement:safeDiv(d.pbSales,d.budgetPB)}));
  }
  // attach inventory (category-level from sqvItems, static/current snapshot regardless of period)
  const invByCat = new Map();
  STATE.sqvItems.forEach(it=>{
    if(!invByCat.has(it.cat)) invByCat.set(it.cat, {value:0, qty:0});
    const s = invByCat.get(it.cat); s.value += it.value; s.qty += it.qty;
  });
  detail.forEach(d=>{ const inv = invByCat.get(d.cat); if(!inv) return;
    const same = detail.filter(x=>x.cat===d.cat); // kategori yang terbagi ke 2 Zona: stok dicatat sekali, di Zona sesuai tanggal stok
    if(same.length>1){ const tz = catToZona(d.cat, invSnapshotMonth()); const tgt = same.find(x=>x.zona===tz) || same[same.length-1]; if(d!==tgt) return; }
    d.invValue = inv.value; d.invQty = inv.qty; });

  // zona summary
  const zonaMap = new Map();
  detail.forEach(d=>{
    if(!zonaMap.has(d.zona)) zonaMap.set(d.zona, {zona:d.zona, sales:0, salesLY:0, budgetToko:0, pbSales:0, pbSalesLY:0, budgetPB:0, invValue:0, invQty:0});
    const z = zonaMap.get(d.zona);
    z.sales+=d.sales; z.salesLY+=d.salesLY; z.budgetToko+=d.budgetToko;
    z.pbSales+=d.pbSales; z.pbSalesLY+=d.pbSalesLY; z.budgetPB+=d.budgetPB;
    z.invValue+=d.invValue; z.invQty+=d.invQty;
  });
  const zonaSummary = [...zonaMap.values()].map(z=>({
    ...z,
    growth: safeDiv(z.sales-z.salesLY, z.salesLY), diffGrowth: z.sales-z.salesLY,
    achievement: safeDiv(z.sales, z.budgetToko), diffBudget: z.sales-z.budgetToko,
    pbGrowth: safeDiv(z.pbSales-z.pbSalesLY, z.pbSalesLY),
    pbAchievement: safeDiv(z.pbSales, z.budgetPB),
  })).sort((a,b)=>a.zona.localeCompare(b.zona));

  const totalSales = detail.reduce((a,d)=>a+d.sales,0);
  const totalSalesLY = detail.reduce((a,d)=>a+d.salesLY,0);
  const totalBudget = detail.reduce((a,d)=>a+d.budgetToko,0);
  const totalPB = detail.reduce((a,d)=>a+d.pbSales,0);
  const totalPBLY = detail.reduce((a,d)=>a+d.pbSalesLY,0);
  const totalBudgetPB = detail.reduce((a,d)=>a+d.budgetPB,0);
  const totalInv = detail.reduce((a,d)=>a+d.invValue,0);

  const protection = protectionTotalsForMonths(curYms);
  const total = {
    sales: totalSales, salesLY: totalSalesLY, growth: safeDiv(totalSales-totalSalesLY,totalSalesLY),
    budgetToko: totalBudget, achievement: safeDiv(totalSales,totalBudget),
    budgetPB: totalBudgetPB, pbSales: totalPB, pbSalesLY: totalPBLY,
    pbGrowth: safeDiv(totalPB-totalPBLY,totalPBLY), pbAchievement: safeDiv(totalPB,totalBudgetPB),
    invValue: totalInv,
    protectionAmt: protection.protectionAmt, protectionQty: protection.protectionQty,
    ...ipTotals(invStatsFor(invPred(curYms, dayFilter), curYms), invStatsFor(invPred(lyYms, lyDayFilter), lyYms)),
  };

  Object.assign(total, storeInvMetrics(invPred(curYms, dayFilter), invPred(lyYms, lyDayFilter), lmPredFor(curYms, dayFilter), total.sales, total.salesLY, curYms, lyYms, lmYmsFor(curYms)));
  return { detail: detail.sort((a,b)=> a.zona.localeCompare(b.zona) || b.sales-a.sales), zonaSummary, total };
}

// ---- Brand query ----
// NOTE: grouping key is Category + Master Brand ONLY (not SubCategory/Function).
// A master brand (e.g. "TOTO") can span many Functions (Lavatory Mixer, Toilet, Shower, etc.)
// within the same Category — those must be summed into a single row, not listed separately.
// SubCategory/Function filters (fSubcat/fFunc) still narrow which underlying records are
// included via `match()`, they just no longer fragment the output rows.
function queryBrand(curYms, lyYms, filters){
  const match = r => (!filters.cat || r.cat===filters.cat) && (!filters.subcat || r.subcat===filters.subcat) && (!filters.func || r.func===filters.func);
  const curSet = new Set(curYms.map(x=>x.y+'-'+x.m));
  const lySet = new Set(lyYms.map(x=>x.y+'-'+x.m));
  const curMap = new Map(), lyMap = new Map();
  const ly2025MonthMap = new Map(); // key -> Map(month -> summed amt across subcat/func) for avg LY budget calc

  STATE.brandFact.forEach(r=>{
    if(!match(r)) return;
    const k = r.cat+'|'+r.brand;
    if(curSet.has(r.y+'-'+r.m)){
      if(!curMap.has(k)) curMap.set(k, {cat:r.cat,brand:r.brand,amt:0,qty:0});
      const s = curMap.get(k); s.amt+=r.amt; s.qty+=r.qty;
    }
    if(r.y===2025){
      if(!ly2025MonthMap.has(k)) ly2025MonthMap.set(k, new Map());
      const mm = ly2025MonthMap.get(k);
      mm.set(r.m, (mm.get(r.m)||0)+r.amt);
    }
    if(lySet.has(r.y+'-'+r.m)){
      if(!lyMap.has(k)) lyMap.set(k, {amt:0});
      lyMap.get(k).amt += r.amt;
    }
  });

  // pre-aggregate this-year (2026) monthly totals per cat+brand, summed across subcat/func,
  // used as the fallback budget basis when there's no LY(2025) data for this brand.
  const thisYearMonthMap = new Map();
  STATE.brandFact.forEach(r=>{
    if(!match(r)) return;
    if(r.y!==2026) return;
    const k = r.cat+'|'+r.brand;
    if(!thisYearMonthMap.has(k)) thisYearMonthMap.set(k, new Map());
    const mm = thisYearMonthMap.get(k);
    mm.set(r.m, (mm.get(r.m)||0)+r.amt);
  });

  // Number of months covered by the selected period (1 for MTD, N for YTD-so-far).
  // Budget is a PER-MONTH figure (avg monthly sales LY, or fallback highest month this year),
  // so it must be scaled by how many months are in view — otherwise YTD budget would equal
  // a single month's budget instead of accumulating across the months elapsed.
  const monthsInPeriod = curYms.length || 1;

  const allKeys = new Set([...curMap.keys(), ...lyMap.keys()]);
  const rows = [...allKeys].map(k=>{
    const c = curMap.get(k) || {amt:0,qty:0, ...Object.fromEntries(k.split('|').map((v,i)=>[['cat','brand'][i],v]))};
    const l = lyMap.get(k) || {amt:0};
    const ly2025 = ly2025MonthMap.get(k);
    let perMonthBudget;
    if(ly2025 && ly2025.size>0){
      const vals = [...ly2025.values()];
      perMonthBudget = vals.reduce((a,b)=>a+b,0)/vals.length; // avg monthly sales LY
    } else {
      // fallback: highest month sales this year (2026) for this cat+brand (summed across subcat/func)
      const vals = [...(thisYearMonthMap.get(k)||new Map()).values()];
      perMonthBudget = vals.length ? Math.max(...vals) : 0;
    }
    const budget = perMonthBudget * monthsInPeriod; // accumulate across the months in the selected period
    return {
      cat:c.cat, brand:c.brand,
      sales:c.amt, qty:c.qty, salesLY:l.amt, growth: safeDiv(c.amt-l.amt,l.amt), diffGrowth: c.amt-l.amt,
      budget, achievement: safeDiv(c.amt, budget), diffBudget: c.amt-budget,
    };
  });
  // attach inventory by masterBrand, aggregated across subcat/func (best-effort via sqvItems groupby masterBrand+cat)
  const invMap = new Map();
  STATE.sqvItems.forEach(it=>{
    const k = it.cat+'|'+it.masterBrand;
    if(!invMap.has(k)) invMap.set(k, {value:0,qty:0});
    const s = invMap.get(k); s.value+=it.value; s.qty+=it.qty;
  });
  rows.forEach(r=>{
    const k = r.cat+'|'+r.brand;
    const inv = invMap.get(k);
    r.invValue = inv?inv.value:0; r.invQty = inv?inv.qty:0;
  });
  return rows.sort((a,b)=>b.sales-a.sales);
}

function brandFilterOptions(){
  const cats = new Set(), subcatByCat = new Map(), funcBySubcat = new Map();
  STATE.brandFact.forEach(r=>{
    cats.add(r.cat);
    if(!subcatByCat.has(r.cat)) subcatByCat.set(r.cat, new Set());
    subcatByCat.get(r.cat).add(r.subcat);
    const sk = r.cat+'|'+r.subcat;
    if(!funcBySubcat.has(sk)) funcBySubcat.set(sk, new Set());
    funcBySubcat.get(sk).add(r.func);
  });
  return { cats:[...cats].sort(), subcatByCat, funcBySubcat };
}

// ---- Item query ----
function queryItems(curYms, lyYms, filters){
  const curSet = new Set(curYms.map(x=>x.y+'-'+x.m));
  const lySet = new Set(lyYms.map(x=>x.y+'-'+x.m));
  const curMap = new Map(), lyMap = new Map();
  STATE.itemFact.forEach(r=>{
    const meta = STATE.itemMeta[r.item];
    if(!meta) return;
    if(filters.cat && meta.cat!==filters.cat) return;
    if(filters.masterBrand && meta.masterBrand!==filters.masterBrand) return;
    if(filters.brand && meta.brand!==filters.brand) return;
    if(curSet.has(r.y+'-'+r.m)){
      if(!curMap.has(r.item)) curMap.set(r.item, {amt:0,qty:0});
      const s = curMap.get(r.item); s.amt+=r.amt; s.qty+=r.qty;
    }
    if(lySet.has(r.y+'-'+r.m)){
      if(!lyMap.has(r.item)) lyMap.set(r.item, {amt:0, qty:0});
      const l = lyMap.get(r.item); l.amt += r.amt; l.qty += r.qty;
    }
  });
  const invByItem = {};
  STATE.sqvItems.forEach(it=>{ invByItem[it.item] = it; });

  const allItems = new Set([...curMap.keys(), ...lyMap.keys()]);
  const rows = [...allItems].map(item=>{
    const meta = STATE.itemMeta[item] || {};
    const c = curMap.get(item) || {amt:0,qty:0};
    const l = lyMap.get(item) || {amt:0,qty:0};
    const inv = invByItem[item];
    const dcMap = STATE.dcByItem[item] || {};
    return {
      item, name: meta.name||'(?)', cat: meta.cat||'', masterBrand: meta.masterBrand||'', brand: meta.brand||'',
      sales: c.amt, qty: c.qty, salesLY: l.amt, qtyLY: l.qty, growth: safeDiv(c.amt-l.amt, l.amt), diffGrowth: c.amt-l.amt,
      invValue: inv?inv.value:0, invQty: inv?inv.qty:0, cls: inv?inv.cls:null,
      dcByPlace: dcMap, dcTotal: Object.values(dcMap).reduce((a,v)=>a+v,0),
    };
  });
  return rows.sort((a,b)=>b.sales-a.sales);
}

function itemFilterOptions(){
  const cats = new Set(), mbByCat = new Map(), brandByMb = new Map();
  Object.values(STATE.itemMeta).forEach(m=>{
    cats.add(m.cat);
    if(!mbByCat.has(m.cat)) mbByCat.set(m.cat, new Set());
    mbByCat.get(m.cat).add(m.masterBrand);
    const k = m.cat+'|'+m.masterBrand;
    if(!brandByMb.has(k)) brandByMb.set(k, new Set());
    brandByMb.get(k).add(m.brand);
  });
  return { cats:[...cats].sort(), mbByCat, brandByMb };
}

// ---- Salper master lookup (Zona/Kriteria/Master Brand come from the uploaded "Database Salesperson", NOT product category) ----
function salperMap(){
  const m = new Map();
  STATE.salperFact.forEach(r=>m.set(r.spId, r));
  return m;
}
// Nama dibersihkan: spasi ganda dirapikan, nama yang terulang ("ASTRI ASTRI") dijadikan satu, huruf kapital di awal kata.
function cleanName(n){
  let t = String(n==null?'':n).replace(/\s+/g,' ').trim(); if(!t) return t;
  const w = t.split(' ');
  if(w.length%2===0){ const h = w.length/2; if(w.slice(0,h).map(x=>x.toLowerCase()).join(' ')===w.slice(h).map(x=>x.toLowerCase()).join(' ')) t = w.slice(0,h).join(' '); }
  return t.toLowerCase().replace(/(^|[\s.'-])([a-z\u00C0-\u024F])/g, (m,p,c)=>p+c.toUpperCase());
}
const KRITERIA_ABBR = {'Supplier':'SPP','Private Brand':'PB','Team Leader':'TL'};
function abbrKriteria(k){ return KRITERIA_ABBR[k] || k; }
function salperInfo(map, spId, fallbackName){
  const r = map.get(spId);
  if(r) return { zona: r.zona||'Belum Terdaftar', kriteria: r.kriteria||'Belum Terdaftar', masterBrand: r.masterBrand||'', spName: cleanName(r.spName||fallbackName||spId) };
  return { zona: 'Belum Terdaftar', kriteria: 'Belum Terdaftar', masterBrand: '', spName: cleanName(fallbackName||spId) };
}
const SALPER_BUDGET_ZONAS = ['Zona 1','Zona 2','Zona 3','Zona 4']; // zona scope for Budget Sales Person

// Budget Sales Person: looked up directly from the uploaded "BUDGET SALPER" table (per zona, per month),
// applied equally to every Private Brand/Supplier salesperson in that zona. Apple-to-apple: for the current
// in-progress month, the table's full-month figure is prorated by day-elapsed (same method used store-wide).
function budgetForZonaMonth(zona, y, m){
  const row = STATE.budgetSalperFact.find(r=>r.zona===zona && r.m===m);
  if(!row) return 0;
  return row.value * dayProrationFactorForMonth(y, m);
}

// ---- Salesperson query ----
// filters: {zona, kriteria} — both optional. curYms/lyYms: arrays of {y,m}. Budget is a TY-only concept.
// dayFilter: optional {from,to} day-of-month range — applied to BOTH cur and ly (apple-to-apple), only
// meaningful when curYms/lyYms span a single month each (i.e. Periode = MTD on the Sales Person page).
// IPD/IPI per salesperson: hanya dihitung bila SEMUA baris data periode itu memuat jumlah invoice (data dari sales CSV yang diupload
// setelah fitur ini ada). Data lama (tanpa rincian invoice per salesperson) dibiarkan kosong supaya angkanya tidak menyesatkan.
// IPD = invoice ÷ hari salesperson tsb membuat invoice; IPI = item (SKU berbeda per invoice) ÷ invoice.
function noSp(id){ return !id || String(id).toLowerCase()==='null'; } // baris 'tanpa salesperson' bukan salesperson aktif
function spIp(o){
  if(!o || !o.rows) return {ipd:null, ipi:null, inv:0, days:0, items:0, ipLegacy:false};
  if(o.rowsInv < o.rows) return {ipd:null, ipi:null, inv:0, days:0, items:0, ipLegacy:true};
  return {ipd: o.days ? o.inv/o.days : null, ipi: o.inv ? o.items/o.inv : null, inv:o.inv, days:o.days, items:o.items, ipLegacy:false};
}
function querySalesperson(curYms, lyYms, filters, dayFilter){
  filters = filters || {};
  const spMap = salperMap();
  const curSet = new Set(curYms.map(x=>x.y+'-'+x.m));
  const lySet = new Set(lyYms.map(x=>x.y+'-'+x.m));
  const inDayRange = r => !dayFilter || (r.d>=dayFilter.from && r.d<=dayFilter.to);
  // Data LY lama (2025) tersimpan per bulan tanpa tanggal: bulan penuh → dipakai utuh; rentang tanggal parsial → dihitung proporsional jumlah hari.
  const lyW = r => { if(r.d!==undefined) return inDayRange(r) ? 1 : 0; if(!dayFilter) return 1; const dim = daysInMonth(r.y,r.m), lo = Math.max(1,dayFilter.from), hi = Math.min(dim,dayFilter.to); return hi>=lo ? (hi-lo+1)/dim : 0; };
  const actM = new Map(); // bulan aktif tiap salesperson (membuat sales) → dasar budget proporsional

  const cur = new Map(), ly = new Map();
  STATE.spFact.forEach(r=>{
    const ymk = r.y+'-'+r.m;
    if(curSet.has(ymk) && (r.amt!==0 || (r.inv||0)>0)){ let st = actM.get(r.spId); if(!st){ st = new Set(); actM.set(r.spId, st); } st.add(ymk); }
    if(curSet.has(ymk) && inDayRange(r)){
      if(!cur.has(r.spId)) cur.set(r.spId, {amt:0,pbAmt:0,protectionQty:0,projectAmt:0,whatsappAmt:0,spName:cleanName(r.spName),rows:0,rowsInv:0,inv:0,qty:0,items:0,days:0});
      const s = cur.get(r.spId);
      s.rows++; if(r.inv!==undefined && r.items!==undefined){ s.rowsInv++; s.inv+=r.inv; s.items+=r.items; s.qty+=(r.qty||0); if(r.inv>0) s.days++; }
      s.amt+=r.amt; s.pbAmt+=r.pbAmt; s.protectionQty+=(r.protectionQty||0); s.projectAmt+=(r.projectAmt||0); s.whatsappAmt+=(r.whatsappAmt||0);
      if(r.spName) s.spName = r.spName;
    }
    const wLY = lySet.has(ymk) ? lyW(r) : 0;
    if(wLY>0){
      if(!ly.has(r.spId)) ly.set(r.spId, {amt:0,rows:0,rowsInv:0,inv:0,qty:0,items:0,days:0});
      const sl = ly.get(r.spId); sl.amt += r.amt*wLY;
      sl.rows++; if(r.inv!==undefined && r.items!==undefined){ sl.rowsInv++; sl.inv+=r.inv; sl.items+=r.items; sl.qty+=(r.qty||0); if(r.inv>0) sl.days++; }
    }
  });

  // Zona-level Private Brand + Exclusive Brand pool (shared team KPI for Kriteria "Private Brand")
  const pbPoolByZona = new Map(), pbPoolByZonaLY = new Map();
  STATE.salesFact.forEach(r=>{
    const z = catToZona(r.cat, r.m), ymk = r.y+'-'+r.m;
    if(!inDayRange(r)) return;
    if(curSet.has(ymk)) pbPoolByZona.set(z, (pbPoolByZona.get(z)||0)+r.pbAmt);
    if(lySet.has(ymk)) pbPoolByZonaLY.set(z, (pbPoolByZonaLY.get(z)||0)+r.pbAmt);
  });
  // Master Brand sales pool (KPI for Kriteria "Supplier" — each rep is measured on their assigned brand's total sales).
  // Keyed uppercase: sales data stores Master Brand in UPPERCASE, while the Database Salesperson file may use Title Case.
  const brandPool = new Map(), brandPoolLY = new Map();
  STATE.brandFact.forEach(r=>{
    const ymk = r.y+'-'+r.m, bkey = String(r.brand||'').trim().toUpperCase();
    if(curSet.has(ymk)) brandPool.set(bkey, (brandPool.get(bkey)||0)+r.amt);
    if(lySet.has(ymk)) brandPoolLY.set(bkey, (brandPoolLY.get(bkey)||0)+r.amt);
  });

  const allIds = new Set([...spMap.keys(), ...cur.keys(), ...ly.keys()]);
  let rows = [...allIds].map(spId=>{
    const c = cur.get(spId) || {amt:0,pbAmt:0,protectionQty:0,projectAmt:0,whatsappAmt:0};
    const l = ly.get(spId) || {amt:0};
    const info = salperInfo(spMap, spId, c.spName || l.spName);

    let budget = 0;
    if(SALPER_BUDGET_ZONAS.includes(info.zona) && (info.kriteria==='Private Brand' || info.kriteria==='Supplier')){
      const act = actM.get(spId); // budget hanya untuk bulan saat salesperson membuat sales (proporsional)
      curYms.forEach(({y,m})=>{ if(act && act.has(y+'-'+m)) budget += budgetForZonaMonth(info.zona, y, m); });
    }

    const mbKey = String(info.masterBrand||'').trim().toUpperCase();
    const salesByBrand = info.kriteria==='Private Brand' ? (pbPoolByZona.get(info.zona)||0)
      : info.kriteria==='Supplier' ? (brandPool.get(mbKey)||0) : 0;
    const salesByBrandLY = info.kriteria==='Private Brand' ? (pbPoolByZonaLY.get(info.zona)||0)
      : info.kriteria==='Supplier' ? (brandPoolLY.get(mbKey)||0) : 0;

    return {
      spId, spName: info.spName, zona: info.zona, kriteria: info.kriteria, masterBrand: info.masterBrand, tl: tlOf(spId),
      budget, amt: c.amt, salesLY: l.amt,
      achieve: safeDiv(c.amt, budget), diffBudget: c.amt-budget, growth: safeDiv(c.amt-l.amt, l.amt),
      salesByBrand, salesByBrandLY, salesByBrandGrowth: safeDiv(salesByBrand-salesByBrandLY, salesByBrandLY),
      protectionQty: c.protectionQty, projectAmt: c.projectAmt, whatsappAmt: c.whatsappAmt,
      pbAmt: c.pbAmt,
      ...spIp(noSp(spId) ? null : c), ...(function(o){ const x = spIp(noSp(spId) ? null : o); return {ipdLY:x.ipd, ipiLY:x.ipi, invLY:x.inv, daysLY:x.days, itemsLY:x.items}; })(l),
    };
  });

  if(filters.zona) rows = rows.filter(r=>r.zona===filters.zona);
  if(filters.kriteria) rows = rows.filter(r=>r.kriteria===filters.kriteria);
  if(filters.tl) rows = rows.filter(r=> filters.tl==='__none__' ? !r.tl : r.tl===filters.tl);

  const personTotal = rows.map(r=>({spId:r.spId, spName:r.spName, amt:r.amt, salesLY:r.salesLY, growth:r.growth, pbAmt:r.pbAmt}))
    .sort((a,b)=>b.amt-a.amt);

  // Detail Sales Person by Zona table sorts by Achieve (highest first); rows tanpa budget (achieve=0) turun ke bawah
  rows.sort((a,b)=>b.achieve-a.achieve);

  return { byZona: rows, personTotal };
}

// ---- Top salesperson helpers (replaces "Sales Summary by Zona") ----
// Top N by a single month's sales, and Top N cumulative YTD (Jan..uptoMonth), both respecting zona/kriteria filters.
function topSalperForMonths(yms, filters, n){
  filters = filters || {};
  const spMap = salperMap();
  const set = new Set(yms.map(x=>x.y+'-'+x.m));
  const agg = new Map();
  STATE.spFact.forEach(r=>{
    if(!set.has(r.y+'-'+r.m)) return;
    if(!agg.has(r.spId)) agg.set(r.spId, {amt:0, spName:r.spName});
    const a = agg.get(r.spId); a.amt += r.amt; if(r.spName) a.spName = r.spName;
  });
  let rows = [...agg.entries()].map(([spId,v])=>{
    const info = salperInfo(spMap, spId, v.spName);
    return { spId, spName: info.spName, zona: info.zona, kriteria: info.kriteria, amt: v.amt };
  });
  if(filters.zona) rows = rows.filter(r=>r.zona===filters.zona);
  if(filters.kriteria) rows = rows.filter(r=>r.kriteria===filters.kriteria);
  if(filters.tl) rows = rows.filter(r=> filters.tl==='__none__' ? !tlOf(r.spId) : tlOf(r.spId)===filters.tl);
  rows.sort((a,b)=>b.amt-a.amt);
  return rows.slice(0, n||3);
}


// ---- Ticket size query ----
// filters: {zona, cat} — both optional. When set, tiers are computed from each nota's amount
// restricted to the matching Category/Zona lines only (via notaCatFact), not the whole receipt.
function queryTicketSize(yms, lyYms, filters){
  filters = filters || {};
  function tierFn(v){
    if(v<0) return 'Return';
    if(v<500000) return '< 500rb';
    if(v<=1000000) return '500rb - 1jt';
    if(v<=2000000) return '1jt - 2jt';
    if(v<=5000000) return '2jt - 5jt';
    if(v<=10000000) return '5jt - 10jt';
    if(v<=25000000) return '10jt - 25jt';
    if(v<=50000000) return '25jt - 50jt';
    if(v<=100000000) return '50jt - 100jt';
    return '> 100jt';
  }
  const order = ['Return','< 500rb','500rb - 1jt','1jt - 2jt','2jt - 5jt','5jt - 10jt','10jt - 25jt','25jt - 50jt','50jt - 100jt','> 100jt'];
  function build(ymsList){
    const ymSet = new Set(ymsList.map(x=>x.y+'-'+x.m));
    // apple-to-apple: truncate the in-progress month to the same running day in both years
    let notas;
    const dayOk = r => !filters.dayFrom || r.d===undefined || (r.d>=filters.dayFrom && r.d<=filters.dayTo); // filter tanggal (MTD)
    if(filters.zona || filters.cat){
      // Filtered view: sum only the matching Category/Zona lines within each nota, keyed per receipt.
      const perNota = new Map();
      STATE.notaCatFact.forEach(r=>{
        if(!ymSet.has(r.y+'-'+r.m)) return;
        if(filters.cat && r.cat !== filters.cat) return;
        if(filters.zona && catToZona(r.cat, r.m) !== filters.zona) return;
        const cutoff = effectiveCutoffDay(r.y, r.m);
        if(r.d!==undefined && r.d>cutoff) return;
        if(!dayOk(r)) return;
        const k = r.y+'-'+r.m+'-'+r.d+'-'+r.nota;
        perNota.set(k, (perNota.get(k)||0) + r.amt);
      });
      notas = [...perNota.values()].map(amt=>({amt}));
    } else {
      notas = STATE.notaFact.filter(r=>{
        if(!ymSet.has(r.y+'-'+r.m)) return false;
        const cutoff = effectiveCutoffDay(r.y, r.m);
        return ((r.d===undefined) || r.d<=cutoff) && dayOk(r);
      });
    }
    const map = new Map(order.map(t=>[t,{tier:t,count:0,totalValue:0}]));
    notas.forEach(n=>{ const t = tierFn(n.amt); const s = map.get(t); s.count++; s.totalValue += n.amt; });
    return map;
  }
  const curMap = build(yms);
  const lyMap = lyYms ? build(lyYms) : null;
  return order.map(t=>{
    const s = curMap.get(t);
    const row = {...s, avgValue: safeDiv(s.totalValue, s.count)};
    if(lyMap){
      const l = lyMap.get(t);
      row.countLY = l.count; row.totalValueLY = l.totalValue;
      row.countGrowth = safeDiv(s.count-l.count, l.count);
      row.valueGrowth = safeDiv(s.totalValue-l.totalValue, l.totalValue);
    }
    return row;
  });
}

// ---- Traffic query (apple-to-apple by running day, same cutoff logic as ticket size) ----
function queryTraffic(yms, lyYms, dayFilter){
  function sumTY(ymsList){
    const ymSet = new Set(ymsList.map(x=>x.y+'-'+x.m));
    let budget=0, actual=0, budgetInvoice=0, budgetInvoiceN=0, basketSum=0, basketN=0;
    STATE.trafficFact.forEach(r=>{
      if(!ymSet.has(r.y+'-'+r.m)) return;
      const cutoff = effectiveCutoffDay(r.y, r.m);
      if(r.d > cutoff) return;
      if(dayFilter && (r.d<dayFilter.from || r.d>dayFilter.to)) return;
      if(r.budget!==null && r.budget!==undefined) budget += r.budget;
      if(r.actual!==null && r.actual!==undefined) actual += r.actual;
      if(r.budgetInvoice!==null && r.budgetInvoice!==undefined){ budgetInvoice += r.budgetInvoice; budgetInvoiceN++; }
      if(r.budgetBasketSize!==null && r.budgetBasketSize!==undefined){ basketSum += r.budgetBasketSize; basketN++; }
    });
    // Budget Efektivitas Traffic = Budget Invoice / Budget Traffic (weighted avg, consistent with the Actual ratio formula).
    const budgetEffTraffic = (budgetInvoiceN>0 && budget>0) ? budgetInvoice/budget : null;
    // Budget Basket Size is a per-day Rp target (not additive) -> use the average of the days in the period.
    const budgetBasketSize = (basketN>0) ? basketSum/basketN : null;
    return {budget, actual, budgetInvoice: (budgetInvoiceN>0) ? budgetInvoice : null, budgetEffTraffic, budgetBasketSize};
  }
  function sumLY(ymsList){
    const ymSet = new Set(ymsList.map(x=>x.y+'-'+x.m));
    let actual=0;
    STATE.trafficFact.forEach(r=>{
      if(!ymSet.has(r.y+'-'+r.m)) return;
      const cutoff = effectiveCutoffDay(r.y, r.m);
      if(r.d > cutoff) return;
      if(dayFilter && (r.d<dayFilter.from || r.d>dayFilter.to)) return;
      if(r.actual!==null && r.actual!==undefined) actual += r.actual;
    });
    return actual;
  }
  const ty = sumTY(yms);
  const ly = lyYms ? sumLY(lyYms) : 0;
  return { budget: ty.budget, actual: ty.actual, ly,
    budgetInvoice: ty.budgetInvoice, budgetEffTraffic: ty.budgetEffTraffic, budgetBasketSize: ty.budgetBasketSize };
}

// ---- Source type query ----
function allSourceTypes(){
  return [...new Set(STATE.sourceFact.map(r=>r.source))].sort();
}
// "Ringkasan per Bulan" (dipakai saat Periode = YTD): breakdown Sales by Source Type per bulan.
function sourceMonthlyBreakdown(y, months){
  const types = allSourceTypes();
  return months.map(m=>{
    const row = {m, total:0};
    types.forEach(t=>{
      const rec = STATE.sourceFact.find(r=>r.y===y && r.m===m && r.source===t);
      const amt = rec ? rec.amt : 0;
      row[t] = amt; row.total += amt;
    });
    return row;
  });
}
// "Ringkasan per Tanggal Sepanjang Bulan" (dipakai saat Periode = MTD): breakdown Sales by Source Type per tanggal.
// Dihitung LANGSUNG dari data yang sudah ada di granularitas harian — tidak perlu upload ulang:
//  - Sales Project & WhatsApp per hari: sudah tercatat per salesperson per hari (spFact.projectAmt/whatsappAmt)
//  - Total sales per hari: dari salesFact (semua kategori)
//  - Source type lain (mis. "Stationary") = sisa (Total - Project - WhatsApp). Ini eksak, bukan estimasi, selama
//    3 source type (Sales Project/Stationary/WhatsApp) memang partisi lengkap dari total sales.
//    Jika ada lebih dari 1 source type selain Sales Project/WhatsApp, sisa dibagi proporsional sesuai kontribusi
//    bulanan masing-masing (fallback estimasi untuk kasus itu saja).
function sourceDailyBreakdown(y, m){
  const types = allSourceTypes();
  const otherTypes = types.filter(t=>t!=='Sales Project' && t!=='WhatsApp');
  const otherMonthly = otherTypes.map(t=>{
    const rec = STATE.sourceFact.find(r=>r.y===y && r.m===m && r.source===t);
    return {t, amt: rec?rec.amt:0};
  });
  const otherMonthlyTotal = otherMonthly.reduce((a,o)=>a+o.amt,0) || 1;

  const dim = daysInMonth(y, m);
  const totalByDay = new Map();
  STATE.salesFact.forEach(r=>{ if(r.y===y && r.m===m) totalByDay.set(r.d, (totalByDay.get(r.d)||0)+r.amt); });
  const projByDay = new Map(), waByDay = new Map();
  STATE.spFact.forEach(r=>{
    if(r.y!==y || r.m!==m) return;
    projByDay.set(r.d, (projByDay.get(r.d)||0) + (r.projectAmt||0));
    waByDay.set(r.d, (waByDay.get(r.d)||0) + (r.whatsappAmt||0));
  });
  const rows = [];
  for(let d=1; d<=dim; d++){
    const total = totalByDay.get(d) || 0;
    const proj = projByDay.get(d) || 0;
    const wa = waByDay.get(d) || 0;
    const remainder = Math.max(0, total - proj - wa);
    const row = {d, total};
    if(types.includes('Sales Project')) row['Sales Project'] = proj;
    if(types.includes('WhatsApp')) row['WhatsApp'] = wa;
    if(otherTypes.length===1){
      row[otherTypes[0]] = remainder;
    } else {
      otherMonthly.forEach(o=>{ row[o.t] = remainder * safeDiv(o.amt, otherMonthlyTotal); });
    }
    rows.push(row);
  }
  return rows;
}
const valInv = (val, inv) => fmtRp(val) + (inv ? ' ('+fmtNum(inv)+' Inv)' : '');

function querySourceType(curYms, lyYms, budgetMonths){
  const curSet = new Set(curYms.map(x=>x.y+'-'+x.m));
  const lySet = new Set(lyYms.map(x=>x.y+'-'+x.m));
  const cur = new Map(), ly = new Map(), lyInv = new Map();
  STATE.sourceFact.forEach(r=>{
    if(curSet.has(r.y+'-'+r.m)){
      if(!cur.has(r.source)) cur.set(r.source, {source:r.source, amt:0, invoice:0});
      const s = cur.get(r.source); s.amt+=r.amt; s.invoice+=r.invoice;
    }
    if(lySet.has(r.y+'-'+r.m)){
      ly.set(r.source, (ly.get(r.source)||0) + r.amt); lyInv.set(r.source, (lyInv.get(r.source)||0) + (r.invoice||0));
    }
  });
  const totalSales = [...cur.values()].reduce((a,r)=>a+r.amt,0);
  const projBudget = budgetMonths.reduce((a,m)=>a+(STATE.budgetProjectMonthly[m]||0)*dayProrationFactorForMonth(latestYMD().y, m), 0);
  const storeBudget = [...budgetByCatForMonths(budgetMonths,'budgetStoreFact').values()].reduce((a,v)=>a+v,0);
  const remaining = storeBudget - projBudget;
  const nonProjectTotal = [...cur.values()].filter(r=>r.source!=='Sales Project').reduce((a,r)=>a+r.amt,0);

  return [...cur.values()].map(r=>{
    const lyAmt = ly.get(r.source)||0;
    const isProject = r.source === 'Sales Project';
    const budget = isProject ? projBudget : remaining * safeDiv(r.amt, nonProjectTotal);
    return {
      source: r.source, sales: r.amt, salesLY: lyAmt, growth: safeDiv(r.amt-lyAmt, lyAmt),
      kontribusi: safeDiv(r.amt, totalSales), invoice: r.invoice, invoiceLY: lyInv.get(r.source)||0,
      budget, achievement: safeDiv(r.amt, budget), isEstimate: !isProject,
    };
  }).sort((a,b)=>b.sales-a.sales);
}

// ---- Inventory ----
// Class inventory dinormalisasi: file sumber menyimpan 'B    ' (spasi pengisi) sehingga warna & urutan class sebelumnya tidak terbaca.
// A/B/C/D dikenali apa adanya; selain itu (kosong / tidak dikenal) = '' → dikelompokkan sebagai "Non Class".
function invClsNorm(v){ const c = String(v==null?'':v).trim().toUpperCase(); return ['A','B','C','D'].includes(c) ? c : ''; }
// Ringkasan per Class lengkap dengan persentase (share) terhadap total: Value, Qty, dan jumlah SKU/Item.
function queryInventoryByClass(){
  const keys = ['A','B','C','D','NONE'];
  const m = {}; keys.forEach(k=>{ m[k] = {cls:k, value:0, qty:0, items:new Set()}; });
  STATE.sqvItems.forEach(it=>{
    const k = invClsNorm(it.cls) || 'NONE';
    m[k].value += it.value; m[k].qty += it.qty; m[k].items.add(it.item);
  });
  const rows = keys.map(k=>({cls:k, label:(k==='NONE'?'Non Class':'Class '+k), value:m[k].value, qty:m[k].qty, itemCount:m[k].items.size}));
  const tv = rows.reduce((a,r)=>a+r.value,0), tq = rows.reduce((a,r)=>a+r.qty,0), ti = rows.reduce((a,r)=>a+r.itemCount,0);
  rows.forEach(r=>{ r.pctValue = tv ? r.value/tv : 0; r.pctQty = tq ? r.qty/tq : 0; r.pctItem = ti ? r.itemCount/ti : 0; });
  return rows.filter(r=>r.cls!=='NONE' || r.itemCount>0); // A–D selalu tampil; Non Class hanya jika ada
}
function queryInventoryByCategory(){
  const map = new Map();
  STATE.sqvItems.forEach(it=>{
    if(!map.has(it.cat)) map.set(it.cat, {cat:it.cat, value:0, qty:0});
    const s = map.get(it.cat); s.value+=it.value; s.qty+=it.qty;
  });
  return [...map.values()].sort((a,b)=>b.value-a.value);
}
// Detail by Category, dipecah per Inventory Class (A/B/C/D) — dipakai di halaman Inventory.
// Item yang kolom Class-nya kosong/tidak dikenali (bukan A/B/C/D) dikelompokkan sebagai "Non Class".
// Tiap kategori: jumlah SKU/Item unik, lalu per class: value, qty, jumlah SKU/Item.
const INV_CLASS_ORDER = ['A','B','C','D'];
const INV_CLASS_DISPLAY = ['A','B','C','D','NONE'];
const INV_CLASS_LABEL = { A:'Class A', B:'Class B', C:'Class C', D:'Class D', NONE:'Non Class' };
function queryInventoryByCategoryClass(){
  const map = new Map();
  STATE.sqvItems.forEach(it=>{
    if(!map.has(it.cat)){
      const byClass = {}; INV_CLASS_DISPLAY.forEach(c=>{ byClass[c] = { value:0, qty:0, skuSet:new Set() }; });
      map.set(it.cat, { cat:it.cat, value:0, qty:0, skuSet:new Set(), byClass });
    }
    const s = map.get(it.cat);
    s.value += it.value; s.qty += it.qty; s.skuSet.add(it.item);
    const clsRaw = String(it.cls||'').trim().toUpperCase();
    const cls = INV_CLASS_ORDER.includes(clsRaw) ? clsRaw : 'NONE';
    const bc = s.byClass[cls]; bc.value += it.value; bc.qty += it.qty; bc.skuSet.add(it.item);
  });
  const rows = [...map.values()].map(s=>({
    cat: s.cat, value: s.value, qty: s.qty, skuCount: s.skuSet.size,
    byClass: INV_CLASS_DISPLAY.reduce((acc,c)=>{ acc[c] = { value:s.byClass[c].value, qty:s.byClass[c].qty, skuCount:s.byClass[c].skuSet.size }; return acc; }, {}),
  })).sort((a,b)=>b.value-a.value);
  return rows;
}
function itemLastSaleMap(){
  const map = new Map();
  STATE.itemFact.forEach(r=>{
    const key = r.y*100+r.m;
    if(!map.has(r.item) || map.get(r.item) < key) map.set(r.item, key);
  });
  return map;
}

// ---- KPI Store ----
// Ach per indikator per bulan:
//  - Sales store   = Total Sales Toko (semua kategori) / Total Budget Toko bulan itu
//  - Sales project = Actual Sales Project / Budget Project bulan itu
//  - Indikator lain (DSL, AWT, Net profit, NEMS, PickUp Money, Salah EDC, Ontime staging, Ontime receiving,
//    Accuracy all) = langsung dari data upload "Source KPI" (bukan dihitung dari data sales)
function kpiStoreAchievement(y, m){
  const salesTokoActual = STATE.salesFact.filter(r=>r.y===y && r.m===m).reduce((a,r)=>a+r.amt,0);
  const salesTokoBudget = [...budgetByCatForMonths([m],'budgetStoreFact',y).values()].reduce((a,v)=>a+v,0);
  const achSalesStore = salesTokoBudget>0 ? safeDiv(salesTokoActual, salesTokoBudget) : null;

  const projActual = STATE.sourceFact.filter(r=>r.y===y && r.m===m && r.source==='Sales Project').reduce((a,r)=>a+r.amt,0);
  const projBudget = (STATE.budgetProjectMonthly[m]||0) * dayProrationFactorForMonth(y, m);
  const achSalesProject = projBudget>0 ? safeDiv(projActual, projBudget) : null;

  const pbActual = STATE.salesFact.filter(r=>r.y===y && r.m===m).reduce((a,r)=>a+(r.pbAmt||0),0);
  const pbBudget = [...budgetByCatForMonths([m],'budgetPBFact',y).values()].reduce((a,v)=>a+v,0);
  const achSalesPB = pbBudget>0 ? safeDiv(pbActual, pbBudget) : null;

  const srcRec = (STATE.sourceKpi||[]).find(r=>r.y===y && r.m===m);
  const pick = (k)=> srcRec && srcRec[k]!=null ? srcRec[k] : null;

  return {
    salesStore: achSalesStore, salesProject: achSalesProject, achSalesPB: achSalesPB,
    dsl: pick('dsl'), awt: pick('awt'), netProfit: pick('netProfit'), nems: pick('nems'),
    pickupMoney: pick('pickupMoney'), salahEdc: pick('salahEdc'), respondTime: pick('respondTime'),
    ontimeStaging: pick('ontimeStaging'), ontimeReceiving: pick('ontimeReceiving'), accuracyAll: pick('accuracyAll'),
    // Belum ada sumber data otomatis di dashboard ini untuk indikator berikut — akan tampil "-":
    salesZona: null, salesCategory: null, achSalesPerson: null, salesRegional: null,
  };
}
// Nilai (score) = (Ach / Budget) x Bobot — TIDAK dibatasi (overachieve menambah nilai proporsional).
// Contoh: Ach 110%, Budget 100%, Bobot 60% -> Nilai = (110%/100%) x 60% = 66%.
function kpiScore(ach, budget, bobot){
  if(ach===null || ach===undefined || !budget) return null;
  return safeDiv(ach, budget) * bobot;
}
function kpiStoreMonthlyRows(y, monthsList, roleKey){
  const items = (STATE.kpiMatrix && STATE.kpiMatrix[roleKey]) || [];
  return monthsList.map(m=>{
    const ach = kpiStoreAchievement(y, m);
    const byKpi = {};
    items.forEach((c,idx)=>{
      const a = ach[c.key];
      byKpi[idx] = { ach: a, nilai: kpiScore(a, c.budget, c.bobot) };
    });
    const totalNilai = items.reduce((s,c,idx)=> s + (byKpi[idx].nilai||0), 0);
    const hasAnyData = items.some((c,idx)=>byKpi[idx].ach!==null);
    return { m, name: MONTH_NAMES[m-1], byKpi, totalNilai, hasAnyData };
  });
}

// TREND PERFORMANCE BY ZONA — modul generik (Overview, YTD, MTD, Daily, Master Brand, Sales Person, Source Type)
// Series = Zona (Source Type: per Source Type). Metrik: Sales (Rp), Growth vs LY, Achievement (jika ada budget).

function dayInfo(y,m,d){
  const dow = new Date(y, m-1, d).getDay(), k = y+'-'+m+'-'+d;
  const holiday = ID_HOLIDAYS[k] || null, cuti = ID_CUTI_BERSAMA[k] || null;
  return {dow, holiday, cuti, weekend:(dow===0||dow===6), red:(dow===0||dow===6||!!holiday||(DAY_RED_CUTI_BERSAMA&&!!cuti))};
}
// Label sumbu X: tanggal di atas, nama hari di bawahnya (array = dua baris di Chart.js)
function dateLabel(y,m,d){ return [String(d), DAY_NAMES_SHORT[new Date(y, m-1, d).getDay()]]; }
// keyAt(indexTick) → nomor tanggal. Weekend/libur: merah + tebal (tidak hanya mengandalkan warna).
function dateTicks(y,m,keyAt){
  const isRed = ctx => { const i = ctx.tick ? ctx.tick.value : ctx.index; const d = keyAt(i); return !!(d && dayInfo(y,m,d).red); };
  return { maxRotation:0, autoSkip:true, autoSkipPadding:2,
    color: ctx => isRed(ctx) ? DAY_RED_COLOR : (Chart.defaults.color || '#666'),
    font: ctx => ({size:10, weight: isRed(ctx) ? '700' : '400'}) };
}
function dateTitleFn(y,m,keyAt){
  return items => { const d = keyAt(items[0].dataIndex); if(!d) return ''; const i = dayInfo(y,m,d);
    return DAY_NAMES_LONG[i.dow]+', '+d+' '+MONTH_NAMES[m-1]+' '+y + (i.holiday ? ' · '+i.holiday : (i.cuti ? ' · Cuti bersama: '+i.cuti : '')); };
}

const TRK_PALETTE = ['#2B4C5C','#D9720B','#7A8B4E','#8A5A8C','#C0392B','#16A085','#7F8C8D','#B8803F','#3B7DD8','#D4A017','#8E5B3A','#5D6D7E'];
const TRK_FIXED_COLOR = Object.assign({}, ZONA_COLOR, {'Kasir':'#C0392B','Project':'#16A085','SM / DSM':'#7F8C8D','Belum Terdaftar':'#BDB7A8'});
function trkColor(name,i){ return TRK_FIXED_COLOR[name] || TRK_PALETTE[i % TRK_PALETTE.length]; }
const TRK_TITLES = {month:'Trend by Bulan', quarter:'Trend by Quartal', semester:'Trend by Semester', date:'Trend by Tanggal', week:'Trend by Week', hour:'Trend by Jam'};
const TRK_ZONA_ORDER = ['Zona 1','Zona 2','Zona 3','Zona 4','Zona Lainnya'];
function trkBucket(mode, r){
  switch(mode){
    case 'month': return r.m; case 'quarter': return Math.ceil(r.m/3); case 'semester': return Math.ceil(r.m/6);
    case 'date': return r.d; case 'week': return r.d===undefined ? undefined : Math.ceil(r.d/7); case 'hour': return r.h;
  }
}
function trkLabel(cfg, mode, k){
  if(mode==='month') return MONTH_NAMES[k-1];
  if(mode==='quarter' || mode==='semester'){
    const size = mode==='quarter'?3:6, pre = mode==='quarter'?'Q':'S';
    const ms = cfg.months.filter(m=>Math.ceil(m/size)===k);
    if(ms.length===size || !ms.length) return pre+k;
    const a = Math.min(...ms), b = Math.max(...ms);
    return pre+k+' ('+MONTH_NAMES[a-1]+(b>a?'–'+MONTH_NAMES[b-1]:'')+')';
  }
  if(mode==='date') return (cfg.months && cfg.months.length) ? dateLabel(cfg.curYear, cfg.months[0], k) : String(k);
  if(mode==='week'){ const dim = daysInMonth(cfg.curYear, cfg.months[0]); return 'W'+k+' ('+((k-1)*7+1)+'–'+Math.min(k*7,dim)+')'; }
  return String(k).padStart(2,'0')+':00';
}
function trkCompute(cfg, mode){
  const B = new Map();
  const cell = (k,s)=>{ let b=B.get(k); if(!b){ b=new Map(); B.set(k,b); } let c=b.get(s); if(!c){ c={ty:0,ly:0,bud:0,nTy:0,hasBud:false}; b.set(s,c); } return c; };
  const accept = cfg.accept || ((r)=>{
    if(!cfg.months.includes(r.m)) return false;
    if(r.d!==undefined){
      if(r.d > effectiveCutoffDay(cfg.curYear, r.m)) return false;
      if(cfg.dayFrom && (r.d<cfg.dayFrom || r.d>cfg.dayTo)) return false;
    }
    return true;
  });
  const need = mode==='hour' ? 'h' : ((mode==='date'||mode==='week') ? 'd' : null);
  let missingDim = 0;
  const feed = (rows, isLY)=> rows.forEach(r=>{
    if(!accept(r,isLY)) return;
    if(need && r[need]===undefined){ missingDim++; return; }
    const k = trkBucket(mode,r); if(k===undefined || k===null || isNaN(k)) return;
    const c = cell(k, r.s);
    if(isLY) c.ly += r.amt; else { c.ty += r.amt; c.nTy++; }
  });
  feed(cfg.rows(cfg.curYear, mode), false);
  feed(cfg.rows(cfg.lyYear, mode), true);
  if(cfg.budget) cfg.budget(cfg.curYear).forEach(r=>{
    if(!accept(r,false) || (need && r[need]===undefined)) return;
    const k = trkBucket(mode,r); if(k===undefined) return;
    const c = cell(k, r.s); c.bud += r.value; c.hasBud = true;
  });
  const keys = [...B.keys()].sort((a,b)=>a-b);
  const present = new Set(); keys.forEach(k=>B.get(k).forEach((c,s)=>present.add(s)));
  const order = (cfg.series||[]).filter(s=>present.has(s)).concat([...present].filter(s=>!(cfg.series||[]).includes(s)).sort());
  const series = order.map((s,i)=>({name:s, color:trkColor(s,i), cells:keys.map(k=>B.get(k).get(s)||null)}));
  const total = keys.map(k=>{ const t={ty:0,ly:0,bud:0,nTy:0,hasBud:false}; B.get(k).forEach(c=>{ t.ty+=c.ty; t.ly+=c.ly; t.bud+=c.bud; t.nTy+=c.nTy; t.hasBud = t.hasBud||c.hasBud; }); return t; });
  return {keys, labels:keys.map(k=>trkLabel(cfg,mode,k)), series, total, missingDim, hasBud:total.some(t=>t.hasBud)};
}
function trkVal(c, metric){
  if(!c || !c.nTy) return null;
  if(metric==='growth') return c.ly>0 ? (c.ty-c.ly)/c.ly : null;
  if(metric==='ach') return (c.hasBud && c.bud>0) ? c.ty/c.bud : null;
  return c.ty;
}
function trkMountHost(root, id, atTop){
  const old = root.querySelector('#'+id); if(old) old.remove();
  const div = document.createElement('div'); div.id = id;
  const anchor = atTop ? root.firstChild : root.querySelector('.grid-2');
  if(anchor) root.insertBefore(div, anchor); else root.appendChild(div);
  return div;
}
function trkRender(host, cfg){
  if(!host) return;
  let metric = 'sales';
  const data = {}; cfg.modes.forEach(m=>{ data[m] = trkCompute(cfg,m); });
  const mets = [['sales','Sales (Rp)']].concat(cfg.modes.some(m=>data[m].hasBud) ? [['ach','Achievement']] : [], [['growth','Growth vs LY']]);
  const panel = (mode)=>{
    const d = data[mode]; const empty = !d.keys.length;
    const hint = empty ? (d.missingDim ? (cfg.noDayHint||cfg.emptyHint) : (cfg.emptyHint||'Belum ada data pada periode ini.')) : '';
    return `<div class="panel"><div class="panel-head"><div class="panel-title">${TRK_TITLES[mode]}</div></div>${empty
      ? `<div class="footnote-box">${hint}</div>`
      : `<div class="chart-wrap"><canvas id="${cfg.id}-${mode}" height="${(mode==='quarter'||mode==='semester')?200:110}"></canvas></div>`}</div>`;
  };
  const layout = cfg.modes.length===3 ? panel(cfg.modes[0])+`<div class="grid-2b">${panel(cfg.modes[1])}${panel(cfg.modes[2])}</div>` : cfg.modes.map(panel).join('');
  host.innerHTML = `<div class="panel" style="padding-bottom:12px;"><div class="panel-head" style="margin-bottom:8px;"><div class="panel-title">${cfg.title}</div><div class="panel-note">${cfg.note}</div></div>
    <div class="mode-toggle" id="${cfg.id}-metric">${mets.map(([k,l])=>`<button data-k="${k}" class="${k===metric?'active':''}">${l}</button>`).join('')}</div></div>${layout}`;
  function draw(){
    cfg.modes.forEach(mode=>{
      const d = data[mode]; if(!d.keys.length) return;
      const pct = metric!=='sales'; const fmt = v=> v==null ? '-' : (pct ? fmtPct(v) : fmtRp(v));
      const many = d.keys.length>14;
      const isDate = mode==='date' && cfg.months && cfg.months.length, dKey = i=>d.keys[i];
      const ds = d.series.map(s=>({label:s.name, data:s.cells.map(c=>trkVal(c,metric)), borderColor:s.color, backgroundColor:s.color, borderWidth:2, pointRadius:many?1.5:3, tension:0.25, spanGaps:true}));
      if(pct) ds.push({label:'Total', data:d.total.map(c=>trkVal(c,metric)), borderColor:'#1F2A2E', backgroundColor:'#1F2A2E', borderDash:[6,4], borderWidth:2.5, pointRadius:many?1.5:3, tension:0.25, spanGaps:true});
      mkChart(cfg.id+'-'+mode, { type:'line', data:{labels:d.labels, datasets:ds},
        options:{ responsive:true, interaction:{mode:'index', intersect:false},
          plugins:{ legend:{position:'bottom', labels:{boxWidth:10, font:{size:11}}},
            tooltip:{ callbacks:Object.assign(isDate?{title:dateTitleFn(cfg.curYear, cfg.months[0], dKey)}:{}, { label:c=>c.dataset.label+': '+fmt(c.parsed.y),
              afterLabel:c=>{ if(pct) return ''; const s = d.series[c.datasetIndex]; const cl = s && s.cells[c.dataIndex]; return cl && cl.ly ? 'LY: '+fmtRp(cl.ly)+' · Growth '+fmtPct((cl.ty-cl.ly)/cl.ly) : ''; } }) } },
          scales:{ y:{grid:{color:'#EEEAE0'}, beginAtZero:!pct, ticks:{callback:v=>pct?fmtPct(v,0):fmtRp(v)}}, x:{grid:{display:false}, ticks:(isDate ? dateTicks(cfg.curYear, cfg.months[0], dKey) : {font:{size:10}, maxRotation:0, autoSkip:true})} } } });
    });
  }
  host.querySelectorAll('#'+cfg.id+'-metric button').forEach(b=>b.addEventListener('click', ()=>{
    metric = b.dataset.k; host.querySelectorAll('#'+cfg.id+'-metric button').forEach(x=>x.classList.toggle('active', x===b)); draw();
  }));
  draw();
}
// ---- penyedia data: salesFact (harian, per kategori → Zona) + budget harian/bulanan per kategori → Zona ----
function trkSalesRows(year){ return STATE.salesFact.filter(r=>r.y===year).map(r=>({m:r.m, d:r.d, s:catToZona(r.cat, r.m), amt:r.amt})); }
function trkSalesBudget(year){
  const out = []; const hasDaily = new Set((STATE.budgetDailyFact||[]).map(r=>r.m));
  (STATE.budgetDailyFact||[]).forEach(r=>out.push({m:r.m, d:r.d, s:catToZona(r.cat, r.m), value:r.value}));
  (STATE.budgetStoreFact||[]).forEach(r=>{ if(hasDaily.has(r.m)) return; const dim = daysInMonth(year, r.m); for(let d=1; d<=dim; d++) out.push({m:r.m, d, s:catToZona(r.cat, r.m), value:r.value/dim}); });
  return out;
}
const TRK_NOTE_ZONA = 'Series = Zona. TY vs LY apple-to-apple s/d tanggal berjalan. Achievement memakai budget toko per Zona (budget bulanan dibagi rata per hari bila budget harian tidak ada).';
function trkZonaCfg(id, title, curYear, months, modes, extra){
  return Object.assign({id, title, note:TRK_NOTE_ZONA, modes, curYear, lyYear:curYear-1, months, series:TRK_ZONA_ORDER,
    rows:trkSalesRows, budget:trkSalesBudget}, extra||{});
}

        <li><b>Zona</b> = pengelompokan Kategori: Zona 1 (Flooring & Wall), Zona 2 (Bathroom, Plumbing), Zona 3 (Appliances, Doors & Windows, Electrical, Hardware, Houseware & Hobbies, Kitchen, Tools, Miscellaneous), Zona 4 (Building Material [Jan–Sep; pindah ke Zona 1 mulai Okt–Des], Paint & Sundries). Di luar itu → "Zona Lainnya".</li>
        <li><b>Sales Private Brand + Exclusive Brand</b> = Master Type Brand "Private Brand" + "Exclusive Brand".</li>
        <li><b>Sales</b> di seluruh dashboard, termasuk <b>Ticket Size / Basket Size</b>, dihitung dari <b>Amount Exclude Tax</b>, konsisten dengan basis penyusunan Budget. Nilai per nota pada Ticket Size mencakup seluruh nota (termasuk nota return, yang bernilai negatif), sehingga Total Nilai dan Basket Size sudah bersifat net (setelah return).</li>
        <li>Achievement <b>Master Brand</b>: budget = rata-rata sales bulanan brand tsb tahun lalu; kalau brand belum ada tahun lalu → pakai sales bulanan tertinggi tahun ini sebagai proxy.</li>
        <li>Achievement <b>Source Type</b> Stationary/WhatsApp adalah estimasi (sisa budget toko setelah budget Sales Project riil dikurangkan, dialokasikan proporsional).</li>
        <li><b>Stock DC</b> bersifat company-wide (bukan spesifik Toko Yogyakarta).</li>
      </ul>
    </div>
  `;

  destroyCharts('overview');
  const monthlyTrend = years.map(y=>{
    return availableMonths(y).map(m=>{
      const rows = STATE.salesFact.filter(r=>r.y===y&&r.m===m);
      return rows.reduce((a,r)=>a+r.amt,0);
    });
  });
  const maxMonths = Math.max(...years.map(y=>availableMonths(y).length), 12);
  mkChart('chart-overview-trend', {
    type:'line',
    data:{ labels: MONTH_NAMES.slice(0,maxMonths), datasets: years.map((y,i)=>({
      label:String(y), data: monthlyTrend[i],
      borderColor: i===years.length-1?'#D9720B':'#A6A198',
      backgroundColor: i===years.length-1?'rgba(217,114,11,0.12)':'rgba(166,161,152,0.1)',
      borderWidth: i===years.length-1?3:2, tension:0.3, fill:true,
    })) },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}},
      tooltip:{callbacks:{label:(ctx)=>ctx.dataset.label+': '+fmtRp(ctx.parsed.y)}}},
      scales:{ y:{grid:{color:'#EEEAE0'}, ticks:{callback:v=>fmtRp(v,{noPrefix:true})}}, x:{grid:{display:false}} } }
  });
  const zonas = ytd.zonaSummary.map(z=>z.zona);
  mkChart('chart-overview-zona', {
    type:'doughnut',
    data:{ labels: zonas, datasets:[{ data: ytd.zonaSummary.map(z=>z.sales), backgroundColor: zonas.map(z=>ZONA_COLOR[z]||'#999'), borderWidth:2, borderColor:'#fff' }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}},
      tooltip:{callbacks:{label:(ctx)=> ctx.label+': '+fmtRp(ctx.parsed)}}}, cutout:'62%' }
  });
};

function statusText(id){
  if(id==='member'){ const n = (STATE.memberDb||[]).length, t = custTx().length, m = STATE.dataMeta && STATE.dataMeta.member;
    return (n ? '<span class="upload-status ok">&#10003; '+fmtNum(n)+' member '+(STATE.uploadStatus.member==='uploaded'?'ter-upload':'(bawaan dashboard, sudah terpasang — upload hanya bila ada pembaruan)')+'</span>' : '<span class="upload-status empty">Belum ada database member — menu Data Customer akan kosong</span>')
      + `<div style="font-size:12px;color:var(--ink-soft);margin-top:3px;">Transaksi ber-member dari CSV sales: ${t?fmtNum(t)+' baris':'belum ada'}${m&&m.file?' · '+m.file:''}</div>`; }
  const s0 = STATE.uploadStatus[id]; let base;
  if(s0==='uploaded') base = '<span class="upload-status ok">&#10003; Data ter-upload</span>';
  else if(s0==='empty') base = '<span class="upload-status empty">Kosong — modul terkait akan tampil 0</span>';
  else base = '<span class="upload-status ok">&#10003; Menggunakan data default (sudah tersedia)</span>';
  const key = {sales:'sales', sqv:'sqv', stockDC:'dc', traffic:'traffic', salper:'salper'}[id], m = key && STATE.dataMeta && STATE.dataMeta[key];
  if(m){ const t = id==='sales' ? 'data s/d '+fDate(m.to) : id==='sqv' ? 'stok per '+fDate(m.stockDate) : id==='stockDC' ? 'laporan '+fDate(m.reportDate) : id==='salper' ? fmtNum(m.rows||0)+' salesperson · '+fmtNum(m.tlRows||0)+' ter-mapping TL' : 'data TIEBS';
    base += `<div style="font-size:12px;color:var(--ink-soft);margin-top:3px;">Last update: ${t} · diupload ${fDate(m.uploadedAt)}${m.file?' · '+m.file:''}</div>`; }
  return base;
}
function rendered_reset(){
  // force re-render of all visited sections next time they're shown
  document.querySelectorAll('.section').forEach(s=>{ if(s.id!=='sec-upload') s.remove(); });
  if(typeof updateSidebarFoot === 'function') updateSidebarFoot();
  if(currentSection && currentSection!=='upload') showSection(currentSection);
  // persist the updated dataset in the background so it's still here next time the app opens
  const statusEl = document.getElementById('upload-persist-status');
  if(statusEl) statusEl.textContent = 'Menyimpan...';
  if(typeof persistState === 'function'){
    persistState().then((info)=>{
      if(statusEl) statusEl.textContent = `Tersimpan (${info.chunks} bagian, ${(info.bytes/1024/1024).toFixed(1)} MB) — data ini akan otomatis dipakai lain kali dashboard dibuka.`;
    }).catch((err)=>{
      if(err && err.message==='NO_STORAGE'){ if(statusEl) statusEl.innerHTML = 'Data upload berlaku selama halaman ini terbuka. Penyimpanan otomatis tidak tersedia di mode file — gunakan <b>Backup</b> di bawah agar data bisa dipulihkan.'; return; }
      console.error('Gagal menyimpan data:', err);
      if(statusEl) statusEl.innerHTML = `<span style="color:var(--bad)">Gagal menyimpan data (${err.message||err}). Data tetap tampil di sesi ini, tapi belum terkunci untuk sesi berikutnya — coba lagi.</span>`;
    });
  }
}
// ============================================================
// SUMMARY STRIP — 13-metric scorecard used by Overview, YTD, MTD, Daily
// Order: Budget, Sales, Achievement, Diff(Sales-Budget), Sales LY, Growth, Diff(Sales-SalesLY),
//        Budget PB, Sales PB+EB, Ach PB+EB, Sales PB+EB LY, Growth PB+EB, Inventory
// ============================================================
function fmtRpSigned(n, opts){
  const s = (n>=0?'+':'') + fmtRp(n, opts||{});
  return n<0 ? `<span style="color:var(--bad)">${s}</span>` : s;
}
function fmtPctSigned(n, digits=1){
  const s = fmtPct(n, digits);
  return (n<0) ? `<span style="color:var(--bad)">${s}</span>` : s;
}
function renderSummaryStrip(t){
  const diffBudget = t.sales - t.budgetToko;
  const diffLY = t.sales - t.salesLY;
  const cell = (label, value, extraClass) => `
    <div class="kpi-card"><div class="kpi-label">${label}</div><div class="kpi-value ${extraClass||''}">${value}</div></div>`;
  const statCard = (label, valueHtml, ach, gLY, gLM, tip) => {
    const fm = (v, signed) => (v===null||v===undefined||!isFinite(v)) ? '-' : ((signed && v>0) ? '+' : '') + fmtPct(v);
    const col = (v, isAch) => (v===null||v===undefined||!isFinite(v)) ? 'color:var(--ink-soft)' : (isAch ? (v>=1?'color:var(--good)':(v>=0.9?'color:#8A5A00':'color:var(--bad)')) : (v>=0?'color:var(--good)':'color:var(--bad)'));
    return `<div class="kpi-card" title="${tip}"><div class="kpi-label">${label}</div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;"><div class="kpi-value">${valueHtml}</div>
        <div style="font-size:11px;line-height:1.55;white-space:nowrap;font-weight:600;"><div style="${col(ach,true)}">Ach ${fm(ach)}</div><div style="${col(gLY)}">Grw LY ${fm(gLY,true)}</div><div style="${col(gLM)}">Grw LM ${fm(gLM,true)}</div></div></div></div>`; };
  const tipCell = (label, valueHtml, tip) => `
    <div class="kpi-card" title="${tip}"><div class="kpi-label">${label}</div><div class="kpi-value">${valueHtml}</div></div>`;
  const ipCell = (label, hint, v, vLY, g, dec, basis) => `
    <div class="kpi-card" title="${hint} · LY: ${fmtDec(vLY,dec)}${(g===null||g===undefined)?'':' · Growth: '+fmtPct(g)} · ${basis}"><div class="kpi-label">${label}</div><div class="kpi-value">${fmtDec(v,dec)}</div></div>`;
  return `
    <div class="kpi-row">
      ${cell('Budget', fmtRp(t.budgetToko))}
      ${cell('Sales TY', fmtRp(t.sales))}
      ${cell('Sales LY', fmtRp(t.salesLY))}
      ${cell('Achievement', fmtPctSigned(t.achievement))}
      ${cell('Growth', fmtPctSigned(t.growth))}
      ${cell('Diff Budget', fmtRpSigned(diffBudget))}
      ${cell('Diff Growth', fmtRpSigned(diffLY))}
      ${statCard('Traffic', fmtNum(t.traffic||0), t.trafficAch, t.trafficGrowthLY, t.trafficGrowthLM, 'Jumlah pengunjung (Actual Traffic dari TIEBS). Budget: '+(t.budTraffic!=null?fmtNum(t.budTraffic):'-')+' · LY: '+fmtNum(t.trafficLY||0)+' · LM: '+fmtNum(t.trafficLM||0))}
      ${statCard('Invoice', fmtNum(t.storeInvoice||0), t.invAch, t.invGrowthLY, t.invGrowthLM, 'Jumlah nota unik (termasuk retur). Budget: '+(t.budInvoice!=null?fmtNum(t.budInvoice):'-')+' · LY: '+fmtNum(t.storeInvoiceLY||0)+' · LM: '+fmtNum(t.storeInvoiceLM||0))}
      ${statCard('Efektivitas Traffic', t.eff!=null?fmtPct(t.eff):'-', t.effAch, t.effGrowthLY, t.effGrowthLM, 'Invoice ÷ Traffic ('+fmtNum(t.traffic||0)+' pengunjung). Budget: '+(t.budEff!=null?fmtPct(t.budEff):'-')+' · LY: '+(t.effLY!=null?fmtPct(t.effLY):'-')+' · LM: '+(t.effLM!=null?fmtPct(t.effLM):'-'))}
      ${statCard('Basket Size (Avg Transaksi)', t.basket!=null?fmtRp(t.basket):'-', t.basketAch, t.basketGrowthLY, t.basketGrowthLM, 'Sales ÷ Invoice. Budget: '+(t.budBasket!=null?fmtRp(t.budBasket):'-')+' · LY: '+(t.basketLY!=null?fmtRp(t.basketLY):'-')+' · LM: '+(t.basketLM!=null?fmtRp(t.basketLM):'-'))}
      ${ipCell('IPD · Invoice per Day', 'Invoice per Day = Σ invoice tiap salesperson ÷ Σ hari aktif salesperson (rata-rata per salesperson per hari). Referensi level toko: '+fmtDec(t.storeIpd,1)+' invoice/hari', t.ipd, t.ipdLY, t.ipdGrowth, 1, fmtNum(t.invoice||0)+' invoice / '+fmtNum(t.invDays||0)+' hari-sales ('+fmtNum(t.salesActive||0)+' salesperson aktif)')}
      ${ipCell('IPI · Item per Invoice', 'Item per Invoice = Σ item (SKU berbeda) di invoice tiap salesperson ÷ Σ invoice', t.ipi, t.ipiLY, t.ipiGrowth, 2, fmtNum(t.itemCount||0)+' item / '+fmtNum(t.invoice||0)+' invoice')}
      ${cell('Budget PB', fmtRp(t.budgetPB))}
      ${cell('Sales PB+EB TY', fmtRp(t.pbSales))}
      ${cell('Sales PB+EB LY', fmtRp(t.pbSalesLY))}
      ${tipCell('Ach. &amp; Cont. PB+EB', fmtPctSigned(t.pbAchievement)+' <span style="font-weight:400;opacity:.55;">/</span> '+((t.sales>0 && t.pbSales!=null) ? fmtPct(t.pbSales/t.sales) : '-'), 'Ach. = Sales PB+EB ÷ Budget PB. Cont. (Kontribusi) = Sales PB+EB ÷ total Sales toko. Kontribusi LY: '+((t.salesLY>0 && t.pbSalesLY!=null) ? fmtPct(t.pbSalesLY/t.salesLY) : '-'))}
      ${cell('Growth PB+EB', fmtPctSigned(t.pbGrowth))}
      ${cell('Sales Protection Qty', fmtNum(t.protectionQty!==undefined?t.protectionQty:0))}
      ${cell('Sales Protection Value (Excl. Tax)', fmtRp(t.protectionAmt!==undefined?t.protectionAmt:0))}
      ${cell('Inventory', fmtRp(t.invValue!==undefined?t.invValue:0))}
    </div>`;
}

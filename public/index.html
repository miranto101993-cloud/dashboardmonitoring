<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#17262E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PERFORMANCE DASHBOARD — Mitra10 Yogyakarta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" async></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js" async></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" async></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" async></script>
<style>
:root{
  --bg: #F4F2ED;
  --panel: #FFFFFF;
  --ink: #1C2321;
  --ink-soft: #5B645F;
  --line: #E1DDD3;
  --steel: #2B4C5C;
  --steel-deep: #17262E;
  --amber: #D9720B;
  --amber-soft: #FBEBD8;
  --good: #2F7A4F;
  --good-bg: #E5F3EA;
  --bad: #B23A2E;
  --bad-bg: #FBEAE7;
  --zona1: #2B4C5C;
  --zona2: #D9720B;
  --zona3: #7A8B4E;
  --zona4: #8A5A8C;
  --zonaX: #A6A198;
  --radius: 10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--bg);
  color: var(--ink);
  font-family: 'IBM Plex Sans', -apple-system, sans-serif;
  font-size: 14px;
  line-height:1.45;
}
h1,h2,h3,h4{
  font-family:'Archivo Expanded', sans-serif;
  margin:0;
  letter-spacing: -0.01em;
}
.app{ display:flex; min-height:100vh; }

/* ---- Sidebar ---- */
.sidebar{
  width: 234px;
  flex-shrink:0;
  background: var(--steel-deep);
  color: #E9EDE9;
  display:flex;
  flex-direction:column;
  padding: 22px 14px;
  position: sticky;
  top:0;
  height:100vh;
}
.brand{
  display:flex; align-items:center; gap:10px;
  padding: 4px 8px 22px 8px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 16px;
}
.brand-mark{
  width:54px;height:54px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  overflow:hidden;
}
.brand-mark img{ width:100%; height:100%; object-fit:cover; display:block; }
.brand-name{ font-family:'Archivo Expanded'; font-weight:700; font-size:16px; color:#fff;}
.brand-sub{ font-size:11px; color:#98A69E; margin-top:1px;}
.brand-byline{ font-size:10.5px; color:#7E8C84; font-style:italic; margin-top:2px;}
.nav{ flex:1; display:flex; flex-direction:column; gap:2px; overflow-y:auto;}
.nav-group-label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em;
  color:#6E7C74; margin: 14px 10px 6px 10px; font-weight:600;
}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding: 9px 10px; border-radius: 8px; cursor:pointer;
  color:#C7D1CB; font-size:13.3px; font-weight:500;
  border:none; background:none; text-align:left; width:100%;
  transition: background .12s ease, color .12s ease;
}
.nav-item .dot{ width:6px;height:6px;border-radius:50%; background:#576159; flex-shrink:0; }
.nav-item:hover{ background: rgba(255,255,255,0.06); color:#fff; }
.nav-item.active{ background: var(--amber); color:#241500; font-weight:700; }
.nav-item.active .dot{ background:#241500; }
.sidebar-foot{
  font-size:10.5px; color:#5E6B63; padding: 12px 10px 2px 10px;
  border-top:1px solid rgba(255,255,255,0.08); margin-top:10px;
}

/* ---- Main ---- */
.main{ flex:1; min-width:0; }
.topbar{
  position:sticky; top:0; z-index:5;
  background: rgba(244,242,237,0.92); backdrop-filter: blur(6px);
  border-bottom:1px solid var(--line);
  padding: 16px 28px; display:flex; align-items:center; justify-content:space-between;
}
.topbar h2{ font-size: 20px; }
.topbar .period{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
.topbar-right{ display:flex; gap:10px; align-items:center; }
.badge{
  font-size:11.5px; padding:5px 10px; border-radius:100px; font-weight:600;
  background: var(--amber-soft); color:#8A4A05; border:1px solid #EFCFA1;
}
.content{ padding: 22px 28px 60px 28px; }
.section{ display:none; }
.section.active{ display:block; animation: fadein .25s ease; }
@keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

/* ---- KPI cards ---- */
.kpi-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:20px; }
.kpi-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px;
}
.kpi-label{ font-size:12px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:0.03em; }
.kpi-value{ font-family:'Archivo Expanded'; font-size:22px; font-weight:700; margin-top:6px; font-variant-numeric: tabular-nums;}
.kpi-sub{ font-size:12.5px; margin-top:6px; display:flex; align-items:center; gap:5px; flex-wrap:wrap;}
.pill{ font-size:11.5px; font-weight:700; padding:2px 7px; border-radius:6px; }
.pill.good{ background:var(--good-bg); color:var(--good); }
.pill.bad{ background:var(--bad-bg); color:var(--bad); }
.pill.neutral{ background:#EFEDE6; color:var(--ink-soft); }
.pill.warn{ background:#FFF1D6; color:#8A5A00; }
/* Tabel Overview/YTD/MTD/Daily/TIEBS: muat lebar layar, tanpa scroll (agar screenshot tidak terpotong) */
.tbl-scroll.tbl-fit{ max-height:none; overflow:visible; }
.sp-tier-btn{ font:inherit; font-size:11px; font-weight:600; padding:3px 9px; border:1px solid var(--line); background:#fff; border-radius:999px; cursor:pointer; white-space:nowrap; }
.sp-tier-btn:hover:not(:disabled){ background:#FFF3E0; border-color:var(--amber); }
.sp-tier-btn.active{ background:var(--amber); color:#241500; border-color:var(--amber); }
.sp-tier-btn:disabled{ opacity:.45; cursor:default; }
.tbl-scroll.tbl-fit table{ table-layout:auto; font-size:11.8px; }
.tbl-scroll.tbl-fit thead th{ position:static; white-space:normal; padding:8px 6px; font-size:10.4px; line-height:1.2; vertical-align:bottom; }
.tbl-scroll.tbl-fit td{ padding:7px 6px; }
.tbl-scroll.tbl-fit td.num{ white-space:nowrap; }
.tbl-scroll.tbl-fit .heat-cell{ padding:2px 5px; } .tbl-scroll.tbl-fit .pill{ padding:2px 6px; font-size:10.5px; }
.tbl-scroll.tbl-fit.tbl-dense table{ font-size:10.8px; } .tbl-scroll.tbl-fit.tbl-dense thead th{ font-size:9.8px; padding:7px 4px; } .tbl-scroll.tbl-fit.tbl-dense td{ padding:6px 4px; }
body.fullwidth .sidebar{ display:none; } body.fullwidth .content{ padding:18px 18px 40px 18px; }
/* Detail Sales Person: lebar muat di panel (tanpa geser kanan-kiri), scroll ke bawah tetap ada; kolom teks diringkas agar angka lega */
.tbl-scroll.sp-fit{ max-height:72vh; overflow:auto; }
.sp-table{ table-layout:fixed; width:100%; min-width:1040px; font-size:11.8px; }
.sp-table th, .sp-table td{ padding:9px 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sp-table thead th{ white-space:normal; font-size:10.4px; line-height:1.2; vertical-align:bottom; position:sticky; top:0; z-index:2; background:var(--panel,#fff); }
.sp-table th:nth-child(1), .sp-table td:nth-child(1){ width:58px; } .sp-table th:nth-child(2), .sp-table td:nth-child(2){ width:112px; }
.sp-table th:nth-child(3), .sp-table td:nth-child(3){ width:68px; } .sp-table th:nth-child(4), .sp-table td:nth-child(4){ width:64px; }
.sp-table th:nth-child(5), .sp-table td:nth-child(5){ width:84px; } .sp-table th:nth-child(6), .sp-table td:nth-child(6){ width:96px; }
.sp-table .heat-cell{ padding:2px 5px; }
.sp-table thead th, .sp-table th.num{ text-align:center; }
.sp-table td.num, .sp-table td:nth-child(1), .sp-table td:nth-child(3), .sp-table td:nth-child(4){ text-align:center; }
.sp-table td:nth-child(2), .sp-table td:nth-child(5), .sp-table td:nth-child(6){ text-align:left; }
th[data-sort]{ user-select:none; white-space:nowrap; } th[data-sort]:hover{ color:var(--ink); } th[data-arrow]::after{ content:attr(data-arrow); color:var(--brand,#D9720B); }
@media print{ aside, .sidebar, .topbar-right, .btn, .file-input-label, .mode-toggle{ display:none !important; } .main{ margin:0 !important; width:100% !important; } .section{ display:none; } .section.active{ display:block; } .panel, .kpi-card{ break-inside:avoid; } body{ background:#fff; } }

/* ---- Panels ---- */
.panel{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 20px; margin-bottom:18px;
}
.panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
.panel-title{ font-size:14.5px; font-weight:700; }
.panel-note{ font-size:11.5px; color:var(--ink-soft); }
.grid-2{ display:grid; grid-template-columns: 1.3fr 1fr; gap:16px; }
.grid-2b{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
@media (max-width: 980px){ .grid-2, .grid-2b{ grid-template-columns:1fr; } }

/* ---- Filter bar ---- */
.filter-bar{
  background:#FBFAF6; border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:16px; display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end;
}
.filter-group{ display:flex; flex-direction:column; gap:6px; }
.filter-group label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-soft); }
.filter-chips{ display:flex; gap:5px; flex-wrap:wrap; max-width:420px; }
.chip{
  padding:5px 11px; border-radius:100px; border:1px solid var(--line); background:#fff;
  font-size:12px; font-weight:600; cursor:pointer; color:var(--ink-soft); user-select:none;
}
.chip.active{ background:var(--steel-deep); color:#fff; border-color:var(--steel-deep); }
.preset-btns{ display:flex; gap:5px; }
.preset-btns button{
  padding:5px 10px; border-radius:7px; border:1px solid var(--line); background:#fff;
  font-size:11.5px; font-weight:600; cursor:pointer; color:var(--steel);
}
.preset-btns button:hover{ background:var(--amber-soft); }
.preset-btns button.active{ background:var(--steel-deep); color:#fff; border-color:var(--steel-deep); }
select, input[type=date], input[type=number], input[type=text]{
  padding:7px 10px; border:1px solid var(--line); border-radius:8px; font-size:12.5px;
  font-family:inherit; background:#fff; color:var(--ink);
}
.mode-toggle{ display:flex; gap:4px; background:#EFEDE6; padding:3px; border-radius:9px; }
.mode-toggle button{
  padding:6px 13px; border-radius:6px; border:none; background:transparent; cursor:pointer;
  font-size:12px; font-weight:700; color:var(--ink-soft);
}
.mode-toggle button.active{ background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,0.08); }

/* ---- Tables ---- */
table{ width:100%; border-collapse:collapse; font-size:12.8px; }
th{
  text-align:left; padding:8px 10px; font-size:11px; text-transform:uppercase;
  letter-spacing:0.03em; color:var(--ink-soft); border-bottom:2px solid var(--line);
  font-weight:700; white-space:nowrap;
}
td{ padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
tr:last-child td{ border-bottom:none; }
tbody tr:hover{ background: #FAF9F5; }
.num{ text-align:right; font-variant-numeric: tabular-nums; }
.tbl-scroll{ max-height:460px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
.tbl-scroll table{ font-size:12.5px; }
.tbl-scroll thead th{ position:sticky; top:0; background:var(--panel); z-index:1; }

/* Freeze kolom kiri (dipakai di tabel KPI Commercial) supaya kolom Indikator KPI/Budget/Bobot tetap
   terlihat saat tabel digeser ke samping untuk melihat kolom bulan lainnya.
   Header pakai class eksplisit (bukan nth-child) karena baris ke-2 thead (Ach/Nilai) tidak punya 3 sel pertama (rowspan). */
.freeze-cols td:nth-child(1), .freeze-cols th.freeze-col-1{ position:sticky; left:0; min-width:170px; z-index:2; background:var(--panel); }
.freeze-cols td:nth-child(2), .freeze-cols th.freeze-col-2{ position:sticky; left:170px; min-width:84px; z-index:2; background:var(--panel); }
.freeze-cols td:nth-child(3), .freeze-cols th.freeze-col-3{ position:sticky; left:254px; min-width:84px; z-index:2; background:var(--panel); box-shadow: 3px 0 6px -3px rgba(0,0,0,0.15); }
.freeze-cols td:nth-child(1), .freeze-cols td:nth-child(2), .freeze-cols td:nth-child(3){ background:#fff; }
.freeze-cols tbody tr:hover td:nth-child(1), .freeze-cols tbody tr:hover td:nth-child(2), .freeze-cols tbody tr:hover td:nth-child(3){ background:#FAF9F5; }
.freeze-cols th.freeze-col-1, .freeze-cols th.freeze-col-2, .freeze-cols th.freeze-col-3{ z-index:3; }

.zona-tag{ display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:12px; }
.zona-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }

.heat-cell{ border-radius:6px; padding:6px 8px; font-weight:700; text-align:center; font-size:12.5px; display:inline-block; min-width:56px;}

.search-box{
  padding:7px 12px; border:1px solid var(--line); border-radius:8px; font-size:12.5px;
  font-family:inherit; width:230px; background:#fff;
}

.chart-wrap{ position:relative; }
canvas{ max-width:100%; }

.leaderboard{ display:flex; flex-direction:column; gap:8px; }
.lb-row{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; background:#FAF9F5; }
.lb-rank{ width:24px; height:24px; border-radius:6px; background:var(--steel-deep); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0;}
.lb-rank.top1{ background:var(--amber); color:#241500; }
.lb-name{ font-weight:600; font-size:13px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.lb-val{ font-weight:700; font-size:13px; font-variant-numeric: tabular-nums; }
.lb-growth{ font-size:11px; font-weight:700; width:56px; text-align:right; }

.footnote-box{
  background:#FBF8F1; border:1px dashed #D8CFB8; border-radius:10px; padding:14px 16px;
  font-size:12px; color:#6B5F45; margin-top: 6px;
}
.footnote-box b{ color:#4A3F28; }
.footnote-box ul{ margin:6px 0 0 18px; padding:0; }
.footnote-box li{ margin-bottom:3px; }

.info-dot{
  display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px;
  border-radius:50%; background:#E7E3D8; color:#7A7360; font-size:10px; font-weight:700; cursor:help;
}
.btn{
  padding:7px 14px; border-radius:8px; border:1px solid var(--steel-deep); background:var(--steel-deep);
  color:#fff; font-size:12.5px; font-weight:700; cursor:pointer;
}
#export-data-btn{ background:var(--amber); border-color:var(--amber); color:#241500; }
#export-data-btn:hover{ background:#C36509; }
.btn.secondary{ background:#fff; color:var(--steel-deep); }
.btn.small{ padding:4px 10px; font-size:11.5px; }
.load-more-wrap{ text-align:center; padding:12px; }

/* ---- Upload page ---- */
.upload-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 20px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.upload-card-info{ flex:1; min-width:220px; }
.upload-card-title{ font-weight:700; font-size:14px; margin-bottom:3px; }
.upload-card-desc{ font-size:12px; color:var(--ink-soft); }
.upload-status{ font-size:12px; font-weight:600; margin-top:6px; display:flex; align-items:center; gap:6px; }
.upload-status.ok{ color:var(--good); }
.upload-status.empty{ color:var(--ink-soft); }
.upload-actions{ display:flex; gap:8px; align-items:center; }
.file-input-label{
  padding:8px 14px; border-radius:8px; border:1px solid var(--steel); background:#fff; color:var(--steel);
  font-size:12.5px; font-weight:700; cursor:pointer; display:inline-block;
}
.file-input-label input{ display:none; }

/* ---- Budget manual entry (sales person tab) ---- */
.budget-manual-table input{ width:120px; text-align:right; }


/* Filter / tombol periode ikut "freeze" di bawah topbar saat halaman digulir */
:root{ --tbh:72px; }
.content .filter-bar{ position:sticky; top:var(--tbh); z-index:4; background:#FBFAF6; box-shadow:0 6px 10px -8px rgba(31,42,46,.35); max-height:46vh; overflow:auto; }
.panel .filter-bar{ position:static; box-shadow:none; max-height:none; overflow:visible; }
/* Data Customer */
th[data-sort]{ cursor:pointer; user-select:none; } th[data-sort]:hover{ background:var(--amber-soft,#FBEFD9); }
.cu-tag{ display:inline-block; padding:2px 8px; border-radius:100px; font-size:10.5px; font-weight:700; background:#EFEDE6; color:#5B5A50; }
.cu-tag.bispro{ background:#FBE3C2; color:#8A4A05; } .cu-tag.nodb{ background:#F6DEDA; color:#8C2F25; }
.cu-link{ border:0; background:none; padding:0; font:inherit; color:var(--steel-deep,#2B4C5C); text-decoration:underline; text-decoration-style:dotted; cursor:pointer; text-align:right; }
.cu-link:hover{ color:var(--amber,#D9720B); }
.cu-modal{ display:none; position:fixed; inset:0; z-index:1000; background:rgba(20,28,32,.55); align-items:flex-start; justify-content:center; overflow:auto; padding:4vh 16px; }
.cu-box{ background:#fff; border-radius:12px; width:min(1100px,100%); box-shadow:0 20px 60px rgba(0,0,0,.35); }
.cu-box-head{ display:flex; justify-content:space-between; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); }
.cu-close{ border:1px solid var(--line); background:#fff; border-radius:8px; width:32px; height:32px; font-size:18px; cursor:pointer; }
.cu-grid{ display:grid; grid-template-columns:290px 1fr; min-height:300px; }
.cu-dates{ border-right:1px solid var(--line); max-height:70vh; overflow:auto; padding:10px; }
.cu-date{ display:block; width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 10px; margin-bottom:6px; cursor:pointer; font:inherit; font-size:12.5px; }
.cu-date small{ display:block; color:var(--ink-soft); font-size:11px; margin-top:2px; }
.cu-date.active{ border-color:var(--amber,#D9720B); background:#FFF6E8; }
.cu-detail{ padding:12px 16px; overflow:auto; max-height:70vh; }
@media (max-width:760px){ .cu-grid{ grid-template-columns:1fr; } .cu-dates{ border-right:0; border-bottom:1px solid var(--line); max-height:220px; } }

/* ===== Tampilan mobile (<= 820px): menu geser, filter ringkas, KPI 2 kolom, tabel bisa digeser ===== */
.hamburger{ display:none; align-items:center; justify-content:center; width:40px; height:40px; flex-shrink:0; border:1px solid var(--line); background:#fff; border-radius:10px; font-size:20px; line-height:1; cursor:pointer; color:var(--ink); }
.nav-backdrop{ display:none; }
.fb-toggle{ display:none; }
@media (max-width:820px){
  html,body{ overflow-x:hidden; -webkit-text-size-adjust:100%; }
  body{ font-size:13.5px; }
  .app{ display:block; }
  .sidebar{ position:fixed; left:0; top:0; bottom:0; height:auto; width:min(84vw,310px); z-index:80; transform:translateX(-104%); transition:transform .22s ease; overflow-y:auto; padding:16px 12px calc(16px + env(safe-area-inset-bottom)) 12px; }
  body.nav-open .sidebar{ transform:none; box-shadow:0 0 40px rgba(0,0,0,.45); }
  body.nav-open{ overflow:hidden; }
  .nav-backdrop{ position:fixed; inset:0; z-index:70; background:rgba(10,18,22,.55); }
  body.nav-open .nav-backdrop{ display:block; }
  .nav-item{ padding:12px 10px; font-size:14px; }
  .sidebar .topbar-right{ display:flex; flex-wrap:wrap; gap:8px; margin:12px 4px 4px; padding-top:12px; border-top:1px solid rgba(255,255,255,.12); }
  .sidebar .topbar-right .badge, .sidebar .topbar-right #btn-full{ display:none; }
  .sidebar .topbar-right select{ flex:1 1 45%; min-width:0; }
  .hamburger{ display:inline-flex; }
  .topbar{ padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top)); gap:10px; justify-content:flex-start; }
  .topbar > div:nth-child(2){ min-width:0; flex:1; }
  .topbar h2{ font-size:16.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar .period{ font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:0; }

<body><script>/* ===== Mode website: login, data dari server, penyimpanan bersama ===== */
(function(){
  var TOKEN_KEY = 'm10_token', ROLE = null, META_VER = '', LAST_META = null, SID = null, BUILD = '';
  window.__REV = '0';
  function tok(){ try{ return localStorage.getItem(TOKEN_KEY) || ''; }catch(e){ return ''; } }
  function setTok(t){ try{ if(t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); }catch(e){} }
  async function api(path, opts){
    opts = opts || {}; var h = Object.assign({}, opts.headers || {}); var t = tok(); if(t) h.Authorization = 'Bearer ' + t;
    var r = await fetch('/api/' + path, Object.assign({cache: /[?&]v=/.test(path) ? 'default' : 'no-store'}, opts, {headers: h}));
    if(r.status === 401 && path !== 'login'){ setTok(''); if(!window.__reloading401){ window.__reloading401 = true; location.reload(); } throw new Error('Sesi berakhir — silakan login ulang.'); }
    return r;
  }
  async function b64(buf){ var s = '', b = new Uint8Array(buf); for(var i=0;i<b.length;i+=0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i+0x8000)); return btoa(s); }
  async function gz(str){ var cs = new Response(new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'))); return b64(await cs.arrayBuffer()); }
  async function gunz(b64s){ var bin = atob(b64s.trim()), by = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) by[i] = bin.charCodeAt(i); return await new Response(new Blob([by]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); }

  // ---------- layar login / minta akses ----------
  var IN = 'width:100%;margin-top:6px;padding:12px;border:1px solid #cfcabb;border-radius:9px;font-size:16px;box-sizing:border-box;';
  var LB = 'display:block;font-size:12px;font-weight:700;color:#444;margin-top:12px;';
  function loginUI(){
    return new Promise(function(resolve){
      var old = document.getElementById('site-login'); if(old) old.remove();
      var d = document.createElement('div'); d.id = 'site-login';
      d.style.cssText = 'position:fixed;inset:0;z-index:100000;background:#17262E;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;font-family:system-ui,-apple-system,sans-serif;';
      var mode = 'login';
      function draw(msg, ok){
        d.innerHTML = '<form style="background:#fff;border-radius:14px;padding:26px 24px;width:100%;max-width:370px;box-shadow:0 20px 60px rgba(0,0,0,.4);">'
          + '<div style="font-weight:800;font-size:17px;color:#17262E;">PERFORMANCE DASHBOARD</div><div style="font-size:12.5px;color:#6b6f6a;margin:2px 0 6px;">Mitra10 Yogyakarta</div>'
          + (mode === 'req' ? '<label style="'+LB+'">Nama lengkap</label><input id="site-name" autocomplete="name" style="'+IN+'">' : '')
          + '<label style="'+LB+'">User</label><input id="site-user-in" autocomplete="username" autocapitalize="none" spellcheck="false" style="'+IN+'">'
          + '<label style="'+LB+'">Password' + (mode === 'req' ? ' (min. 8 karakter)' : '') + '</label><input id="site-pw" type="password" autocomplete="' + (mode === 'req' ? 'new-password' : 'current-password') + '" style="'+IN+'">'
          + '<div id="site-err" style="color:' + (ok ? '#1B7F4B' : '#B23A2E') + ';font-size:12.5px;min-height:18px;margin-top:8px;">' + (msg || '') + '</div>'
          + '<button type="submit" style="width:100%;margin-top:6px;padding:12px;border:0;border-radius:9px;background:#D9720B;color:#241500;font-weight:800;font-size:15px;cursor:pointer;">' + (mode === 'req' ? 'Kirim Permintaan Akses' : 'Masuk') + '</button>'
          + '<button type="button" id="site-toggle" style="width:100%;margin-top:8px;padding:10px;border:0;background:none;color:#555;cursor:pointer;font-size:13px;">' + (mode === 'req' ? '← Sudah punya akun? Masuk' : 'Belum punya akun? Minta akses') + '</button></form>';
        var f = d.querySelector('form'), err = d.querySelector('#site-err');
        setTimeout(function(){ (d.querySelector('#site-name') || d.querySelector('#site-user-in')).focus(); }, 50);
        d.querySelector('#site-toggle').onclick = function(){ mode = mode === 'req' ? 'login' : 'req'; draw(''); };
        f.onsubmit = async function(e){
          e.preventDefault(); err.style.color = '#B23A2E'; err.textContent = ''; var btn = f.querySelector('button[type=submit]'), label = btn.textContent; btn.disabled = true; btn.textContent = 'Memeriksa…';
          var body = {username: d.querySelector('#site-user-in').value, password: d.querySelector('#site-pw').value}; if(mode === 'req') body.name = d.querySelector('#site-name').value;
          try{
            var r = await fetch('/api/' + (mode === 'req' ? 'request-access' : 'login'), {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body)});
            var j = await r.json();
            if(mode === 'req'){ if(j.ok){ mode = 'login'; draw(j.message, true); return; } }
            else if(j.ok){ setTok(j.token); d.remove(); resolve(j); return; }
            err.textContent = j.error || 'Gagal.';
          }catch(ex){ err.textContent = 'Tidak bisa menghubungi server.'; }
          btn.disabled = false; btn.textContent = label;
        };
      }
      draw(''); document.body.appendChild(d);
    });
  }

  // ---------- window.storage → server (kompres gzip, chunk bersifat atomik lewat versi "sid") ----------
  function chunkKey(key){ var m = /chunk:(\d+)$/.exec(key); return m ? m[1] : null; }
  window.storage = {
    async get(key){
      var isMeta = /meta$/.test(key), path;
      if(isMeta) path = 'store/' + encodeURIComponent(key);
      else { var ci = chunkKey(key); path = 'store/' + encodeURIComponent(ci!==null && LAST_META && LAST_META.sid ? 'v' + LAST_META.sid + ':chunk:' + ci : key) + '?v=' + encodeURIComponent(META_VER); }
      var r = await api(path); if(r.status === 404) throw new Error('Not found'); if(!r.ok) throw new Error('HTTP ' + r.status);
      var v = await gunz(await r.text());
      if(isMeta){ try{ LAST_META = JSON.parse(v); META_VER = LAST_META.savedAt || ''; }catch(e){} }
      return {key: key, value: v, shared: false};
    },
    async set(key, value){
      if(ROLE !== 'admin') throw new Error('READ_ONLY');
      var isMeta = /meta$/.test(key), k = key, body;
      if(isMeta){
        var info = JSON.parse(value); info.sid = SID || info.sid; var prev = LAST_META; value = JSON.stringify(info);
        body = await gz(value);
        var r = await api('store/' + encodeURIComponent(k), {method:'PUT', body: body}); if(!r.ok) throw new Error('Gagal menyimpan ke server (HTTP ' + r.status + ')');
        var j = await r.json(); if(j.rev) window.__REV = j.rev;
        LAST_META = info; META_VER = info.savedAt || '';
        if(prev && prev.sid && prev.sid !== info.sid){ for(var i=0;i<(prev.n||0);i++) api('store/' + encodeURIComponent('v' + prev.sid + ':chunk:' + i), {method:'DELETE'}).catch(function(){}); } // bersihkan versi lama
        SID = null; return {key: key, value: value};
      }
      var ci = chunkKey(key);
      if(ci !== null){ if(!SID) SID = Date.now().toString(36) + Math.random().toString(36).slice(2, 5); k = 'v' + SID + ':chunk:' + ci; }
      body = await gz(value);
      var r2 = await api('store/' + encodeURIComponent(k), {method:'PUT', body: body}); if(!r2.ok) throw new Error('Gagal menyimpan ke server (HTTP ' + r2.status + ')');
      return {key: key, value: value};
    },
    async delete(key){
      if(ROLE !== 'admin') throw new Error('READ_ONLY');
      var k = key, ci = chunkKey(key); if(ci !== null && LAST_META && LAST_META.sid) k = 'v' + LAST_META.sid + ':chunk:' + ci;
      var r = await api('store/' + encodeURIComponent(k), {method:'DELETE'}); var j = await r.json().catch(function(){return {};}); if(j.rev) window.__REV = j.rev; return {key: key, deleted: true};
    },
    async list(){ return {keys: []}; }
  };

  // ---------- pemuatan data bawaan (setelah login) ----------
  window.__loadSiteData = async function(){
    var L = document.getElementById('boot-loading'), say = function(m){ if(L) L.innerHTML = '<div style="max-width:420px;padding:24px;text-align:center;line-height:1.55;font-weight:500;">' + m + '</div>'; };
    say('Memeriksa akses…');
    var s = await (await fetch('/api/session', {headers: tok() ? {Authorization: 'Bearer ' + tok()} : {}})).json();
    if(!s.role){ if(L) L.style.display = 'none'; await loginUI(); if(L) L.style.display = 'flex'; s = await (await fetch('/api/session', {headers: {Authorization: 'Bearer ' + tok()}})).json(); }
    window.__USER = s.user; window.__NAME = s.name;
    ROLE = s.role; window.__REV = s.rev || '0'; window.__ROLE = ROLE;
    document.body.classList.add('role-' + (ROLE || 'viewer'));
    say('Mengunduh data terbaru dari server…');
    var man = await (await api('data/manifest')).json(); BUILD = man.build || '1';
    var names = Object.keys(man.parts), jobs = [];
    names.forEach(function(n){ for(var i=0;i<man.parts[n];i++) jobs.push([n, i]); });
    var done = 0, out = {};
    await Promise.all(jobs.map(async function(j){ var r = await api('data/' + j[0] + '/' + j[1] + '?v=' + BUILD); if(!r.ok) throw new Error('Gagal mengunduh data (' + j[0] + ' ' + r.status + ')'); (out[j[0]] = out[j[0]] || [])[j[1]] = await r.text(); done++; say('Mengunduh data… ' + done + '/' + jobs.length); }));
    var ids = {seed: 'seed-gz', member: 'member-gz', memtx: 'member-tx-gz'};
    names.forEach(function(n){ var el = document.getElementById(ids[n]); if(el) el.textContent = out[n].join(''); });
    say('Menyiapkan dashboard…');
    startSiteUi();
  };


  // ---------- panel Kelola Pengguna (admin) ----------
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  async function openUsers(){
    var old = document.getElementById('site-users-panel'); if(old) old.remove();
    var d = document.createElement('div'); d.id = 'site-users-panel';
    d.style.cssText = 'position:fixed;inset:0;z-index:99995;background:rgba(10,18,22,.6);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;font-family:system-ui,-apple-system,sans-serif;';
    document.body.appendChild(d);
    var BT = 'border:0;border-radius:7px;padding:6px 10px;font-size:12.5px;font-weight:700;cursor:pointer;margin:2px 2px 2px 0;';
    var msg = '';
    async function call(path, method, body){
      var r = await api('admin/users' + path, {method: method, headers: {'content-type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
      var j = await r.json().catch(function(){ return {}; }); if(!r.ok){ msg = j.error || ('Gagal (HTTP ' + r.status + ')'); return null; } msg = ''; return j;
    }
    async function load(){ var r = await api('admin/users'); return r.ok ? r.json() : null; }
    async function draw(data){
      if(!data){ d.innerHTML = '<div style="background:#fff;border-radius:12px;padding:20px;">Gagal memuat. <button id="uc">Tutup</button></div>'; d.querySelector('#uc').onclick = function(){ d.remove(); }; return; }
      var h = '<div style="background:#fff;border-radius:14px;padding:18px;width:100%;max-width:760px;margin:auto 0;">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;"><div style="font-weight:800;font-size:17px;color:#17262E;">Kelola Pengguna</div><button id="uc" style="'+BT+'background:#eee;">Tutup ✕</button></div>'
        + '<div style="font-size:12px;color:#6b6f6a;margin:4px 0 10px;">Akun utama admin: <b>' + esc(data.owner) + '</b> (dari pengaturan Netlify, tidak bisa dihapus). Menghapus / menonaktifkan user langsung memutus aksesnya.</div>'
        + (msg ? '<div style="color:#B23A2E;font-size:13px;margin-bottom:8px;">' + esc(msg) + '</div>' : '');
      h += '<div style="font-weight:700;margin:10px 0 4px;">Permintaan akses (' + data.pending.length + ')</div>';
      if(!data.pending.length) h += '<div style="font-size:13px;color:#777;">Tidak ada permintaan.</div>';
      data.pending.forEach(function(p){ h += '<div style="border:1px solid #e3dfd2;border-radius:9px;padding:8px 10px;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;"><div><b>' + esc(p.name) + '</b> <span style="color:#777;">(' + esc(p.username) + ')</span><div style="font-size:11.5px;color:#888;">' + esc((p.requestedAt || '').slice(0,16).replace('T',' ')) + '</div></div><div><button data-a="approve" data-r="viewer" data-u="' + esc(p.username) + '" style="'+BT+'background:#D9720B;color:#241500;">Setujui Viewer</button><button data-a="approve" data-r="admin" data-u="' + esc(p.username) + '" style="'+BT+'background:#17262E;color:#fff;">Setujui Admin</button><button data-a="reject" data-u="' + esc(p.username) + '" style="'+BT+'background:#f3d9d5;color:#7a1f14;">Tolak</button></div></div>'; });
      h += '<div style="font-weight:700;margin:14px 0 4px;">Pengguna aktif (' + data.users.length + ')</div>';
      if(!data.users.length) h += '<div style="font-size:13px;color:#777;">Belum ada pengguna selain admin utama.</div>';
      data.users.forEach(function(u){ h += '<div style="border:1px solid #e3dfd2;border-radius:9px;padding:8px 10px;margin-bottom:6px;"><div><b>' + esc(u.name) + '</b> <span style="color:#777;">(' + esc(u.username) + ')</span> · ' + (u.role === 'admin' ? 'Admin' : 'Viewer') + (u.disabled ? ' · <span style="color:#B23A2E;">nonaktif</span>' : '') + '</div><div>'
        + '<button data-a="role" data-r="' + (u.role === 'admin' ? 'viewer' : 'admin') + '" data-u="' + esc(u.username) + '" style="'+BT+'background:#eee;">Jadikan ' + (u.role === 'admin' ? 'Viewer' : 'Admin') + '</button>'
        + '<button data-a="toggle" data-d="' + (u.disabled ? 0 : 1) + '" data-u="' + esc(u.username) + '" style="'+BT+'background:#eee;">' + (u.disabled ? 'Aktifkan' : 'Nonaktifkan') + '</button>'
        + '<button data-a="pw" data-u="' + esc(u.username) + '" style="'+BT+'background:#eee;">Reset password</button>'
        + '<button data-a="del" data-u="' + esc(u.username) + '" style="'+BT+'background:#f3d9d5;color:#7a1f14;">Hapus akses</button></div></div>'; });
      h += '<div style="font-weight:700;margin:14px 0 4px;">Tambah user langsung</div><form id="uadd" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;">'
        + '<input name="name" placeholder="Nama lengkap" style="padding:9px;border:1px solid #cfcabb;border-radius:8px;font-size:16px;">'
        + '<input name="username" placeholder="user (huruf kecil)" autocapitalize="none" style="padding:9px;border:1px solid #cfcabb;border-radius:8px;font-size:16px;">'
        + '<input name="password" placeholder="password (min. 8)" style="padding:9px;border:1px solid #cfcabb;border-radius:8px;font-size:16px;">'
        + '<select name="role" style="padding:9px;border:1px solid #cfcabb;border-radius:8px;font-size:16px;"><option value="viewer">Viewer</option><option value="admin">Admin</option></select>'
        + '<button type="submit" style="'+BT+'background:#D9720B;color:#241500;padding:10px;">Tambah</button></form>'
        + '<div style="font-size:11.5px;color:#888;margin-top:10px;">Viewer: melihat semua menu kecuali Data Customer &amp; Upload Data. Admin: semua menu + upload + kelola pengguna.</div></div>';
      d.innerHTML = h;
      d.querySelector('#uc').onclick = function(){ d.remove(); };
      d.onclick = async function(e){ var t = e.target.closest('button[data-a]'); if(!t) return; var a = t.dataset.a, u = t.dataset.u, res;
        if(a === 'approve') res = await call('/' + u + '/approve', 'POST', {role: t.dataset.r});
        else if(a === 'reject'){ if(!confirm('Tolak permintaan ' + u + '?')) return; res = await call('/' + u + '/reject', 'POST', {}); }
        else if(a === 'role') res = await call('/' + u + '/update', 'POST', {role: t.dataset.r});
        else if(a === 'toggle') res = await call('/' + u + '/update', 'POST', {disabled: t.dataset.d === '1'});
        else if(a === 'pw'){ var p = prompt('Password baru untuk ' + u + ' (min. 8 karakter):'); if(!p) return; res = await call('/' + u + '/update', 'POST', {password: p}); }
        else if(a === 'del'){ if(!confirm('Hapus akses ' + u + ' secara permanen?')) return; res = await call('/' + u, 'DELETE'); }
        draw(res || await load()); };
      d.querySelector('#uadd').onsubmit = async function(e){ e.preventDefault(); var fd = new FormData(e.target), o = {}; fd.forEach(function(v, k){ o[k] = v; }); var res = await call('', 'POST', o); draw(res || await load()); };
    }
    draw(await load());
  }

  // ---------- UI situs: peran, info pengguna, banner data baru ----------
  function startSiteUi(){
    var side = document.querySelector('.sidebar'), foot = document.getElementById('sidebar-foot');
    if(side && !document.getElementById('site-user')){
      var u = document.createElement('div'); u.id = 'site-user';
      u.style.cssText = 'font-size:11.5px;color:#8c9a92;padding:8px 10px 2px;';
      u.innerHTML = 'Masuk: <b style="color:#fff">' + (window.__NAME || window.__USER) + '</b> (' + (ROLE === 'admin' ? 'Admin' : 'Viewer') + ')<br>' + (ROLE === 'admin' ? '<a href="#" id="site-users" style="color:#F2B35E;">Kelola Pengguna</a> · ' : '') + '<a href="#" id="site-out" style="color:#F2B35E;">Keluar</a>';
      if(foot && foot.parentNode) foot.parentNode.insertBefore(u, foot.nextSibling); else side.appendChild(u);
      u.querySelector('#site-out').onclick = function(e){ e.preventDefault(); setTok(''); location.reload(); };
      var ua = u.querySelector('#site-users'); if(ua) ua.onclick = function(e){ e.preventDefault(); openUsers(); };
    }
    var banner = null;
    function show(){ if(banner) return; banner = document.createElement('div'); banner.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:99990;background:#17262E;color:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:13.5px;';
      banner.innerHTML = '<span>Data dashboard sudah diperbarui.</span><button style="border:0;border-radius:8px;background:#D9720B;color:#241500;font-weight:800;padding:8px 14px;cursor:pointer;">Muat ulang</button>'; banner.querySelector('button').onclick = function(){ location.reload(); }; document.body.appendChild(banner); }
    var reloading = false;
    async function poll(){ if(document.hidden || reloading) return; try{ var r = await api('rev'); var j = await r.json(); if(j.rev && j.rev !== window.__REV){
        if(ROLE === 'admin') show();
        else { reloading = true; var t = document.createElement('div'); t.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:99990;background:#17262E;color:#fff;border-radius:12px;padding:12px 14px;font-size:13.5px;text-align:center;'; t.textContent = 'Data baru dari admin — memperbarui…'; document.body.appendChild(t); setTimeout(function(){ location.reload(); }, 1200); }
      } }catch(e){} }
    setInterval(poll, 20000); document.addEventListener('visibilitychange', poll); window.addEventListener('focus', poll); window.addEventListener('online', poll);
    window.__siteCheck = async function(){ var r = await (await api('rev')).json(); var meta = null; try{ meta = JSON.parse(await gunz(await (await api('store/retailpulse_v2_meta')).text())); }catch(e){} return {revDiMuat: window.__REV, revServer: r.rev, tersimpanDiServer: meta ? meta.savedAt : null, bagian: meta ? meta.n : null, role: ROLE}; };
  }

function decodeSeed(o){
  for(const k in o){ const v = o[k];
    // pembuat objek per tabel (literal objek dengan kunci tetap) — jauh lebih cepat daripada mengisi kunci satu per satu
    const dec = g=>{ const mk = new Function('r','return {'+g.__c.map((c,i)=>JSON.stringify(c)+':r['+i+']').join(',')+'}'); const R = g.__r, out = new Array(R.length); for(let i=0;i<R.length;i++) out[i] = mk(R[i]); return out; };
    if(v && !Array.isArray(v)){ if(v.__c && v.__r) o[k] = dec(v); else if(v.__multi) o[k] = [].concat(...v.__multi.map(dec)); }
  }
  return o;
}

// ---- Belting (Internal & Private Brand) — parser & konstanta ----
// Urutan posisi belting dari tertinggi ke terendah + warna untuk chart/pill.
const BELT_ORDER = ['Gold','SilverA','SilverB','SilverC','BronzeA','BronzeB','BronzeC','BronzeD','Rusted'];
const BELT_COLOR = {
  Gold:['#C9A227','#fff'], SilverA:['#7C858E','#fff'], SilverB:['#A3AAB1','#1F2A2E'], SilverC:['#C6CACF','#1F2A2E'],
  BronzeA:['#9A5B28','#fff'], BronzeB:['#B8803F','#fff'], BronzeC:['#D0A262','#1F2A2E'], BronzeD:['#E3C597','#1F2A2E'],
  Rusted:['#8B3A2B','#fff'],
};
function beltClean(v){ return String(v==null?'':v).replace(/\s+/g,' ').trim(); }
function beltNormHeader(h){ return beltClean(h).toUpperCase(); }
function beltNum(v){
  if(typeof v==='number') return isFinite(v) ? v : null;
  if(v==null) return null;
  const s = String(v).trim(); if(s==='') return null;
  const n = parseFloat(s.indexOf(',')!==-1 && s.indexOf('.')===-1 ? s.replace(',','.') : s.replace(/,/g,''));
  return isNaN(n) ? null : n;
}
function beltIsNumeric(v){ return beltNum(v)!==null && /^[-+]?[\d.,]+$/.test(String(v).trim()); }
function beltDate(v){
  const p2 = n=>String(n).padStart(2,'0');
  if(v instanceof Date && !isNaN(v)){ const d = new Date(v.getTime()+12*3600*1000); return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate()); }
  if(typeof v==='number' && v>20000 && v<80000){ const d = new Date(Math.round((v-25569)*86400000)); return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate()); }
  const s = beltClean(v); const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  const m2 = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})/); if(m2){ const yy=+m2[3]<100?2000+ +m2[3]:+m2[3]; return yy+'-'+p2(m2[2])+'-'+p2(m2[1]); }
  return '';
}
function beltId(v){ let s = beltClean(v); if(/^\d+(\.0+)?$/.test(s)){ s = s.replace(/\.0+$/,''); s = s.padStart(6,'0'); } return s; }
function beltPos(v){
  const s = beltClean(v).replace(/\s+/g,''); if(!s) return '';
  const hit = BELT_ORDER.find(b=>b.toLowerCase()===s.toLowerCase());
  return hit || s;
}
function beltFindHeader(rows, mustHave){
  for(let i=0;i<Math.min(rows.length,15);i++){
    const n = (rows[i]||[]).map(beltNormHeader);
    if(mustHave.every(h=>n.includes(h))) return {idx:i, H:n};
  }
  return null;
}
function beltCol(H, names){ for(const nm of names){ const i = H.indexOf(nm); if(i!==-1) return i; } return -1; }

// Sheet "Belting Internal": No, Employee Name, Employee ID, Section During Belting, Current Job Title, Join Date,
// 360 Degree Score, Technical-course Score, Competency Score, Performance Score, Belting Position
function parseBeltingInternalRows(rows){
  const h = beltFindHeader(rows, ['EMPLOYEE NAME']);
  if(!h) throw new Error('Format Belting Internal tidak dikenali: header "Employee Name" tidak ditemukan.');
  const H = h.H;
  const c = {
    name:beltCol(H,['EMPLOYEE NAME']), id:beltCol(H,['EMPLOYEE ID']),
    section:beltCol(H,['SECTION DURING BELTING','CURRENT SECTION','SECTION']),
    job:beltCol(H,['CURRENT JOB TITLE','JOB TITLE']), join:beltCol(H,['JOIN DATE']),
    s360:beltCol(H,['360 DEGREE SCORE','360 SCORE']), tech:beltCol(H,['TECHNICAL-COURSE SCORE','TECHNICAL COURSE SCORE','TECHNICAL SCORE']),
    comp:beltCol(H,['COMPETENCY SCORE']), perf:beltCol(H,['PERFORMANCE SCORE']), pos:beltCol(H,['BELTING POSITION']),
  };
  if(c.job===-1) throw new Error('Kolom "Current Job Title" tidak ditemukan di file Belting Internal.');
  if(c.pos===-1) throw new Error('Kolom "Belting Position" tidak ditemukan di file Belting Internal.');
  const g = (r,i)=> i===-1 ? null : r[i];
  const out = [];
  for(let i=h.idx+1;i<rows.length;i++){
    const r = rows[i]; if(!r) continue;
    const name = beltClean(g(r,c.name)); if(!name) continue;
    out.push({
      id:beltId(g(r,c.id)), name, section:beltClean(g(r,c.section)), job:beltClean(g(r,c.job)), join:beltDate(g(r,c.join)),
      s360:beltNum(g(r,c.s360)), tech:beltNum(g(r,c.tech)), comp:beltNum(g(r,c.comp)), perf:beltNum(g(r,c.perf)), pos:beltPos(g(r,c.pos)),
    });
  }
  if(!out.length) throw new Error('Tidak ada baris karyawan yang valid ditemukan di file Belting Internal.');
  return out;
}

const BELT_MONTHS_ID = {januari:1,februari:2,maret:3,april:4,mei:5,juni:6,juli:7,agustus:8,september:9,oktober:10,november:11,desember:12,
  jan:1,feb:2,mar:3,apr:4,jun:6,jul:7,agu:8,agt:8,aug:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};
function beltPeriodMeta(title){
  const t = beltClean(title);
  const y = +(t.match(/(20\d\d)/)||[])[1] || 0;
  const q = t.match(/\bQ([1-4])\b/i);
  if(q){ const n = +q[1]; return {label:'Q'+n+(y?' '+y:''), key:y*100+n*3}; }
  const words = t.toLowerCase().replace(/[()]/g,' ').split(/[^a-z]+/).filter(Boolean);
  const mw = words.find(w=>BELT_MONTHS_ID[w]);
  if(mw){ const m = BELT_MONTHS_ID[mw]; const nm = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][m-1]; return {label:nm+(y?' '+y:''), key:y*100+m}; }
  return {label:t||'-', key:y*100};
}

// Sheet "Belting Private Brand": ... Belting Title, ..., Current Job Title, Join Date, Lms-learningpath Score, Competency Score,
// Performance Score, Belting Position. Baris periode tertentu (mis. Q2) memuat 5 skor
// (LMS, 360, Technical, Competency, Performance) sehingga posisi belting bergeser — skor dibaca dari kolom "Lms" sampai akhir baris.
function parseBeltingPBRows(rows){
  const h = beltFindHeader(rows, ['EMPLOYEE NAME','BELTING TITLE']);
  if(!h) throw new Error('Format Belting Private Brand tidak dikenali: header "Employee Name" & "Belting Title" tidak ditemukan.');
  const H = h.H;
  const c = {
    period:beltCol(H,['BELTING TITLE']), name:beltCol(H,['EMPLOYEE NAME']), id:beltCol(H,['EMPLOYEE ID']),
    location:beltCol(H,['CURRENT LOCATION','LOCATION DURING BELTING']), section:beltCol(H,['CURRENT SECTION','SECTION DURING BELTING']),
    level:beltCol(H,['CURRENT LEVEL','LEVEL DURING BELTING']), job:beltCol(H,['CURRENT JOB TITLE','JOB TITLE DURING BELTING']),
    join:beltCol(H,['JOIN DATE']), lms:H.findIndex(x=>x.startsWith('LMS')),
  };
  if(c.lms===-1) throw new Error('Kolom skor ("Lms-learningpath Score") tidak ditemukan di file Belting Private Brand.');
  const g = (r,i)=> i===-1 ? '' : r[i];
  const out = [];
  for(let i=h.idx+1;i<rows.length;i++){
    const r = rows[i]; if(!r) continue;
    const name = beltClean(g(r,c.name)); const title = beltClean(g(r,c.period)); if(!name || !title) continue;
    const nums = []; let pos = '';
    for(let j=c.lms;j<r.length;j++){
      const v = r[j]; if(v==null || String(v).trim()==='') continue;
      if(typeof v==='number' || beltIsNumeric(v)) nums.push(beltNum(v)); else pos = beltPos(v);
    }
    let lms=null, s360=null, tech=null, comp=null, perf=null;
    if(nums.length>=5){ [lms,s360,tech,comp,perf] = nums; }
    else if(nums.length===4){ [lms,tech,comp,perf] = nums; }
    else if(nums.length===3){ [lms,comp,perf] = nums; }
    else if(nums.length===2){ [comp,perf] = nums; }
    else if(nums.length===1){ [perf] = nums; }
    const pm = beltPeriodMeta(title);
    out.push({ period:title, pLabel:pm.label, pKey:pm.key, id:beltId(g(r,c.id)), name, location:beltClean(g(r,c.location)),
      section:beltClean(g(r,c.section)), level:beltClean(g(r,c.level)), job:beltClean(g(r,c.job)), join:beltDate(g(r,c.join)),
      lms, s360, tech, comp, perf, pos });
  }
  if(!out.length) throw new Error('Tidak ada baris peserta yang valid ditemukan di file Belting Private Brand.');
  return out;
}
function beltPickSheet(wb, re){
  const nm = wb.SheetNames.find(n=>re.test(n));
  return wb.Sheets[nm || wb.SheetNames[0]];
}
async function beltReadRows(file, re){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array', cellDates:true});
  const ws = beltPickSheet(wb, re);
  return XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
}
// Satu file berisi 2 sheet: "Belting Internal" & "Belting Private Brand". Sheet dikenali dari NAMA; kalau nama tidak cocok,
// dikenali dari header (ada kolom "Belting Title" = Private Brand, tanpa itu = Internal). Salah satu sheet boleh tidak ada.
async function parseBeltingFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array', cellDates:true});
  let wsInt = null, wsPB = null;
  wb.SheetNames.forEach(n=>{
    if(!wsInt && /internal/i.test(n)) wsInt = wb.Sheets[n];
    else if(!wsPB && /private|\bpb\b/i.test(n)) wsPB = wb.Sheets[n];
  });
  const toRows = ws => XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
  if(!wsInt || !wsPB){
    wb.SheetNames.forEach(n=>{
      const ws = wb.Sheets[n]; if(ws===wsInt || ws===wsPB) return;
      const rows = toRows(ws);
      if(beltFindHeader(rows, ['EMPLOYEE NAME','BELTING TITLE'])){ if(!wsPB) wsPB = ws; }
      else if(beltFindHeader(rows, ['EMPLOYEE NAME'])){ if(!wsInt) wsInt = ws; }
    });
  }
  if(!wsInt && !wsPB) throw new Error('Sheet Belting tidak ditemukan. File harus berisi sheet "Belting Internal" dan/atau "Belting Private Brand".');

function fmtRp(n, opts={}){
  n = Number(n)||0;
  const abs = Math.abs(n);
  let s;
  if(abs >= 1e9) s = (n/1e9).toLocaleString('id-ID',{maximumFractionDigits:2}) + ' M';
  else if(abs >= 1e6) s = (n/1e6).toLocaleString('id-ID',{maximumFractionDigits:1}) + ' Jt';
  else if(abs >= 1e3) s = (n/1e3).toLocaleString('id-ID',{maximumFractionDigits:0}) + ' Rb';
  else s = n.toLocaleString('id-ID');
  return (opts.noPrefix ? '' : 'Rp ') + s;
}
function fmtNum(n){ return Math.round(Number(n)||0).toLocaleString('id-ID'); }
function fmtPct(n, digits=1){ if(n===null||n===undefined||!isFinite(n)) return '-'; return (Number(n)*100).toLocaleString('id-ID',{minimumFractionDigits:digits,maximumFractionDigits:digits}) + '%'; }
function safeDiv(a,b){ return b ? a/b : 0; }
function pillClass(v, threshold=1){ return v >= threshold ? 'good' : 'bad'; }
function pillClassGrowth(v){ return v >= 0 ? 'good' : 'bad'; }
function arrow(v){ return v >= 0 ? '▲' : '▼'; }
function heatColor(v, mid=1){
  const d = Math.max(-0.4, Math.min(0.4, v - mid));
  if(d >= 0){ const t = d/0.4; return `rgba(47,122,79,${0.12+t*0.35})`; }
  const t = -d/0.4; return `rgba(178,58,46,${0.12+t*0.35})`;
}
function growthColor(v){
  const d = Math.max(-0.3, Math.min(0.3, v));
  if(d>=0){ const t = d/0.3; return `rgba(47,122,79,${0.12+t*0.35})`; }
  const t = -d/0.3; return `rgba(178,58,46,${0.12+t*0.35})`;
}

// ============================================================
// PERSISTENCE — last uploaded data is "locked in" via window.storage so the
// dashboard reopens with the most recent data; new uploads replace it.
// Everything is serialized into ONE JSON blob, then split into as few chunks
// as possible (few large requests, not many small ones — avoids rate limits).
// ============================================================
const PERSIST_PREFIX = 'retailpulse_v2_';
const PERSIST_KEYS = ['salesFact','brandFact','itemFact','itemMeta','spFact','sourceFact','sourceDailyFact','hourFact','brandDayFact','sourceZonaFact','notaFact','notaCatFact','dcAging','dataMeta',
  'budgetStoreFact','budgetPBFact','budgetDailyFact','budgetProjectMonthly','sqvItems',
  'dcByItem','dcBySite','dcBySiteStatus','dcSites','uploadStatus','trafficFact','salperFact','tlMentor','budgetSalperFact','sourceKpi','kpiMatrix','beltingInternal','beltingPB','memberDb','memberTx'];
const PERSIST_CHUNK_SIZE = 3.5 * 1024 * 1024; // chars per chunk, safely under the 5MB/key limit

async function persistState(){
  if(typeof window.storage==='undefined' || !window.storage || typeof window.storage.set!=='function') throw new Error('NO_STORAGE'); // mode file biasa: tidak ada penyimpanan otomatis → jangan buang waktu menyusun data 30+ MB
  const payload = {};
  PERSIST_KEYS.forEach(k => { payload[k] = STATE[k]; });
  payload.__ver = (SEED.meta && SEED.meta.dataVersion) || 0;
  const priv = {memberDb: payload.memberDb, memberTx: payload.memberTx}; delete payload.memberDb; delete payload.memberTx;
  const privStr = JSON.stringify(priv), privN = Math.ceil(privStr.length / PERSIST_CHUNK_SIZE) || 1; payload.__privN = privN;
  for(let i=0;i<privN;i++) await window.storage.set(PERSIST_PREFIX+'priv'+i, privStr.slice(i*PERSIST_CHUNK_SIZE, (i+1)*PERSIST_CHUNK_SIZE), false);
  const str = JSON.stringify(payload);
  const nChunks = Math.ceil(str.length / PERSIST_CHUNK_SIZE) || 1;
  for(let i=0;i<nChunks;i++){
    const chunk = str.slice(i*PERSIST_CHUNK_SIZE, (i+1)*PERSIST_CHUNK_SIZE);
    await window.storage.set(PERSIST_PREFIX+'chunk:'+i, chunk, false);
  }
  await window.storage.set(PERSIST_PREFIX+'meta', JSON.stringify({n:nChunks, savedAt:new Date().toISOString(), size:str.length}), false);
  return {chunks:nChunks, bytes:str.length};
}

async function tryLoadPersistedState(){
  let metaRes;
  try{ metaRes = await window.storage.get(PERSIST_PREFIX+'meta', false); }
  catch(e){ return false; } // nothing persisted yet — keep built-in seed data (normal for first run)
  const meta = JSON.parse(metaRes.value);
  let str = '';
  for(let i=0;i<meta.n;i++){
    const c = await window.storage.get(PERSIST_PREFIX+'chunk:'+i, false);
    str += c.value;
  }
  const payload = JSON.parse(str);
  if(window.__ROLE==='admin'){ if(payload.__privN){ let ps=''; for(let i=0;i<payload.__privN;i++){ const c = await window.storage.get(PERSIST_PREFIX+'priv'+i, false); ps += c.value; } const pv = JSON.parse(ps); payload.memberDb = pv.memberDb; payload.memberTx = pv.memberTx; } else setTimeout(()=>{ persistState().catch(()=>{}); }, 4000); }
  if((payload.__ver||0) < ((SEED.meta && SEED.meta.dataVersion)||0)) return false; // data bawaan lebih baru dari yang tersimpan di browser
  const keepSeed = {}; // SQV & Stock DC bawaan yang tanggalnya lebih baru dari yang tersimpan di browser tidak boleh tertimpa
  [['sqv','stockDate',['sqvItems']],['dc','reportDate',['dcByItem','dcBySite','dcBySiteStatus','dcSites','dcAging']],['salper','uploadedAt',['salperFact','budgetSalperFact','tlMentor']]].forEach(([mk,dk,keys])=>{
    const sd = STATE.dataMeta && STATE.dataMeta[mk] && STATE.dataMeta[mk][dk], pd = payload.dataMeta && payload.dataMeta[mk] && payload.dataMeta[mk][dk];
    if(sd && (!pd || sd > pd)){ keepSeed[mk] = {meta: STATE.dataMeta[mk], keys}; keys.forEach(k=>{ keepSeed[k] = STATE[k]; }); } });
  PERSIST_KEYS.forEach(k => { if(payload[k] === undefined) return; if(k==='memberDb' && (!payload[k] || !payload[k].length) && STATE.memberDb.length) return; STATE[k] = payload[k]; }); // database member bawaan tidak boleh tertimpa data kosong
  Object.keys(keepSeed).forEach(k=>{ if(k==='sqv' || k==='dc' || k==='salper'){ STATE.dataMeta = STATE.dataMeta || {}; STATE.dataMeta[k] = keepSeed[k].meta; if(STATE.uploadStatus) STATE.uploadStatus[{sqv:'sqv', dc:'stockDC', salper:'salper'}[k]] = 'default'; } else STATE[k] = keepSeed[k]; });
  return true;
}

async function resetToDefaultData(){
  try{
    const metaRes = await window.storage.get(PERSIST_PREFIX+'meta', false).catch(()=>null);
    if(metaRes){
      const meta = JSON.parse(metaRes.value);
      for(let i=0;i<meta.n;i++) await window.storage.delete(PERSIST_PREFIX+'chunk:'+i, false).catch(()=>{});

function findReportDate(rows, label){ // cari teks "<label>: 04 Oct 2026" di beberapa baris awal sheet
  for(let i=0;i<Math.min(rows.length,12);i++) for(const c of (rows[i]||[])){

    const m = c.slice(c.indexOf(label)).match(/(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4})/);

function anyDateToISO(v){
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if(typeof v==='number' && v>20000 && v<80000) return new Date(Math.round((v-25569)*86400000)).toISOString().slice(0,10);

}

function sortRowsBy(rows, key, dir){
  if(!key) return rows;
  const f = typeof key==='function' ? key : (r=>r[key]);
  const isNil = v => v===null || v===undefined || (typeof v==='number' && !isFinite(v));
  return rows.slice().sort((a,b)=>{
    const x = f(a), y = f(b), nx = isNil(x), ny = isNil(y);
    if(nx && ny) return 0; if(nx) return 1; if(ny) return -1;
    if(typeof x==='string' || typeof y==='string') return String(x).localeCompare(String(y),'id')*dir;
    return (x-y)*dir;
  });
}

function toNum(s){

function parseSalesDate(s){
  // format: DD/MM/YY HH:MM
  if(!s) return null;
  const parts = String(s).trim().split(' ');
  const dp = parts[0].split('/');
  if(dp.length<3) return null;
  let dd = parseInt(dp[0],10), mm = parseInt(dp[1],10), yy = parseInt(dp[2],10);
  yy = yy < 100 ? 2000+yy : yy;
  const hh = parts[1] ? parseInt(String(parts[1]).split(':')[0],10) : NaN;
  return {y:yy, m:mm, d:dd, h:isNaN(hh)?undefined:hh};
}

async function readFileAsLatin1Text(file){
  const buf = await file.arrayBuffer();
  const decoder = new TextDecoder('iso-8859-1');
  return decoder.decode(buf);
}

// Parse a "Sales Detail Report by Salesperson" CSV (semicolon, 6 header rows)
async function parseSalesCSVFile(file, onProgress){
  const text = await readFileAsLatin1Text(file);
  const lines = text.split(/\r?\n/), header = lines[6] || '', body = lines.slice(7), BLOCK = 8000;
  const opts = { header:true, delimiter:';', skipEmptyLines:true };
  let data = [], quoteIssue = false;
  for(let i=0; i<body.length && !quoteIssue; i+=BLOCK){
    const chunk = body.slice(i, i+BLOCK).filter(l=>l.length);
    if(chunk.length){ const res = Papa.parse(header+'\n'+chunk.join('\n'), opts); if(res.errors.some(e=>e.type==='Quotes')) quoteIssue = true; else data = data.concat(res.data); }
    if(onProgress) onProgress(Math.min(100, Math.round((i+BLOCK)/Math.max(1,body.length)*100)));
    await new Promise(r=>setTimeout(r,0)); // beri kesempatan layar menyegarkan progres
  }
  if(quoteIssue) data = Papa.parse(lines.slice(6).join('\n'), opts).data; // cadangan: ada data multi-baris → parsing utuh
  return buildSalesRows(data);
}

function memNorm(v){
  let t = String(v==null?'':v).trim().replace(/\.0+$/,'').replace(/[\s'"-]/g,'');
  if(!t || /^0+$/.test(t) || /^(null|n\/a|na|none|umum|guest|walkin|non ?member)$/i.test(t)) return '';
  if(/\D/.test(t) && t.replace(/\D/g,'').length>=10) t = t.replace(/\D/g,''); // mis. 'MC2010254101267' → hanya digit
  return t.replace(/^0+/,'');
}
function detectMemberCol(keys){
  const norm = k => String(k||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const pref = ['memberno','membernumber','memberid','membercardno','membercard','customerno','customerid','customernumber','custno','custid','nomember','nomormember','nomemberid','member','customer'];
  for(const want of pref){ const k = keys.find(x=>norm(x)===want); if(k) return k; }
  return keys.find(k=>/(member|customer|cust|pelanggan)/.test(norm(k)) && !/(name|nama|phone|hp|telp|tipe|type|point|poin|level|kriteria|group|class)/.test(norm(k))) || '';
}
function padItemNo(v){ const s = String(v==null?'':v).trim(); return /^\d+$/.test(s) ? s.padStart(10,'0') : s; }
function parseHourCell(v){ const m = String(v||'').trim().match(/^(\d{1,2}):/); return m ? Math.min(23, parseInt(m[1],10)) : undefined; }
// records = baris CSV (objek per header). Dipisah dari pembaca file agar bisa dipakai ulang.
function buildSalesRows(records){
  const rows = [];
  const memCol = detectMemberCol(records && records[0] ? Object.keys(records[0]) : []);
  window.__memCol = {col: memCol, headers: records && records[0] ? Object.keys(records[0]) : []};
  records.forEach(r => {
    const dt = parseSalesDate(r['Receipt Date']);
    if(!dt) return;
    const hr = parseHourCell(r['Time']);
    rows.push({
      y: dt.y, m: dt.m, d: dt.d, h: hr!==undefined ? hr : dt.h, // jam transaksi dari kolom "Time" (HH:MM:SS)
      cat: String(r['Category']||'').trim().toUpperCase(),
      subcat: String(r['Sub Category']||'').trim(),
      func: String(r['Function']||'').trim(),
      masterBrand: String(r['Master Brand']||'').trim(),
      brand: String(r['Brand']||'').trim(),
      source: String(r['Source Type Name']||'').trim(),
      isPB: ['Private Brand','Exclusive Brand'].includes(String(r['Master Type Brand']||'').trim()),
      spId: String(r['Salesperson ID']||'').trim(),
      spName: String(r['Salesperson Name']||'').trim(),
      nota: String(r['Receipt No']||'').trim(), // canonical invoice id = Receipt No
      mem: memCol ? memNorm(r[memCol]) : '', // nomor member (kosong = transaksi non-member)
      item: padItemNo(r['Item No']), // kode item dinormalisasi 10 digit (SQV & data 2025 memakai nol di depan, CSV Sales tidak)
      itemName: String(r['Item Name']||'').trim(),
      qty: toNum(r['Quantity']),
      amt: toNum(r['Amount Exclude Sales']), // Sales = Exclude Tax, consistent with Budget basis
      amtInclTax: toNum(r['Amount Inculde Sales'] ?? r['Amount Include Sales']),
    });
  });
  return rows;
}
function salesMeta(rows, files){
  let mn = '9999-99-99', mx = '0000-00-00'; const p2 = n=>String(n).padStart(2,'0');
  rows.forEach(r=>{ const k = r.y+'-'+p2(r.m)+'-'+p2(r.d); if(k<mn) mn=k; if(k>mx) mx=k; });
  return {from:mn, to:mx, rows:rows.length, file:(files||[]).map(f=>f.name).join(', ')};
}

// Recompute all sales-derived fact tables from a flat rows array, for a SET of (y,m) months.
// Returns partial fact tables keyed by those months only.
function computeFactsFromRows(rows){
  const salesFact = new Map(), brandFact = new Map(), itemFact = new Map(),
        spFact = new Map(), sourceFact = new Map(), sourceDailyFact = new Map(), notaFact = new Map(), notaCatFact = new Map(), hourFact = new Map(), brandDayFact = new Map(), sourceZonaFact = new Map();
  const memberTx = [];
  const itemMeta = {};
  const touchedYM = new Set();

  function key(...parts){ return parts.join('|'); }

  rows.forEach(r => {
    touchedYM.add(r.y+'-'+r.m);
    if(r.mem) memberTx.push([r.y*10000+r.m*100+r.d, r.mem, r.nota, r.spId, r.item, r.qty, r.amt]);
    // salesFact: y,m,d,cat
    const k1 = key(r.y,r.m,r.d,r.cat);
    if(!salesFact.has(k1)) salesFact.set(k1, {y:r.y,m:r.m,d:r.d,cat:r.cat,amt:0,qty:0,pbAmt:0,pbQty:0});
    const s1 = salesFact.get(k1); s1.amt += r.amt; s1.qty += r.qty;
    if(r.isPB){ s1.pbAmt += r.amt; s1.pbQty += r.qty; }

    // brandFact: y,m,cat,subcat,func,masterBrand
    const k2 = key(r.y,r.m,r.cat,r.subcat,r.func,r.masterBrand);
    if(!brandFact.has(k2)) brandFact.set(k2, {y:r.y,m:r.m,cat:r.cat,subcat:r.subcat,func:r.func,brand:r.masterBrand,amt:0,qty:0});
    const s2 = brandFact.get(k2); s2.amt += r.amt; s2.qty += r.qty;

    // itemFact: y,m,item
    const k3 = key(r.y,r.m,r.item);
    if(!itemFact.has(k3)) itemFact.set(k3, {y:r.y,m:r.m,item:r.item,amt:0,qty:0});
    const s3 = itemFact.get(k3); s3.amt += r.amt; s3.qty += r.qty;
    itemMeta[r.item] = {name:r.itemName, cat:r.cat, subcat:r.subcat, func:r.func, masterBrand:r.masterBrand, brand:r.brand};

    // spFact: y,m,d,spId (Zona/Kriteria/Master Brand resolved later via salperFact lookup — a salesperson
    // keeps ONE fixed zona regardless of which product category they sold, unlike the old category-derived split)
    // Kept at daily granularity (d) so the Sales Person page can filter to specific dates within a month.
    const k4 = key(r.y,r.m,r.d,r.spId);
    if(!spFact.has(k4)) spFact.set(k4, {y:r.y,m:r.m,d:r.d,spId:r.spId,spName:r.spName,amt:0,pbAmt:0,protectionQty:0,protectionAmt:0,projectAmt:0,whatsappAmt:0,qty:0,notas:new Map()});
    const s4 = spFact.get(k4);
    s4.qty += r.qty; if(!s4.notas.has(r.nota)) s4.notas.set(r.nota, new Set()); s4.notas.get(r.nota).add(r.item); // dasar IPD/IPI per salesperson
    s4.amt += r.amt; if(r.isPB) s4.pbAmt += r.amt;
    if(String(r.subcat||'').trim().toUpperCase()==='PROTECTION'){ s4.protectionQty += r.qty; s4.protectionAmt += r.amt; }
    if(r.source==='Sales Project') s4.projectAmt += r.amt;
    if(r.source==='WhatsApp') s4.whatsappAmt += r.amt;

    // sourceFact: y,m,source
    const k5 = key(r.y,r.m,r.source);
    if(!sourceFact.has(k5)) sourceFact.set(k5, {y:r.y,m:r.m,source:r.source,amt:0,notas:new Set()});
    const s5 = sourceFact.get(k5); s5.amt += r.amt; s5.notas.add(r.nota);

    // sourceDailyFact: y,m,d,source — day-level breakdown, used by the Source Type "Ringkasan per Tanggal" (MTD) table
    const k5d = key(r.y,r.m,r.d,r.source);
    if(!sourceDailyFact.has(k5d)) sourceDailyFact.set(k5d, {y:r.y,m:r.m,d:r.d,source:r.source,amt:0,notas:new Set()});
    const s5d = sourceDailyFact.get(k5d); s5d.amt += r.amt; s5d.notas.add(r.nota);
    { const zs0 = catToZona(r.cat, r.m), kz = r.y+'|'+r.m+'|'+r.d+'|'+r.source+'|'+zs0; if(!sourceZonaFact.has(kz)) sourceZonaFact.set(kz,{y:r.y,m:r.m,d:r.d,source:r.source,zona:zs0,amt:0}); sourceZonaFact.get(kz).amt += r.amt; } // sourceZonaFact: Source Type × Zona per hari
    // hourFact: y,m,d,h,zona (untuk Trend by Jam di tab Daily) · brandDayFact: y,m,d,cat,brand (untuk Trend by Tanggal/Week di tab Master Brand)
    if(r.h!==undefined){ const zk = catToZona(r.cat, r.m), kh = r.y+'|'+r.m+'|'+r.d+'|'+r.h+'|'+zk;
      if(!hourFact.has(kh)) hourFact.set(kh, {y:r.y,m:r.m,d:r.d,h:r.h,zona:zk,amt:0}); hourFact.get(kh).amt += r.amt; }
    const kbd = r.y+'|'+r.m+'|'+r.d+'|'+r.cat+'|'+r.masterBrand;
    if(!brandDayFact.has(kbd)) brandDayFact.set(kbd, {y:r.y,m:r.m,d:r.d,cat:r.cat,brand:r.masterBrand,amt:0}); brandDayFact.get(kbd).amt += r.amt;

    // notaFact: y,m,d,nota
    // Uses Amount Exclude Tax (r.amt) so Ticket Size / Basket Size totals reconcile with
    // Total Sales elsewhere in the dashboard, which is also Exclude Tax (consistent with Budget basis).
    const k6 = key(r.y,r.m,r.d,r.nota);
    if(!notaFact.has(k6)) notaFact.set(k6, {y:r.y,m:r.m,d:r.d,nota:r.nota,amt:0});
    notaFact.get(k6).amt += r.amt;

    // notaCatFact: y,m,d,nota,cat — per-nota amount split by Category, so TIEBS can be filtered
    // by Zona/Category (a nota's ticket-size tier is then based only on the matching category's
    // share of that receipt, not the whole receipt).
    const k7 = key(r.y,r.m,r.d,r.nota,r.cat);
    if(!notaCatFact.has(k7)) notaCatFact.set(k7, {y:r.y,m:r.m,d:r.d,nota:r.nota,cat:r.cat,amt:0});
    notaCatFact.get(k7).amt += r.amt;
  });

  const sourceFactArr = [...sourceFact.values()].map(s => ({y:s.y,m:s.m,source:s.source,amt:s.amt,invoice:s.notas.size}));
  const sourceDailyFactArr = [...sourceDailyFact.values()].map(s => ({y:s.y,m:s.m,d:s.d,source:s.source,amt:s.amt,invoice:s.notas.size}));

  return {
    touchedYM, itemMeta, memberTx,
    salesFact: [...salesFact.values()],
    brandFact: [...brandFact.values()],
    itemFact: [...itemFact.values()],
    spFact: [...spFact.values()].map(({notas,...f})=>({...f, inv:notas.size, items:[...notas.values()].reduce((a,x)=>a+x.size,0)})),
    sourceFact: sourceFactArr,
    sourceDailyFact: sourceDailyFactArr,
    hourFact: [...hourFact.values()], brandDayFact: [...brandDayFact.values()], sourceZonaFact: [...sourceZonaFact.values()],
    notaFact: [...notaFact.values()],
    notaCatFact: [...notaCatFact.values()],
  };
}

function mergeSalesFacts(computed){
  // remove existing rows for touched (y,m) then append new
  const touched = computed.touchedYM;
  function ymKey(r){ return r.y+'-'+r.m; }
  STATE.salesFact = STATE.salesFact.filter(r=>!touched.has(ymKey(r))).concat(computed.salesFact);
  STATE.brandFact = STATE.brandFact.filter(r=>!touched.has(ymKey(r))).concat(computed.brandFact);
  STATE.itemFact = STATE.itemFact.filter(r=>!touched.has(ymKey(r))).concat(computed.itemFact);
  STATE.spFact = STATE.spFact.filter(r=>!touched.has(ymKey(r))).concat(computed.spFact);
  STATE.sourceFact = STATE.sourceFact.filter(r=>!touched.has(ymKey(r))).concat(computed.sourceFact);
  STATE.sourceDailyFact = (STATE.sourceDailyFact||[]).filter(r=>!touched.has(ymKey(r))).concat(computed.sourceDailyFact);
  STATE.hourFact = (STATE.hourFact||[]).filter(r=>!touched.has(ymKey(r))).concat(computed.hourFact);
  STATE.sourceZonaFact = (STATE.sourceZonaFact||[]).filter(r=>!touched.has(ymKey(r))).concat(computed.sourceZonaFact);

// ---- Budget Store (category x month) — supports NEW format (JGJ Template: 'Budget Cat' + Jan..Dec daily
// sheets) and legacy format (DECKY 'store' sheet). Returns {budgetStoreFact, budgetDailyFact} ----
const KNOWN_CATS_SET = new Set(Object.keys(ZONA_MAP));
function normCat(c){
  return String(c||'').trim().toUpperCase().replace(/\s*&\s*/g, ' & ').replace(/\s+/g,' ').trim();
}
async function parseBudgetStoreFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const DAILY_SHEETS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const hasNewFormat = wb.SheetNames.includes('Budget Cat');

  if(hasNewFormat){
    const budgetStoreFact = [];
    const ws = wb.Sheets['Budget Cat'];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, range:4});
    const header = rows[0];
    const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    for(let i=1;i<rows.length;i++){
      const row = rows[i]; if(!row || !row[0]) continue;
      const catN = normCat(row[0]);
      if(!KNOWN_CATS_SET.has(catN)) continue;
      MONTHS.forEach((mn, idx)=>{
        const colIdx = header.indexOf(mn);
        if(colIdx>=0) budgetStoreFact.push({cat:catN, m:idx+1, value: toNum(row[colIdx])});
      });
    }
    const budgetDailyFact = [];
    DAILY_SHEETS.forEach((sheetName, si)=>{
      if(!wb.SheetNames.includes(sheetName)) return;
      const wsD = wb.Sheets[sheetName];
      const dRows = XLSX.utils.sheet_to_json(wsD, {header:1, range:2});
      const headerRow = dRows[0];
      const catCols = [];
      headerRow.forEach((h, ci)=>{ const catN = normCat(h); if(h && KNOWN_CATS_SET.has(catN)) catCols.push({ci, catN}); });
      for(let i=2;i<dRows.length;i++){
        const row = dRows[i]; if(!row || typeof row[0] !== 'number') continue;
        const day = Math.round(row[0]);
        catCols.forEach(({ci,catN})=>{ budgetDailyFact.push({m:si+1, d:day, cat:catN, value: toNum(row[ci])}); });
      }
    });
    return { budgetStoreFact, budgetDailyFact };
  }

  // legacy format: sheet 'store'
  const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const sheetName = wb.SheetNames.includes('store') ? 'store' : wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, range:3});
  const header = rows[0];
  const catIdx = header.indexOf('Item Category');
  const out = [];
  for(let i=1;i<rows.length;i++){
    const row = rows[i];
    if(!row || row[catIdx]===undefined) continue;
    const catRaw = normCat(row[catIdx]);
    if(!KNOWN_CATS_SET.has(catRaw)) continue;
    MONTHS.forEach((mn, idx)=>{
      const colIdx = header.indexOf(mn);
      if(colIdx>=0) out.push({cat:catRaw, m: idx+1, value: toNum(row[colIdx])*1000});
    });
  }
  return { budgetStoreFact: out, budgetDailyFact: [] };
}

async function parseMemberFile(file){
  const buf = await file.arrayBuffer(), wb = XLSX.read(buf, {type:'array'});
  const norm = k => String(k||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  for(const sn of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {defval:'', raw:true}); if(!rows.length) continue;
    const keys = Object.keys(rows[0]);
    const noK = keys.find(k=>/^(membercardno|membercard|membercardnumber|nokartumember|memberno|nomember|nomormember|membernumber|memberid|customerno|customerid|nomorcustomer)$/.test(norm(k)));
    const nmK = keys.find(k=>/^(membername|namamember|nama|name|customername|namacustomer|namacust)$/.test(norm(k)));
    const phK = keys.find(k=>/^(phone|phoneno|nophone|nomorphone|telp|telepon|telephone|notelp|nomortelp|hp|nohp|handphone|mobile)$/.test(norm(k)));
    const krK = keys.find(k=>/^(kriteria|kriteriacustomer|kriteriamember|criteria|tipe|type|kategori)$/.test(norm(k)));
    if(!noK) continue;
    const out = [], seen = new Set();
    rows.forEach(r=>{
      const no = String(r[noK]==null?'':r[noK]).trim(), k = memNorm(no); if(!k || seen.has(k)) return; seen.add(k);
      let c = String(krK?r[krK]:'').trim(); if(c) c = c.charAt(0).toUpperCase()+c.slice(1).toLowerCase();
      out.push({k, no, n:String(nmK?r[nmK]:'').replace(/\s+/g,' ').trim(), p:String(phK?r[phK]:'').replace(/\s+/g,'').trim(), c});

  throw new Error('Format Database Customer tidak dikenali: butuh kolom "Membercard No", "Member Name", "Phone", "Kriteria".');

async function parseSalperFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});

  const dbSheetName = wb.SheetNames.find(n=>/database/i.test(n)) || wb.SheetNames[0];
  const wsDb = wb.Sheets[dbSheetName];
  const rows = XLSX.utils.sheet_to_json(wsDb, {defval:''});
  const roster = [], tl = [], tlSeen = new Set();
  const tlKey = rows.length ? Object.keys(rows[0]).find(k=>/mentor/i.test(k) || /^\s*tl\s*$/i.test(k)) : null; // kolom "TL Mentor" (satu file dengan database salesperson)
  rows.forEach(row=>{
    const spId = String(row['Salesperson ID']||'').trim();
    if(!spId) return;
    if(tlKey){ const raw = String(row[tlKey]||'').trim(), t = cleanTL(raw); if(t && raw.toLowerCase()!=='ok' && !tlSeen.has(spId)){ tlSeen.add(spId); tl.push({spId, name:cleanName(row['Salesperson Name']), tl:t}); } }
    roster.push({
      spId,
      spName: String(row['Salesperson Name']||'').trim(),
      zona: String(row['Zona']||'').trim(),
      kriteria: String(row['Kriteria']||'').trim(),
      masterBrand: String(row['Master Brand']||'').trim(),
    });
  });

  const budget = [];
  const budgetSheetName = wb.SheetNames.find(n=>/budget/i.test(n));
  if(budgetSheetName){
    const wsBud = wb.Sheets[budgetSheetName];
    const grid = XLSX.utils.sheet_to_json(wsBud, {header:1, defval:''});
    const headerRow = grid.find(r=>String(r[0]||'').trim().toLowerCase()==='zona');
    if(headerRow){
      const monthCols = headerRow.map((c,i)=> i===0 ? null : (MONTH_ABBR_MAP[String(c||'').trim().toUpperCase()]||null));
      const headerIdx = grid.indexOf(headerRow);
      grid.slice(headerIdx+1).forEach(r=>{

}

// Salah EDC, Ontime staging, Ontime receiving, Accuracy all (nilai rasio 0..1 atau %). Kolom yang tidak ada di
// file akan diisi null (dianggap belum ada data) tanpa membuat upload gagal.
const SOURCE_KPI_COLUMNS = [
  {key:'dsl',             match:h=>h==='DSL' || h.includes('DSL')},
  {key:'awt',             match:h=>h==='AWT' || h.includes('AWT')},
  {key:'netProfit',       match:h=>h.includes('NET PROFIT')},
  {key:'nems',            match:h=>h==='NEMS' || h.includes('NEMS')},
  {key:'pickupMoney',     match:h=>h.includes('PICKUP MONEY') || h.includes('PICK UP MONEY')},
  {key:'salahEdc',        match:h=>h.includes('SALAH EDC')},
  {key:'ontimeStaging',   match:h=>h.includes('ONTIME STAGING') || h.includes('ON TIME STAGING')},
  {key:'ontimeReceiving', match:h=>h.includes('ONTIME RECEIVING') || h.includes('ON TIME RECEIVING')},
  {key:'accuracyAll',     match:h=>h.includes('ACCURACY ALL') || h.includes('ACCURACY')},
  {key:'respondTime',     match:h=>h.includes('RESPOND TIME')},
];
async function parseSourceKpiFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1});
  let headerIdx = -1, header = null;
  for(let i=0;i<Math.min(rows.length,15);i++){
    const r = rows[i]||[];
    const norm = r.map(c=>String(c||'').trim().toUpperCase());
    if(norm.includes('BULAN')){ headerIdx = i; header = norm; break; }
  }
  if(headerIdx===-1) throw new Error('Format tidak dikenali: header "Bulan" tidak ditemukan.');
  const iBulan = header.indexOf('BULAN');
  const colIdx = {};
  SOURCE_KPI_COLUMNS.forEach(c=>{ colIdx[c.key] = header.findIndex(c.match); });
  if(Object.values(colIdx).every(i=>i===-1)) throw new Error('Tidak ada kolom indikator KPI (DSL, AWT, Net profit, NEMS, dst) yang dikenali.');
  const y = latestYMD().y || (new Date().getFullYear());
  const out = [];
  for(let i=headerIdx+1;i<rows.length;i++){
    const row = rows[i]; if(!row) continue;
    const bulanRaw = String(row[iBulan]||'').trim().toUpperCase();
    const m = TRAFFIC_MONTH_MAP[bulanRaw];
    if(!m) continue;
    const rec = {y, m};
    SOURCE_KPI_COLUMNS.forEach(c=>{
      const idx = colIdx[c.key];
      const raw = idx===-1 ? null : row[idx];
      rec[c.key] = (raw===undefined||raw===null||raw==='') ? null : toNum(raw);
    });
    out.push(rec);
  }
  if(!out.length) throw new Error('Tidak ada baris bulan yang valid ditemukan di file ini.');
  return out;
}
function mergeSourceKpi(rows){
  const touched = new Set(rows.map(r=>r.y+'-'+r.m));
  STATE.sourceKpi = (STATE.sourceKpi||[]).filter(r=>!touched.has(r.y+'-'+r.m)).concat(rows);
}

// ---- KPI Bobot & Indikator per Role (matrix upload, format sama seperti KPI.xlsx) ----
// Baris header: No, KPI, Budget, lalu kolom per role (SM, DSM Commercial, DSM Front, DSM Back, Tl com,
// Tl Project, Tl Cashier, Tl CS&PND, Tl WH, Tl Admin, PnD, CS, WH, Admin). Isi tiap sel kolom role = bobot (0-1).
async function parseKpiMatrixFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1});
  let headerIdx = -1, header = null;
  for(let i=0;i<Math.min(rows.length,10);i++){
    const r = rows[i]||[];
    const norm = r.map(c=>String(c||'').trim().toUpperCase());
    if(norm.includes('KPI') && norm.includes('BUDGET')){ headerIdx = i; header = norm; break; }
  }
  if(headerIdx===-1) throw new Error('Format tidak dikenali: header "KPI" &amp; "Budget" tidak ditemukan.');
  const iKpi = header.indexOf('KPI');
  const iBudget = header.indexOf('BUDGET');
  const roleColIdx = {};
  header.forEach((h,idx)=>{
    const normH = h.replace(/\s+/g,' ').trim();
    const rk = KPI_ROLE_HEADER_ALIASES[normH];
    if(rk) roleColIdx[rk] = idx;
  });
  if(!Object.keys(roleColIdx).length) throw new Error('Tidak ada kolom role (SM, DSM Commercial, dst) yang dikenali di file ini.');
  const matrix = {}; KPI_STORE_ROLE_ORDER.forEach(rk=>matrix[rk]=[]);
  let skippedLabels = [];
  for(let i=headerIdx+1;i<rows.length;i++){
    const row = rows[i]; if(!row) continue;
    const kpiLabelRaw = row[iKpi]; if(!kpiLabelRaw) continue;
    const kpiLabel = String(kpiLabelRaw).trim();
    if(kpiLabel.toUpperCase()==='TOTAL') continue;
    const labelUpper = kpiLabel.toUpperCase();
    const def = KPI_INDICATOR_DEFS.find(d=>d.match(labelUpper));
    if(!def){ skippedLabels.push(kpiLabel); continue; }
    const budgetRaw = row[iBudget];
    const budgetNum = toNum(budgetRaw);
    const budget = (budgetNum!=null && budgetNum>0) ? budgetNum : def.defaultBudget;
    Object.entries(roleColIdx).forEach(([rk, colIdx])=>{
      const w = toNum(row[colIdx]);
      if(w!=null && w>0){
        matrix[rk].push({ key:def.key, label:kpiLabel, budget, bobot:w, source:def.source, field:def.field });
      }
    });
  }
  const hasAny = KPI_STORE_ROLE_ORDER.some(rk=>matrix[rk].length>0);
  if(!hasAny) throw new Error('Tidak ada baris indikator KPI yang valid ditemukan di file ini.');
  return { matrix, skippedLabels };
}

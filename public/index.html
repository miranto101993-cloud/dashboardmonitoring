        return cell(cls, b, tot).replace('<td class="num"','<td class="num" style="font-weight:700;"').replace(/<td class="num" style="font-weight:700;" style="/,'<td class="num" style="font-weight:700;');
      }).join('')}<td class="num"><b>${mode==='qty'?fmtNum(totalQty):fmtRp(totalValue)}</b></td></tr>`;
      tbl.innerHTML = `<thead><tr><th>Kategori</th><th class="num">SKU / Qty</th>${head}<th class="num">${totCol}</th></tr></thead><tbody>${rows}${totRow}</tbody>`;
    }
    draw();
    document.querySelectorAll('#inv-cat-mode button').forEach(btn=>btn.addEventListener('click', ()=>{
      mode = btn.dataset.m;
      document.querySelectorAll('#inv-cat-mode button').forEach(x=>x.classList.toggle('active', x===btn));
      draw();
    }));
  })();

  // 3. Detail SKU/Item Retail — search + pagination (semua item retail dari sqvItems)
  const skuAll = [...STATE.sqvItems].sort((a,b)=>b.value-a.value);
  let skuFiltered = skuAll, skuShown = 100;
  function renderSkuRows(){
    document.getElementById('inv-sku-tbody').innerHTML = skuFiltered.slice(0, skuShown).map(it=>{
      const dcMap = STATE.dcByItem[it.item] || {};
      return `<tr>
        <td>${it.item}</td>
        <td title="${it.itemName}" style="max-width:240px;overflow:hidden;text-overflow:ellipsis;">${it.itemName}</td>
        <td>${it.cat}</td>
        <td>${invClsPill(it.cls)}</td>
        <td class="num">${fmtNum(it.qty)}</td>
        <td class="num">${fmtRp(it.value)}</td>
        ${dcSiteList().map(s=>`<td class="num">${fmtNum(dcMap[s]||0)}</td>`).join('')}
      </tr>`;
    }).join('');
    document.getElementById('inv-sku-load-more').style.display = skuShown < skuFiltered.length ? 'block' : 'none';
  }
  renderSkuRows();
  document.getElementById('inv-sku-load-more').querySelector('button').addEventListener('click', ()=>{ skuShown+=100; renderSkuRows(); });
  document.getElementById('inv-sku-search').addEventListener('input', e=>{
    const f = e.target.value.toLowerCase();
    skuFiltered = skuAll.filter(it=>(it.item||'').toLowerCase().includes(f) || (it.itemName||'').toLowerCase().includes(f) || (it.cat||'').toLowerCase().includes(f));
    skuShown = 100; renderSkuRows();
  });

  setPeriodLabel(`Stock snapshot terkini · Sales ranking: YTD ${curYear}`);
};

// ============================================================
// EXPORT DATA (.xlsx) — multi-sheet export of current underlying data
// ============================================================
function exportDataXLSX(){
  const latest = latestYM();
  const curYear = latest.y || 2026;
  const lyYear = curYear - 1;
  const months = availableMonths(curYear);
  const curYms = months.map(m=>({y:curYear,m}));
  const lyYms = months.map(m=>({y:lyYear,m}));

  const wb = XLSX.utils.book_new();

  // Sheet 1: YTD Summary by Category/Zona
  const ytd = buildPeriodData(curYms, lyYms, months, null, null);
  const ytdSheet = ytd.detail.map(d=>({
    Zona:d.zona, Kategori:d.cat, Budget:d.budgetToko, Sales:d.sales, 'Sales LY':d.salesLY, 'Growth %':+(d.growth*100).toFixed(2),
    'Achievement %':+(d.achievement*100).toFixed(2), 'Budget PB':d.budgetPB, 'PB+EB Sales':d.pbSales,
    'PB+EB Growth %':+(d.pbGrowth*100).toFixed(2), 'PB+EB Ach %':+(d.pbAchievement*100).toFixed(2), Inventory:d.invValue,
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ytdSheet), 'YTD by Kategori-Zona');

  // Sheet 2: Master Brand detail (grouped by Kategori + Master Brand only)
  const brandRows = queryBrand(curYms, lyYms, {}).map(r=>({
    Kategori:r.cat, 'Master Brand':r.brand,
    Budget:Math.round(r.budget), Sales:r.sales, Qty:r.qty, 'Sales LY':r.salesLY,
    'Growth %':+(r.growth*100).toFixed(2), 'Achievement %':+(r.achievement*100).toFixed(2),
    'Inventory Value':r.invValue, 'Inventory Qty':r.invQty,
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(brandRows), 'By Master Brand');

  // Sheet 3: Item detail (all items) with per-DC stock columns
  const dcSites = dcSiteList();
  const itemRows = queryItems(curYms, lyYms, {}).map(r=>{
    const row = {
      Kategori:r.cat, 'Master Brand':r.masterBrand, Brand:r.brand, 'Item No':r.item, 'Item Name':r.name,
      Sales:r.sales, Qty:r.qty, 'Sales LY':r.salesLY, 'Growth %':+(r.growth*100).toFixed(2),
      Class:invClsNorm(r.cls)||'', 'Inventory Value':r.invValue, 'Inventory Qty':r.invQty,
    };
    dcSites.forEach(s=>{ row['Stock '+s] = r.dcByPlace[s]||0; });
    return row;
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(itemRows), 'By Item');

  // Sheet 4: Salesperson
  const spData = querySalesperson(curYms, lyYms, null);
  const spRows = spData.byZona.map(r=>({
    'Salesperson Name':r.spName, Zona:r.zona, Sales:r.amt, 'Sales LY':r.salesLY,
    'Growth %':+(r.growth*100).toFixed(2), 'PB+EB Sales':r.pbAmt,
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(spRows), 'Sales Person by Zona');

  // Sheet 5: Ticket Size
  const tkRows = queryTicketSize(curYms).map(r=>({
    Tier:r.tier, 'Jumlah Nota':r.count, 'Total Value':r.totalValue, 'Avg Value':Math.round(r.avgValue),
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(tkRows), 'Ticket Size');

  // Sheet 5b: Traffic, Invoice, Efektivitas Traffic & Basket Size (YTD, apple-to-apple)
  const tkFull = queryTicketSize(curYms, lyYms);
  const tkTotalTx = tkFull.reduce((a,r)=>a+r.count,0);
  const tkTotalVal = tkFull.filter(r=>r.tier!=='Return').reduce((a,r)=>a+r.totalValue,0);
  const tkTotalTxLY = tkFull.reduce((a,r)=>a+r.countLY,0);
  const tkTotalValLY = tkFull.filter(r=>r.tier!=='Return').reduce((a,r)=>a+r.totalValueLY,0);
  // Basket Size numerator must match Invoice's basis (all Receipt No incl. return) — use all-tier value.
  const tkTotalValAllTier = tkFull.reduce((a,r)=>a+r.totalValue,0);
  const tkTotalValLYAllTier = tkFull.reduce((a,r)=>a+r.totalValueLY,0);
  const tkReturn = tkFull.find(r=>r.tier==='Return');
  const tkNonReturn = tkTotalTx - (tkReturn?tkReturn.count:0);
  const tkNonReturnLY = tkTotalTxLY - (tkReturn?tkReturn.countLY:0);
  const trfExp = queryTraffic(curYms, lyYms);
  const trafficExportMetrics = [
    {Metrik:'Traffic', Budget:Math.round(trfExp.budget), 'Actual TY':trfExp.actual, LY:trfExp.ly},
    {Metrik:'Invoice', Budget:Math.round(trfExp.budgetInvoice||0), 'Actual TY':tkTotalTx, LY:tkTotalTxLY},
    {Metrik:'Efektivitas Traffic (%)', Budget:+((trfExp.budgetEffTraffic||0)*100).toFixed(2), 'Actual TY':+(safeDiv(tkTotalTx,trfExp.actual)*100).toFixed(2), LY:+(safeDiv(tkTotalTxLY,trfExp.ly)*100).toFixed(2)},
    {Metrik:'Basket Size', Budget:Math.round(trfExp.budgetBasketSize||0), 'Actual TY':Math.round(safeDiv(tkTotalValAllTier,tkTotalTx)), LY:Math.round(safeDiv(tkTotalValLYAllTier,tkTotalTxLY))},
  ].map(r=>({...r, 'Achieve %': r.Budget!=='' ? +(safeDiv(r['Actual TY'],r.Budget)*100).toFixed(2) : '',
    'Diff Budget': r.Budget!=='' ? Math.round(r['Actual TY']-r.Budget) : '',
    'Growth %': +(safeDiv(r['Actual TY']-r.LY, r.LY)*100).toFixed(2),
    'Diff LY': Math.round((r['Actual TY']-r.LY)*100)/100 }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(trafficExportMetrics), 'Traffic-Invoice-Basket');

  // Sheet 6: Source Type
  const srcRows = querySourceType(curYms, lyYms, months).map(r=>({
    'Source Type':r.source, Sales:r.sales, 'Sales LY':r.salesLY, 'Growth %':+(r.growth*100).toFixed(2),
    'Kontribusi %':+(r.kontribusi*100).toFixed(2), Invoice:r.invoice, Budget:Math.round(r.budget),
    'Achievement %':+(r.achievement*100).toFixed(2), 'Budget Estimate':r.isEstimate?'Ya':'Tidak',
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(srcRows), 'Source Type');

  // Sheet 7: Inventory by Class
  const clsRows = queryInventoryByClass().map(r=>({ Class:r.label, Value:r.value, '% Value':+(r.pctValue*100).toFixed(2), Qty:r.qty, '% Qty':+(r.pctQty*100).toFixed(2), 'Jumlah Item':r.itemCount, '% Item':+(r.pctItem*100).toFixed(2) }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(clsRows), 'Inventory by Class');

  // Sheet 8: Inventory by Category
  const catRows = queryInventoryByCategory().map(r=>({ Kategori:r.cat, Value:r.value, Qty:r.qty }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(catRows), 'Inventory by Category');

  // Sheet 9: Stock DC
  const dcRows = STATE.dcBySite.map(r=>({ DC:r.site, 'On Hand':r.onHand, Available:r.available }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dcRows), 'Stock DC');

  const dateStr = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `Retail_Pulse_Export_${dateStr}.xlsx`);
}

function beltPill(pos){
  if(!pos) return '<span style="color:var(--ink-soft)">-</span>';
  const c = BELT_COLOR[pos] || ['#EFEDE6','#5B645F'];
  return `<span style="display:inline-block;padding:2px 9px;border-radius:100px;font-size:11.5px;font-weight:700;background:${c[0]};color:${c[1]};white-space:nowrap;">${pos}</span>`;
}
function beltRank(pos){ const i = BELT_ORDER.indexOf(pos); return i===-1 ? 99 : i; }
function beltAvg(arr, f){ const v = arr.map(f).filter(x=>x!==null && x!==undefined && isFinite(x)); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; }
function beltFmt(v){ return (v===null||v===undefined||!isFinite(v)) ? '-' : v.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function beltFmtDate(s){ const m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? (+m[3])+' '+MONTH_NAMES[+m[2]-1]+' '+m[1] : '-'; }
function beltPosCounts(rows){ const m = {}; rows.forEach(r=>{ if(r.pos) m[r.pos]=(m[r.pos]||0)+1; }); return m; }
function beltPosList(rows){ // BELT_ORDER dulu, lalu posisi tak dikenal (jika ada)
  const present = new Set(rows.map(r=>r.pos).filter(Boolean));
  return [...BELT_ORDER.filter(p=>present.has(p)), ...[...present].filter(p=>!BELT_ORDER.includes(p)).sort()];
}
function beltPosChart(id, rows){
  const list = beltPosList(rows); const cnt = beltPosCounts(rows);
  mkChart(id, { type:'bar', data:{ labels:list, datasets:[{ label:'Jumlah', data:list.map(p=>cnt[p]||0),
      backgroundColor:list.map(p=>(BELT_COLOR[p]||['#A6A198'])[0]), borderRadius:4 }] },
    options:{ responsive:true, plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true, ticks:{precision:0}, grid:{color:'#EEEAE0'}}, x:{grid:{display:false}} } } });
}
function beltEmptyBox(msg){ return `<div class="footnote-box">${msg}</div>`; }
function beltTotalsHtml(rows){
  const cnt = beltPosCounts(rows), n = rows.length, known = Object.keys(cnt).reduce((a,k)=>a+cnt[k],0);
  const list = BELT_ORDER.concat(Object.keys(cnt).filter(k=>!BELT_ORDER.includes(k)));
  const card = (label, v) => `<div class="kpi-card"><div class="kpi-label">${label}</div><div class="kpi-value">${fmtNum(v)}</div><div class="kpi-sub"><span style="color:var(--ink-soft)">${fmtPct(n?v/n:0)}</span></div></div>`;
  return `<div class="panel-title" style="font-size:13px;margin:4px 0 8px;">Total per Belting Position</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin:0 0 16px;">
      <div class="kpi-card"><div class="kpi-label">Total Belting</div><div class="kpi-value">${fmtNum(n)}</div><div class="kpi-sub"><span style="color:var(--ink-soft)">100%</span></div></div>
      ${list.map(p=>card(beltPill(p), cnt[p]||0)).join('')}${n-known>0 ? card('<span style="color:var(--ink-soft)">Belum ada posisi</span>', n-known) : ''}
    </div>`;
}

RENDERERS.belting = function(container){
  const ui = STATE.beltingUi;
  container.innerHTML = `

      </div>
    </div>

  const body = container.querySelector('#belt-body');

    draw();
  }));
  function draw(){ (ui.view==='internal' ? drawInternal : drawPB)(); }

  // ---------- BELTING INTERNAL ----------
  function drawInternal(){
    const all = STATE.beltingInternal || [];
    if(!all.length){ body.innerHTML = beltEmptyBox('Belum ada data Belting Internal. Upload lewat menu <b>Upload Data → Belting</b> (1 file, sheet \'Belting Internal\').'); setPeriodLabel('Belting Internal'); return; }
    const sections = [...new Set(all.map(r=>r.section).filter(Boolean))].sort();
    if(ui.section && !sections.includes(ui.section)) ui.section = '';
    const bySection = all.filter(r=>!ui.section || r.section===ui.section);
    const jobCnt = {}; bySection.forEach(r=>{ jobCnt[r.job]=(jobCnt[r.job]||0)+1; });
    const jobs = Object.keys(jobCnt).sort((a,b)=>jobCnt[b]-jobCnt[a] || a.localeCompare(b));
    if(ui.job && !jobs.includes(ui.job)) ui.job = '';
    const rows = bySection.filter(r=>!ui.job || r.job===ui.job)
      .slice().sort((a,b)=>beltRank(a.pos)-beltRank(b.pos) || a.name.localeCompare(b.name));
    const posCnt = beltPosCounts(rows);
    const topPos = Object.keys(posCnt).sort((a,b)=>posCnt[b]-posCnt[a] || beltRank(a)-beltRank(b))[0];

    body.innerHTML = `
      <div class="filter-bar" style="align-items:flex-start;">
        <div class="filter-group"><label>Section</label>
          <select id="belt-section"><option value="">Semua Section</option>${sections.map(s=>`<option value="${s}" ${s===ui.section?'selected':''}>${s}</option>`).join('')}</select>
        </div>
        <div class="filter-group" style="flex:1;min-width:260px;"><label>Current Job Title</label>
          <div style="display:flex;flex-wrap:wrap;gap:6px;" id="belt-job-chips">
            <button type="button" class="chip ${!ui.job?'active':''}" data-job="">Semua (${bySection.length})</button>
            ${jobs.map(j=>`<button type="button" class="chip ${j===ui.job?'active':''}" data-job="${j.replace(/"/g,'&quot;')}">${j} (${jobCnt[j]})</button>`).join('')}
          </div>
        </div>
      </div>
      ${beltTotalsHtml(rows)}
      <div class="kpi-row">
        <div class="kpi-card"><div class="kpi-label">Jumlah Karyawan</div><div class="kpi-value">${rows.length}</div>
          <div class="kpi-sub"><span style="color:var(--ink-soft)">${ui.job||'Semua Job Title'}${ui.section?' · '+ui.section:''}</span></div></div>
        <div class="kpi-card"><div class="kpi-label">Rata-rata Competency</div><div class="kpi-value">${beltFmt(beltAvg(rows,r=>r.comp))}</div>
          <div class="kpi-sub"><span style="color:var(--ink-soft)">360: ${beltFmt(beltAvg(rows,r=>r.s360))} · Technical: ${beltFmt(beltAvg(rows,r=>r.tech))}</span></div></div>
        <div class="kpi-card"><div class="kpi-label">Rata-rata Performance</div><div class="kpi-value">${beltFmt(beltAvg(rows,r=>r.perf))}</div></div>
        <div class="kpi-card"><div class="kpi-label">Posisi Terbanyak</div><div class="kpi-value" style="font-size:22px;">${topPos?beltPill(topPos):'-'}</div>
          <div class="kpi-sub"><span style="color:var(--ink-soft)">${topPos?posCnt[topPos]+' karyawan':''}</span></div></div>
      </div>
      <div class="grid-2b">
        <div class="panel"><div class="panel-head"><div class="panel-title">Distribusi Belting Position</div></div>
          <div class="chart-wrap"><canvas id="belt-int-pos" height="230"></canvas></div></div>
        <div class="panel"><div class="panel-head"><div class="panel-title">Rata-rata Skor per Current Job Title</div>
          <div class="panel-note">Mengikuti filter Section</div></div>
          <div class="chart-wrap"><canvas id="belt-int-job" height="230"></canvas></div></div>
      </div>
      <div class="panel"><div class="panel-head"><div class="panel-title">Detail Belting Internal</div></div>
        <div class="tbl-scroll"><table>
          <thead><tr><th>No</th><th>Employee Name</th><th>Employee ID</th><th>Section</th><th>Current Job Title</th><th>Join Date</th>
            <th class="num">360 Degree</th><th class="num">Technical-course</th><th class="num">Competency</th><th class="num">Performance</th><th>Belting Position</th></tr></thead>
          <tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><b>${r.name}</b></td><td>${r.id||'-'}</td><td>${r.section||'-'}</td><td>${r.job||'-'}</td>
            <td>${beltFmtDate(r.join)}</td><td class="num">${beltFmt(r.s360)}</td><td class="num">${beltFmt(r.tech)}</td>
            <td class="num">${beltFmt(r.comp)}</td><td class="num">${beltFmt(r.perf)}</td><td>${beltPill(r.pos)}</td></tr>`).join('')}</tbody>
        </table></div></div>`;
    body.querySelector('#belt-section').addEventListener('change', e=>{ ui.section = e.target.value; ui.job=''; drawInternal(); });
    body.querySelectorAll('#belt-job-chips .chip').forEach(b=>b.addEventListener('click', ()=>{ ui.job = b.dataset.job; drawInternal(); }));
    beltPosChart('belt-int-pos', rows);
    mkChart('belt-int-job', { type:'bar', data:{ labels:jobs, datasets:[
        {label:'Competency', data:jobs.map(j=>beltAvg(bySection.filter(r=>r.job===j), r=>r.comp)), backgroundColor:'#2B4C5C', borderRadius:3},
        {label:'Performance', data:jobs.map(j=>beltAvg(bySection.filter(r=>r.job===j), r=>r.perf)), backgroundColor:'#D9720B', borderRadius:3},
      ]}, options:{ indexAxis:'y', responsive:true, plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}}, tooltip:{callbacks:{label:c=>c.dataset.label+': '+beltFmt(c.parsed.x)}}},
        scales:{ x:{beginAtZero:true, grid:{color:'#EEEAE0'}}, y:{grid:{display:false}, ticks:{font:{size:10}}} } } });
    setPeriodLabel('Belting Internal'+(ui.job?' · '+ui.job:'')+(ui.section?' · '+ui.section:''));
  }

  // ---------- BELTING PRIVATE BRAND ----------
  function drawPB(){
    const all = STATE.beltingPB || [];
    if(!all.length){ body.innerHTML = beltEmptyBox('Belum ada data Belting Private Brand. Upload lewat menu <b>Upload Data → Belting</b> (1 file, sheet \'Belting Private Brand\').'); setPeriodLabel('Belting Private Brand'); return; }
    const pmap = new Map(); all.forEach(r=>{ if(!pmap.has(r.period)) pmap.set(r.period,{period:r.period,label:r.pLabel,key:r.pKey}); });
    const periods = [...pmap.values()].sort((a,b)=>a.key-b.key); // kronologis
    if(!ui.pbPeriod || !pmap.has(ui.pbPeriod)) ui.pbPeriod = periods[periods.length-1].period; // default: periode terbaru
    const cur = pmap.get(ui.pbPeriod);
    const idx = periods.findIndex(p=>p.period===ui.pbPeriod);
    const prev = idx>0 ? periods[idx-1] : null;
    const rowsOf = p => all.filter(r=>r.period===p.period);
    const rows = rowsOf(cur).slice().sort((a,b)=>beltRank(a.pos)-beltRank(b.pos) || (b.perf||0)-(a.perf||0) || a.name.localeCompare(b.name));
    const prevRows = prev ? rowsOf(prev) : null;
    const showExtra = rows.some(r=>r.s360!==null || r.tech!==null);
    const posCnt = beltPosCounts(rows);
    function delta(curV, prevV){
      if(curV===null || prevV===null || prevV===undefined) return '';
      const d = curV - prevV; const cls = d>0.005?'good':(d<-0.005?'bad':'neutral');
      return `<span class="pill ${cls}">${d>0?'▲':d<0?'▼':'▬'} ${d>0?'+':''}${beltFmt(d)}</span><span style="color:var(--ink-soft)">vs ${prev.label}</span>`;
    }
    const avgComp = beltAvg(rows,r=>r.comp), avgPerf = beltAvg(rows,r=>r.perf), avgLms = beltAvg(rows,r=>r.lms);

    // Progres per karyawan lintas periode (kunci = nama)
    const people = new Map();
    all.forEach(r=>{ const k = r.name.toLowerCase(); if(!people.has(k)) people.set(k,{name:r.name, id:r.id, byPeriod:{}}); const p = people.get(k); if(r.id && !p.id) p.id = r.id; p.byPeriod[r.period] = r; });
    const lastP = periods[periods.length-1];
    const progress = [...people.values()].map(p=>{
      const seq = periods.filter(pp=>p.byPeriod[pp.period]);
      const first = seq.length ? p.byPeriod[seq[0].period] : null, last = seq.length ? p.byPeriod[seq[seq.length-1].period] : null;
      let trend = '';
      if(seq.length>1){ const d = beltRank(first.pos) - beltRank(last.pos); trend = d>0 ? '<span class="pill good">▲ Naik</span>' : d<0 ? '<span class="pill bad">▼ Turun</span>' : '<span class="pill neutral">▬ Tetap</span>'; }
      else trend = '<span style="color:var(--ink-soft)">-</span>';
      return {...p, last, trend};
    }).sort((a,b)=>beltRank(a.last?a.last.pos:'')-beltRank(b.last?b.last.pos:'') || a.name.localeCompare(b.name));

    body.innerHTML = `
      <div class="filter-bar">
        <div class="filter-group" style="flex:1;"><label>Periode Belting</label>
          <div style="display:flex;flex-wrap:wrap;gap:6px;" id="belt-pb-periods">
            ${periods.slice().reverse().map(p=>`<button type="button" class="chip ${p.period===ui.pbPeriod?'active':''}" data-p="${p.period.replace(/"/g,'&quot;')}">${p.label} (${rowsOf(p).length})</button>`).join('')}
          </div>
        </div>
      </div>
      ${beltTotalsHtml(rows)}
      <div class="kpi-row">
        <div class="kpi-card"><div class="kpi-label">Peserta Belting</div><div class="kpi-value">${rows.length}</div>
          <div class="kpi-sub"><span style="color:var(--ink-soft)">${cur.label}${prev?' · '+prev.label+': '+prevRows.length:''}</span></div></div>
        <div class="kpi-card"><div class="kpi-label">Rata-rata Competency</div><div class="kpi-value">${beltFmt(avgComp)}</div>
          <div class="kpi-sub">${delta(avgComp, prevRows?beltAvg(prevRows,r=>r.comp):null)}</div></div>
        <div class="kpi-card"><div class="kpi-label">Rata-rata Performance</div><div class="kpi-value">${beltFmt(avgPerf)}</div>
          <div class="kpi-sub">${delta(avgPerf, prevRows?beltAvg(prevRows,r=>r.perf):null)}</div></div>
        <div class="kpi-card"><div class="kpi-label">Posisi Gold</div><div class="kpi-value">${posCnt.Gold||0}</div>
          <div class="kpi-sub"><span style="color:var(--ink-soft)">${prevRows?prev.label+': '+(beltPosCounts(prevRows).Gold||0):'dari '+rows.length+' peserta'}</span></div></div>
      </div>
      <div class="grid-2b">
        <div class="panel"><div class="panel-head"><div class="panel-title">Distribusi Belting Position — ${cur.label}</div></div>
          <div class="chart-wrap"><canvas id="belt-pb-pos" height="230"></canvas></div></div>
        <div class="panel"><div class="panel-head"><div class="panel-title">Trend Rata-rata Skor per Periode</div></div>
          <div class="chart-wrap"><canvas id="belt-pb-trend" height="230"></canvas></div></div>
      </div>
      <div class="panel"><div class="panel-head"><div class="panel-title">Detail Belting Private Brand — ${cur.label}</div></div>
        <div class="tbl-scroll"><table>
          <thead><tr><th>No</th><th>Employee Name</th><th>Employee ID</th><th>Location</th><th>Current Job Title</th><th>Join Date</th>
            <th class="num">LMS Learning Path</th>${showExtra?'<th class="num">360 Degree</th><th class="num">Technical</th>':''}<th class="num">Competency</th><th class="num">Performance</th><th>Belting Position</th></tr></thead>
          <tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><b>${r.name}</b></td><td>${r.id||'-'}</td><td>${r.location||'-'}</td><td>${r.job||'-'}</td>
            <td>${beltFmtDate(r.join)}</td><td class="num">${beltFmt(r.lms)}</td>${showExtra?`<td class="num">${beltFmt(r.s360)}</td><td class="num">${beltFmt(r.tech)}</td>`:''}
            <td class="num">${beltFmt(r.comp)}</td><td class="num">${beltFmt(r.perf)}</td><td>${beltPill(r.pos)}</td></tr>`).join('')}</tbody>
        </table></div></div>
      <div class="panel"><div class="panel-head"><div class="panel-title">Progres Belting per Karyawan</div>
        <div class="panel-note">Posisi belting tiap periode (kronologis). Tren membandingkan periode pertama vs terakhir yang diikuti.</div></div>
        <div class="tbl-scroll"><table>
          <thead><tr><th>Employee Name</th>${periods.map(p=>`<th>${p.label}</th>`).join('')}<th>Tren</th></tr></thead>
          <tbody>${progress.map(p=>`<tr><td><b>${p.name}</b></td>${periods.map(pp=>`<td>${p.byPeriod[pp.period]?beltPill(p.byPeriod[pp.period].pos):'<span style="color:var(--ink-soft)">-</span>'}</td>`).join('')}<td>${p.trend}</td></tr>`).join('')}</tbody>
        </table></div></div>`;
    body.querySelectorAll('#belt-pb-periods .chip').forEach(b=>b.addEventListener('click', ()=>{ ui.pbPeriod = b.dataset.p; drawPB(); }));
    beltPosChart('belt-pb-pos', rows);
    const lineDs = (label, f, color)=>({label, data:periods.map(p=>beltAvg(rowsOf(p), f)), borderColor:color, backgroundColor:color, borderWidth:2, pointRadius:4, tension:0.25, spanGaps:true});
    mkChart('belt-pb-trend', { type:'line', data:{ labels:periods.map(p=>p.label), datasets:[
        lineDs('LMS Learning Path', r=>r.lms, '#9A937C'), lineDs('Competency', r=>r.comp, '#2B4C5C'), lineDs('Performance', r=>r.perf, '#D9720B') ]},
      options:{ responsive:true, interaction:{mode:'index',intersect:false}, plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}}, tooltip:{callbacks:{label:c=>c.dataset.label+': '+beltFmt(c.parsed.y)}}},
        scales:{ y:{beginAtZero:true, grid:{color:'#EEEAE0'}}, x:{grid:{display:false}} } } });
    setPeriodLabel('Belting Private Brand · '+cur.label);
  }
  draw();
};

      renderKpiStoreBody(document.getElementById('kpi-store-body'), STATE.selectedKpiRole);
    });
  });
  renderKpiStoreBody(document.getElementById('kpi-store-body'), STATE.selectedKpiRole);
};

const FEAT_ZONAS = ['Zona 1','Zona 2','Zona 3','Zona 4','Zona Lainnya'];
function fDate(iso){ const m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? (+m[3])+' '+MONTH_NAMES[+m[2]-1]+' '+m[1] : '-'; }
function ageDays(iso){ const t = Date.parse(String(iso||'')+'T00:00:00'); return isNaN(t) ? null : Math.floor((Date.now()-t)/86400000); }
function freshPill(iso, okD, warnD){
  const a = ageDays(iso); if(a===null) return '<span class="pill neutral">Belum ada info</span>';
  return a<=okD ? '<span class="pill good">Terkini</span>' : a<=warnD ? `<span class="pill warn">Perlu update · ${a} hari</span>` : `<span class="pill bad">Usang · ${a} hari</span>`;
}
function fSum(rows, f){ let t=0; for(const r of rows) t+=f(r); return t; }
function gMonth(def){ const g = STATE.gUi && STATE.gUi.month; return (g && g<=def) ? g : def; }
function gZona(){ const z = STATE.gUi && STATE.gUi.zona; return ['Zona 1','Zona 2','Zona 3','Zona 4'].includes(z) ? z : ''; }

}

// ---------------- DATA HEALTH ----------------
function computeHealth(){
  const L = latestYMD(), cy = L.y, months = availableMonths(cy), out = {sources:[], months:[], checks:[], warnings:[]};
  const meta = STATE.dataMeta || {};
  // 1) Sumber data
  const lastTraffic = (()=>{ let best=''; STATE.trafficFact.forEach(r=>{ if(r.y===cy && r.actual>0){ const k = r.y+'-'+String(r.m).padStart(2,'0')+'-'+String(r.d).padStart(2,'0'); if(k>best) best=k; } }); return best; })();
  const salesTo = (meta.sales && meta.sales.to) || (L.y+'-'+String(L.m).padStart(2,'0')+'-'+String(L.d||1).padStart(2,'0'));
  out.sources = [
    {name:'Sales (SDS CSV)', last:salesTo, lastLabel:'Data s/d '+fDate(salesTo), rows:fmtNum(STATE.salesFact.length)+' baris harian · '+fmtNum(STATE.notaFact.length)+' nota', up:meta.sales&&meta.sales.uploadedAt, pill:freshPill(salesTo,3,7), file:meta.sales&&meta.sales.file},
    {name:'TIEBS (Traffic)', last:lastTraffic, lastLabel:lastTraffic?'Actual s/d '+fDate(lastTraffic):'-', rows:fmtNum(STATE.trafficFact.length)+' baris', up:meta.traffic&&meta.traffic.uploadedAt, pill:freshPill(lastTraffic,3,7), file:meta.traffic&&meta.traffic.file},
    {name:'SQV (Stock Qty & Value)', last:meta.sqv&&meta.sqv.stockDate, lastLabel:meta.sqv?'Stok per '+fDate(meta.sqv.stockDate):'-', rows:fmtNum(STATE.sqvItems.length)+' item', up:meta.sqv&&meta.sqv.uploadedAt, pill:freshPill(meta.sqv&&meta.sqv.stockDate,7,14), file:meta.sqv&&meta.sqv.file},
    {name:'Stock DC (SCALE)', last:meta.dc&&meta.dc.reportDate, lastLabel:meta.dc?'Laporan '+fDate(meta.dc.reportDate):'-', rows:fmtNum(STATE.dcByItem.length)+' item · '+(STATE.dcSites||[]).length+' DC', up:meta.dc&&meta.dc.uploadedAt, pill:freshPill(meta.dc&&meta.dc.reportDate,7,14), file:meta.dc&&meta.dc.file},
    {name:'Budget Toko', last:'', lastLabel:fmtNum(new Set(STATE.budgetStoreFact.map(r=>r.m)).size)+' bulan ber-budget', rows:fmtNum(STATE.budgetStoreFact.length)+' baris', up:'', pill:'<span class="pill neutral">Data bawaan</span>', file:''},
    {name:'TL Mentor', last:'', lastLabel:fmtNum((STATE.tlMentor||[]).length)+' salesperson · '+new Set((STATE.tlMentor||[]).map(r=>r.tl)).size+' TL', rows:fmtNum((STATE.tlMentor||[]).length)+' baris', up:meta.salper&&meta.salper.uploadedAt, pill:'<span class="pill neutral">Dari file Database Salper</span>', file:meta.salper&&meta.salper.file},
    {name:'Belting', last:'', lastLabel:fmtNum(new Set((STATE.beltingPB||[]).map(r=>r.period)).size)+' periode PB · '+fmtNum((STATE.beltingInternal||[]).length)+' karyawan Internal', rows:'', up:'', pill:'<span class="pill neutral">Data bawaan</span>', file:''},
  ];
  // 2) Kelengkapan sales per bulan
  const act = new Map(), actLY = new Map();
  STATE.notaFact.forEach(r=>{ const mp = r.y===cy ? act : r.y===cy-1 ? actLY : null; if(!mp) return; if(!mp.has(r.m)) mp.set(r.m,{inv:0,days:new Set()}); const o = mp.get(r.m); o.inv++; o.days.add(r.d); });
  const salesBy = new Map(), salesByLY = new Map();
  STATE.salesFact.forEach(r=>{ const mp = r.y===cy ? salesBy : r.y===cy-1 ? salesByLY : null; if(!mp) return; if(r.d>effectiveCutoffDay(cy,r.m)) return; mp.set(r.m,(mp.get(r.m)||0)+r.amt); });
  const ipds = months.map(m=>{ const o = act.get(m); return o && o.days.size ? o.inv/o.days.size : 0; });
  const med = a=>{ const s=[...a].sort((x,y)=>x-y); return s.length ? s[Math.floor(s.length/2)] : 0; };
  out.months = months.map((m,i)=>{
    const o = act.get(m) || {inv:0,days:new Set()}, cut = effectiveCutoffDay(cy,m), dim = daysInMonth(cy,m);
    const missing = []; for(let d=1; d<=cut; d++) if(!o.days.has(d)) missing.push(d);
    const maxDay = o.days.size ? Math.max(...o.days) : 0, ipd = ipds[i], others = ipds.filter((_,j)=>j!==i), medv = med(others);
    const issues = [];
    if(medv>0 && ipd < 0.7*medv) issues.push('Invoice/hari '+Math.round(ipd/medv*100)+'% dari median bulan lain');
    if(missing.length>3) issues.push(missing.length+' hari tanpa transaksi (tgl '+missing.join(', ')+') — libur panjang/Lebaran? pastikan bukan data hilang');
    if(m<L.m && maxDay < dim-1) issues.push('Data berakhir tgl '+maxDay+' (bulan '+dim+' hari)');
    const lyO = actLY.get(m);
    const row = {m, inv:o.inv, days:o.days.size, cut, ipd, missing, sales:salesBy.get(m)||0, invLY:lyO?lyO.inv:0, salesLY:salesByLY.get(m)||0, issues};
    if(issues.length) out.warnings.push(MONTH_NAMES[m-1]+' '+cy+': '+issues.join('; '));
    return row;
  });
  // 3) Rekonsiliasi (TY, bulan yang punya sales)
  const inScope = r=> r.y===cy && months.includes(r.m);
  const base = fSum(STATE.salesFact.filter(inScope), r=>r.amt);
  const chk = (name, val, note, tol)=>{ const diff = base ? (val-base)/base : 0, ok = Math.abs(diff) <= (tol||0.001); out.checks.push({name, base, val, diff, ok, note}); if(!ok) out.warnings.push('Rekonsiliasi: '+name+' selisih '+fmtPct(diff)); };
  chk('Nota (notaFact) vs Sales', fSum(STATE.notaFact.filter(inScope), r=>r.amt), 'Total nilai nota = total sales');
  chk('Sales Person (spFact) vs Sales', fSum(STATE.spFact.filter(inScope), r=>r.amt), 'Σ sales semua salesperson');
  chk('Source Type vs Sales', fSum(STATE.sourceFact.filter(inScope), r=>r.amt), 'Σ semua Source Type');
  if(STATE.sourceZonaFact.length) chk('Source × Zona vs Sales', fSum(STATE.sourceZonaFact.filter(inScope), r=>r.amt), 'Dasar Trend Sales by Zona di Source Type');
  chk('Master Brand (brandFact) vs Sales', fSum(STATE.brandFact.filter(inScope), r=>r.amt), 'Σ semua Master Brand');
  chk('Item (itemFact) vs Sales', fSum(STATE.itemFact.filter(inScope), r=>r.amt), 'Σ semua item', 0.002);
  if(STATE.notaCatFact.length) chk('Nota per Kategori vs Sales', fSum(STATE.notaCatFact.filter(inScope), r=>r.amt), 'Dasar filter Zona/Category di TIEBS');
  const hm = new Set(STATE.hourFact.filter(r=>r.y===cy).map(r=>r.m));
  if(hm.size){ const b2 = fSum(STATE.salesFact.filter(r=>r.y===cy && hm.has(r.m)), r=>r.amt), v2 = fSum(STATE.hourFact.filter(r=>r.y===cy), r=>r.amt), d2 = b2?(v2-b2)/b2:0, ok2 = Math.abs(d2)<=0.001;
    out.checks.push({name:'Penjualan per Jam vs Sales', base:b2, val:v2, diff:d2, ok:ok2, note:'Bulan dengan data jam: '+[...hm].sort((a,b)=>a-b).map(m=>MONTH_NAMES[m-1]).join(', ')}); if(!ok2) out.warnings.push('Rekonsiliasi: Penjualan per Jam selisih '+fmtPct(d2)); }
  const noBud = months.filter(m=>!STATE.budgetStoreFact.some(r=>r.m===m));
  out.checks.push({name:'Budget tersedia untuk semua bulan ber-sales', base:months.length, val:months.length-noBud.length, diff:null, ok:!noBud.length, note:noBud.length?'Tanpa budget: '+noBud.map(m=>MONTH_NAMES[m-1]).join(', '):'Semua bulan punya budget', count:true});
  if(noBud.length) out.warnings.push('Budget kosong untuk '+noBud.map(m=>MONTH_NAMES[m-1]).join(', '));
  const noTr = months.filter(m=>!STATE.trafficFact.some(r=>r.y===cy && r.m===m && r.actual>0));
  out.checks.push({name:'Traffic (TIEBS) tersedia untuk semua bulan ber-sales', base:months.length, val:months.length-noTr.length, diff:null, ok:!noTr.length, note:noTr.length?'Tanpa traffic: '+noTr.map(m=>MONTH_NAMES[m-1]).join(', '):'Semua bulan punya traffic', count:true});
  if(noTr.length) out.warnings.push('Traffic kosong untuk '+noTr.map(m=>MONTH_NAMES[m-1]).join(', '));
  // efektivitas > 100% (invoice > traffic) = indikasi salah input traffic
  const invDay = new Map(); STATE.notaFact.forEach(r=>{ if(r.y===cy){ const k = r.m+'-'+r.d; invDay.set(k,(invDay.get(k)||0)+1); } });
  let bad = 0; STATE.trafficFact.forEach(r=>{ if(r.y===cy && r.actual>0 && (invDay.get(r.m+'-'+r.d)||0) > r.actual) bad++; });
  out.checks.push({name:'Hari dengan Invoice > Traffic', base:0, val:bad, diff:null, ok:bad<=3, note:bad?'Cek input traffic pada hari tersebut':'Tidak ada anomali', count:true, badIsCount:true});
  if(bad>3) out.warnings.push(bad+' hari dengan Invoice > Traffic');
  const zl = fSum(STATE.salesFact.filter(r=>inScope(r) && catToZona(r.cat, r.m)==='Zona Lainnya'), r=>r.amt);
  out.checks.push({name:'Sales di "Zona Lainnya" (kategori belum dipetakan)', base, val:zl, diff:base?zl/base:0, ok:(base?zl/base:0)<=0.02, note:'Kategori belum masuk Zona 1–4; wajar jika kecil', share:true});
  if(base && zl/base>0.02) out.warnings.push('"Zona Lainnya" '+fmtPct(zl/base)+' dari sales');
  return out;
}
RENDERERS.health = function(container){
  const H = computeHealth();

// ---------------- PROYEKSI & RUN-RATE ----------------
function computeProjection(){
  const L = latestYMD(), cy = L.y, m0 = L.m, d0 = L.d || daysInMonth(cy,m0), dim = daysInMonth(cy,m0), rem = Math.max(0, dim-d0);
  const bud = trkSalesBudget(cy), sales = STATE.salesFact.filter(r=>r.y===cy), salesLY = STATE.salesFact.filter(r=>r.y===cy-1);
  const lyFull = new Set(salesLY.map(r=>r.m)).size===12; // growth FY hanya valid jika data LY lengkap 12 bulan
  const zonas = FEAT_ZONAS.filter(z=> sales.some(r=>catToZona(r.cat, r.m)===z) || bud.some(r=>r.s===z && r.value>0));
  const mk = (z)=>{
    const zs = r => z==='Total' || catToZona(r.cat, r.m)===z, zb = r => z==='Total' || r.s===z;
    const mtd = fSum(sales.filter(r=>zs(r)&&r.m===m0&&r.d<=d0), r=>r.amt), lyMTD = fSum(salesLY.filter(r=>zs(r)&&r.m===m0&&r.d<=d0), r=>r.amt);
    const ytd = fSum(sales.filter(r=>zs(r)&&(r.m<m0||(r.m===m0&&r.d<=d0))), r=>r.amt);
    const budMonth = fSum(bud.filter(r=>zb(r)&&r.m===m0), r=>r.value), budMTD = fSum(bud.filter(r=>zb(r)&&r.m===m0&&r.d<=d0), r=>r.value);
    const budFY = fSum(bud.filter(zb), r=>r.value), budYTD = fSum(bud.filter(r=>zb(r)&&(r.m<m0||(r.m===m0&&r.d<=d0))), r=>r.value);
    const achMTD = budMTD>0 ? mtd/budMTD : null, achYTD = budYTD>0 ? ytd/budYTD : null;
    const projM = rem===0 ? mtd : (achMTD!==null ? mtd + (budMonth-budMTD)*achMTD : null);
    const lyYTD = fSum(salesLY.filter(r=>zs(r)&&(r.m<m0||(r.m===m0&&r.d<=d0))), r=>r.amt), lyFY = fSum(salesLY.filter(zs), r=>r.amt), lyMonthFull = fSum(salesLY.filter(r=>zs(r)&&r.m===m0), r=>r.amt), gt = (STATE.projGrowthTarget||0)/100;
    const remMonths = (12-m0) + rem/dim, elapsed = (m0-1) + d0/dim;
    return {z, mtd, lyMTD, growthMTD: lyMTD>0 ? mtd/lyMTD-1 : null, diffBudMTD: mtd-budMTD, diffGrowMTD: mtd-lyMTD, diffBudYTD: ytd-budYTD, diffGrowYTD: ytd-lyYTD, budMonth, budMTD, achMTD, projM, projMAch: (projM!==null && budMonth>0) ? projM/budMonth : null,
      needDay: rem>0 ? Math.max(0,(budMonth-mtd))/rem : null, runDay: d0 ? mtd/d0 : null,
      lyYTD, lyFY, growthYTD: lyYTD>0 ? ytd/lyYTD-1 : null,
      ytd, budFY, budYTD, achYTD, projFY: achYTD!==null ? ytd + (budFY-budYTD)*achYTD : null, projFYAch: (achYTD!==null && budFY>0) ? (ytd+(budFY-budYTD)*achYTD)/budFY : null,
      needDayG: (rem>0 && lyFull) ? Math.max(0, lyMonthFull*(1+gt)-mtd)/rem : null, needMonthG: (lyFull && remMonths>0) ? Math.max(0, lyFY*(1+gt)-ytd)/remMonths : null,
      projGrowthFY: null, // diisi di bawah (butuh projFY)
      needMonth: remMonths>0 ? Math.max(0,(budFY-ytd))/remMonths : null, avgMonth: elapsed>0 ? ytd/elapsed : null};
  };
  const rows = zonas.concat(['Total']).map(mk);
  rows.forEach(r=>{ r.projGrowthFY = (lyFull && r.projFY!==null && r.lyFY>0) ? r.projFY/r.lyFY-1 : null; });
  // kurva kumulatif bulan berjalan (total)
  const daily = []; let cumA = 0, cumB = 0; const cumBud = [];
  for(let d=1; d<=dim; d++){ cumB += fSum(bud.filter(r=>r.m===m0&&r.d===d), r=>r.value); cumBud.push(cumB); }
  for(let d=1; d<=d0; d++){ cumA += fSum(sales.filter(r=>r.m===m0&&r.d===d), r=>r.amt); daily.push(cumA); }
  const tot = rows[rows.length-1], pace = tot.achMTD;
  const proj = []; for(let d=1; d<=dim; d++) proj.push(d<d0 ? null : (d===d0 ? cumA : (pace!==null ? cumA + (cumBud[d-1]-cumBud[d0-1])*pace : null)));
  return {L, cy, m0, d0, dim, rem, rows, curve:{labels:Array.from({length:dim},(_,i)=>dateLabel(cy,m0,i+1)), actual:daily.concat(Array(dim-d0).fill(null)), budget:cumBud, proj}};
}

// ---------------- STOCK COVER (DOH) ----------------
function computeDOH(){
  const L = latestYMD(), win = [];
  for(let i=2;i>=0;i--){ let m = L.m - i, y = L.y; if(m<1){ m+=12; y-=1; } win.push({y,m}); }
  const days = fSum(win, w=> (w.y===L.y && w.m===L.m) ? (L.d||daysInMonth(w.y,w.m)) : daysInMonth(w.y,w.m));
  const keys = new Set(win.map(w=>w.y+'-'+w.m)), sold = new Map();
  STATE.itemFact.forEach(r=>{ if(keys.has(r.y+'-'+r.m)) sold.set(r.item,(sold.get(r.item)||0)+(r.qty||0)); });
  const cats = new Map(); const dead = [];
  STATE.sqvItems.forEach(it=>{
    if(!(it.qty>0 && it.value>0)) return;
    const c = it.cat || '(Tanpa Kategori)'; if(!cats.has(c)) cats.set(c,{cat:c,value:0,cogsDay:0,deadValue:0,slowValue:0,items:0});
    const o = cats.get(c), q = Math.max(0, sold.get(it.item)||0), perDay = q/days, cogs = perDay*(it.value/it.qty), doh = cogs>0 ? it.value/cogs : Infinity;
    o.value += it.value; o.cogsDay += cogs; o.items++;
    if(q<=0){ o.deadValue += it.value; dead.push({item:it.item, name:it.itemName, cat:c, value:it.value, qty:it.qty}); }
    if(doh>180) o.slowValue += it.value;
  });
  const rows = [...cats.values()].map(o=>({...o, doh:o.cogsDay>0 ? o.value/o.cogsDay : null})).sort((a,b)=>b.value-a.value);
  const tv = fSum(rows,r=>r.value), tc = fSum(rows,r=>r.cogsDay), td = fSum(rows,r=>r.deadValue), ts = fSum(rows,r=>r.slowValue);
  return {rows, days, win, total:{value:tv, cogsDay:tc, doh:tc>0?tv/tc:null, deadValue:td, slowValue:ts}, dead:dead.sort((a,b)=>b.value-a.value).slice(0,10)};
}

(function(){

      const grid = Array.from({length:7},()=>Array(24).fill(0)), dayN = Array(7).fill(0);
      rows.forEach(r=>{ const wd = (new Date(r.y, r.m-1, r.d).getDay()+6)%7; grid[wd][r.h] += r.amt; });

      const hMin = Math.min(...hrs), hMax = Math.max(...hrs), cols = []; for(let h=hMin;h<=hMax;h++) cols.push(h);
      const mx = Math.max(...grid.flat()), total = grid.flat().reduce((a,c)=>a+c,0), colT = cols.map(h=>grid.reduce((a,g)=>a+g[h],0)), rowT = grid.map(g=>g.reduce((a,c)=>a+c,0));

        <div class="tbl-scroll"><table><thead><tr><th>Hari</th>${cols.map(h=>`<th class="num">${String(h).padStart(2,'0')}</th>`).join('')}<th class="num">Total</th></tr></thead>
        <tbody>${grid.map((g,i)=>`<tr><td><b>${DN[i]}</b></td>${cols.map(h=>cell(g[h])).join('')}<td class="num"><b>${fmtNum(Math.round(rowT[i]/1e6))}</b></td></tr>`).join('')}

// ============================================================
// URUTAN KOLOM STANDAR: Budget › Sales TY › Sales LY › Ach › Growth › kolom lainnya (berlaku untuk semua tabel;
// grup Private Brand/PB+EB diurutkan sama di dalam grupnya). Dijalankan otomatis setiap tabel dirender.
// ============================================================
const COL_ROLES_MAIN = [
  ['budget', /^budget( (bulan|fy|toko|ytd|mtd))?$/],
  ['ty', /^(sales ty|actual ty|sales mtd|sales ytd)$/],
  ['ly', /^(sales ly|actual ly|ly|ly \/ tahun lalu|sales ly mtd|sales ly ytd)$/],
  ['ach', /^(achievement( \(%\))?|achieve|ach( ytd| mtd)?)$/],
  ['growth', /^(growth( \(%\))?|growth ytd|growth mtd)$/],
  ['diffb', /^diff budget$/],
  ['diffg', /^diff growth$/],
];
const COL_ROLES_PB = [
  ['budget', /^budget pb$/], ['ty', /^pb\+eb sales ty$/], ['ly', /^pb\+eb sales ly$/],
  ['ach', /^pb\+eb ach(ievement|\.)?$/], ['growth', /^pb\+eb growth$/],
];
function computeColOrder(txt){
  let order = txt.map((_,i)=>i), changed = false;
  for(const roles of [COL_ROLES_PB, COL_ROLES_MAIN]){
    const found = [];
    roles.forEach(([k,re])=>{ const i = txt.findIndex(t=>re.test(t)); if(i!==-1) found.push(i); }); // sudah urut sesuai peran
    if(found.length<2) continue;
    const set = new Set(found), firstPos = Math.min(...found.map(i=>order.indexOf(i)));
    const before = order.slice(0,firstPos).filter(i=>!set.has(i)), after = order.slice(firstPos).filter(i=>!set.has(i));
    const next = before.concat(found, after);
    if(next.join()!==order.join()){ order = next; changed = true; }
  }
  return changed ? order : null;
}
function applyColOrder(table){
  const order = table._colOrder; if(!order) return;
  const n = order.length;
  [...table.tBodies, table.tFoot].filter(Boolean).forEach(b=>[...b.rows].forEach(r=>{
    if(r._ord) return; r._ord = true;
    if(r.cells.length!==n) return;
    const cells = [...r.cells]; order.forEach(i=>r.appendChild(cells[i]));
  }));
}
function reorderTableCols(table){
  if(table._colInit){ if(table._colOrder) applyColOrder(table); return; } // tbody dirender ulang (search/load more) → urutkan baris baru
  const thead = table.tHead; if(!thead || thead.rows.length!==1) return;
  table._colInit = true;
  const ths = [...thead.rows[0].cells]; if(ths.some(c=>c.colSpan>1 || c.rowSpan>1)) return;
  const order = computeColOrder(ths.map(c=>c.textContent.replace(/\s+/g,' ').trim().toLowerCase()));
  if(!order) return;
  table._colOrder = order; thead.rows[0]._ord = true;
  const cells = [...thead.rows[0].cells]; order.forEach(i=>thead.rows[0].appendChild(cells[i]));
  applyColOrder(table);
}
const FIT_SECTIONS = ['overview','ytd','mtd','daily','ticket'];
function fitTables(){
  FIT_SECTIONS.forEach(id=>{ const sec = document.getElementById('sec-'+id); if(!sec) return;
    sec.querySelectorAll('.tbl-scroll').forEach(w=>{
      if(w._fit) return; const t = w.querySelector('table'); if(!t) return; w._fit = true; w.classList.add('tbl-fit');
      const n = (t.tHead && t.tHead.rows[0]) ? t.tHead.rows[0].cells.length : 0; if(n>=12) w.classList.add('tbl-dense');
    });
  });
}
function initColumnOrder(){
  const run = ()=>{ document.querySelectorAll('table').forEach(reorderTableCols); fitTables(); };
  let t = null;
  new MutationObserver(()=>{ clearTimeout(t); t = setTimeout(run, 0); }).observe(document.body, {childList:true, subtree:true});
  run();
}

  const fail = msg => { if(L) L.innerHTML = '<div style="max-width:420px;padding:24px;text-align:center;line-height:1.55;font-weight:500;">'+msg+'</div>'; };
  try{
    if(typeof DecompressionStream==='undefined') throw new Error('Browser belum mendukung data terkompres. Gunakan Chrome, Safari 16.4+, atau Firefox terbaru.');
    await window.__loadSiteData();
    const bin = atob(document.getElementById('seed-gz').textContent.trim()), bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    window.__SEED_TEXT = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    try{ const tb = atob(document.getElementById('member-tx-gz').textContent.trim()), tby = new Uint8Array(tb.length); for(let i=0;i<tb.length;i++) tby[i] = tb.charCodeAt(i);
      window.__MEMTX_TEXT = await new Response(new Blob([tby]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); }catch(e){ window.__MEMTX_TEXT = ''; }
    try{ const mb = atob(document.getElementById('member-gz').textContent.trim()), mby = new Uint8Array(mb.length); for(let i=0;i<mb.length;i++) mby[i] = mb.charCodeAt(i);
      window.__MEMBER_TEXT = await new Response(new Blob([mby]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); }catch(e){ window.__MEMBER_TEXT = '[]'; }
    for(let i=0;i<300 && !window.Chart;i++) await new Promise(r=>setTimeout(r,100)); // library grafik (CDN) dimuat paralel
    if(!window.Chart) throw new Error('Library grafik (Chart.js) gagal dimuat. Periksa koneksi internet lalu muat ulang.');
    const s = document.createElement('script'); s.textContent = document.getElementById('app-src').textContent; document.body.appendChild(s);
  }catch(e){ fail('Gagal memuat dashboard: '+((e&&e.message)||e)); }
})();

<script>
(function(){
  var mq = window.matchMedia('(max-width:820px)');
  function closeNav(){ document.body.classList.remove('nav-open'); }
  document.addEventListener('click', function(e){
    if(e.target.closest('#hamburger')){ document.body.classList.toggle('nav-open'); return; }
    if(e.target.closest('#nav-backdrop')){ closeNav(); return; }
    if(e.target.closest('#nav .nav-item')) closeNav();
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeNav(); });
  // filter global (bulan/zona/Excel) pindah ke menu geser di layar kecil
  function placeRight(){
    var right = document.querySelector('.topbar-right'), top = document.querySelector('.topbar'), side = document.querySelector('.sidebar'), foot = document.getElementById('sidebar-foot');
    if(!right || !top || !side) return;
    if(mq.matches){ if(right.parentElement!==side) side.insertBefore(right, foot || null); }
    else if(right.parentElement!==top) top.appendChild(right);
  }
  // tombol "Filter" yang bisa dibuka-tutup agar filter tidak memenuhi layar HP
  var timer = null;
  function addToggles(){
    document.querySelectorAll('#content .filter-bar').forEach(function(fb){
      if(fb.closest('.panel') || fb.querySelector(':scope > .fb-toggle')) return;
      var b = document.createElement('button'); b.type = 'button'; b.className = 'fb-toggle'; b.innerHTML = '<span>&#9881; Filter &amp; Periode</span><span class="fb-arrow">&#9662;</span>';
      b.addEventListener('click', function(){ fb.classList.toggle('open'); b.querySelector('.fb-arrow').innerHTML = fb.classList.contains('open') ? '&#9652;' : '&#9662;'; });
      fb.insertBefore(b, fb.firstChild);
    });
  }
  function schedule(){ clearTimeout(timer); timer = setTimeout(function(){ addToggles(); placeRight(); }, 120); }
  window.addEventListener('load', function(){ var c = document.getElementById('content'); if(c) new MutationObserver(schedule).observe(c, {childList:true, subtree:true}); schedule(); });
  if(mq.addEventListener) mq.addEventListener('change', function(){ placeRight(); closeNav(); }); 
  setTimeout(schedule, 1500); setTimeout(schedule, 4000);
})();
</script>
